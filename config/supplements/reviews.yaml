# Human review of the supplements source, keyed by the source page's heading
# (config/supplements/icc_schools.csv). Applied on every sync, after
# extraction and verification.
#
# checked: common_app    — compared prompt by prompt against the school's own
#                          Common App questions.
#          official_site — compared against the school's admissions website
#                          (weaker: some sites lag their Common App questions).
# status: none   — a reviewer found the block holds no prompt to write.
# corrections: fields to override on prompts whose text contains `match`
#              (or `drop: true` to remove one), where the compilation is
#              contradicted by the school's own source or is itself inconsistent.
#
# A correction is tied to the source text it was written against: when the
# school's block changes, sync drops that school back to unchecked and
# reports the correction for re-review instead of applying it blind.

cycle: "2026-2027"

schools:
  Boston University: {checked: common_app, checked_on: 2026-10-01, block_sha256: cf59292dc72d}
  Colgate University: {checked: common_app, checked_on: 2026-10-01}
  College of Charleston:
    checked: common_app
    checked_on: 2026-10-01
    block_sha256: 1c124212eb5e
    # Common App: required only for these applicants, optional for everyone else.
    corrections:
      - match: "anomalies or extenuating circumstances"
        requirement: optional
        applies_to: "Required if you graduated early, took a gap semester or year, or are completing a post-graduate year"
