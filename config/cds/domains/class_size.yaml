# I-2 (student-faculty ratio basis) and I-3 (class-section/subsection size
context_bindings:
- id: i2_reporting_term
  label: student-faculty ratio reporting term
  binders:
  - student_faculty_ratio_reporting_term
  targets:
    metric_ids:
    - students_per_faculty
    - ratio_basis_student_fte
    - ratio_basis_faculty_fte
    - undergraduate_supplemental_reported_value
- id: i3_reporting_term
  label: class-size reporting term
  binders:
  - class_size_reporting_term
  targets:
    metric_ids:
    - class_sections_2_9
    - class_sections_10_19
    - class_sections_20_29
    - class_sections_30_39
    - class_sections_40_49
    - class_sections_50_99
    - class_sections_100_plus
    - class_sections_reported_total
    - class_subsections_2_9
    - class_subsections_10_19
    - class_subsections_20_29
    - class_subsections_30_39
    - class_subsections_40_49
    - class_subsections_50_99
    - class_subsections_100_plus
    - class_subsections_reported_total
# bands) only. Per the CDS domain schema proposal, average class size,
# under-20 sections, and 50-plus sections are NOT printed anywhere on the
# form and must never be added here: they are calculations over the I-3
# bands below, and calculations are banned from the extraction contract.
id: class_size
title: Student-faculty ratio basis and undergraduate class-section size bands
metrics:
  - id: student_faculty_ratio_reporting_term
    description: >-
      Fall term or as-of date printed in the I-2 heading that establishes
      the reporting period binding the student-faculty ratio and both of
      its basis values.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [I-2]
    instructions: >-
      Extract the exact fall term or as-of date printed in the I-2
      student-faculty-ratio heading (for example "Fall 2025"). Preserve the
      exact printed wording; do not normalize it to a bare year or reuse the
      CDS edition academic_year. This is source context binding every I-2
      metric below. It is a separate printed item from
      class_size_reporting_term in I-3 and must not be merged with it even
      when the two happen to read the same.

  - id: students_per_faculty
    description: >-
      Student-to-faculty ratio printed in I-2 for the source-defined FTE
      student and instructional-faculty populations, after the stated
      stand-alone graduate/professional-program exclusions, expressed as
      the numeric students-per-one-faculty component.
    type: number
    unit: ratio
    population: student_faculty_ratio_students
    denominator: full_time_equivalent_faculty
    definition_variant: reported
    period_kind: fall_term
    source_hints: [I-2]
    instructions: >-
      Extract the numeric students-per-one-faculty component from the I-2
      printed "Student to Faculty ratio" response (for example, 11 from
      "11 to 1"). Bind it to student_faculty_ratio_reporting_term; do not
      substitute the CDS edition or the I-3 term. Copy the complete ratio
      response exactly as printed into
      raw_value; preserve wording and punctuation such as "to 1" or ":1"
      rather than normalizing them. The source defines both student and
      instructional-faculty FTE as full-time plus one-third part-time and
      excludes both students and faculty in stand-alone graduate or
      professional programs where faculty teach virtually only
      graduate-level students. It also excludes undergraduate and graduate
      student teaching assistants from faculty. This is not an
      undergraduate-only ratio and must not be confused with
      undergraduate_supplemental_reported_value, which is a separate,
      unverified, institution-added figure. Do not compute this value from
      ratio_basis_student_fte and ratio_basis_faculty_fte; extract the
      printed ratio independently even if it appears inconsistent with the
      basis values.

  - id: ratio_basis_student_fte
    description: >-
      Full-time-equivalent student count printed in I-2 as the ratio basis,
      using full-time plus one-third part-time students after the stated
      stand-alone graduate/professional-program exclusions.
    type: number
    unit: students
    population: student_faculty_ratio_students
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [I-2]
    instructions: >-
      Extract the I-2 printed FTE student count used as the ratio's basis,
      from the parenthetical "based on ... students" response, preserving
      fractional precision exactly as printed. Bind it to
      student_faculty_ratio_reporting_term; do not substitute the CDS
      edition or the I-3 term. The source defines student
      FTE as full-time plus one-third part-time and excludes students in
      stand-alone graduate or professional programs where faculty teach
      virtually only graduate-level students. This is the I-2 basis figure
      only; it includes eligible undergraduate and graduate students, is
      not the undergraduate or total enrollment headcount reported in
      B1/B2, and must not be derived by multiplying students_per_faculty by
      ratio_basis_faculty_fte.

  - id: ratio_basis_faculty_fte
    description: >-
      Full-time-equivalent instructional-faculty count printed in I-2 as
      the ratio basis, using full-time plus one-third part-time faculty
      after the stated exclusions.
    type: number
    unit: faculty
    population: student_faculty_ratio_instructional_faculty
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [I-2]
    instructions: >-
      Extract the I-2 printed FTE faculty count used as the ratio's basis,
      from the parenthetical "and ... faculty" response, preserving
      fractional precision exactly as printed. Bind it to
      student_faculty_ratio_reporting_term; do not substitute the CDS
      edition or the I-3 term. The source defines
      instructional-faculty FTE as full-time plus one-third part-time,
      excludes faculty in stand-alone graduate or professional programs
      where faculty teach virtually only graduate-level students, and does
      not count undergraduate or graduate student teaching assistants as
      faculty. This is not the I-1 total instructional-faculty headcount
      and must not be derived by dividing ratio_basis_student_fte by
      students_per_faculty.

  - id: undergraduate_supplemental_reported_value
    description: >-
      Literal value printed beside an institution-added "Ugrad Ratio"
      label near I-2, when present.
    type: string
    unit: text
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [I-2]
    instructions: >-
      Extract only the literal value an institution has added beside a
      self-authored label such as "Ugrad Ratio" adjacent to I-2 (Harvard's
      2025-26 form prints "7" this way). Bind it to
      student_faculty_ratio_reporting_term; do not substitute the CDS
      edition or the I-3 term. Copy it as an exact string in both value and
      raw_value. Do not append ":1" or otherwise reformat it; do
      not treat it as establishing an actual ratio, a denominator, an FTE
      computation method, or any exclusions; and do not assume it is
      undergraduate-only merely because of its label. This is not a
      standard template row: when the labeled row is absent, return
      not_in_template_version; reserve not_reported for a visibly present
      labeled row whose response cell is empty. Never emit a computed or
      zero value, and never copy students_per_faculty into this field or
      vice versa.

  - id: class_size_reporting_term
    description: >-
      Fall term or as-of date printed in the I-3 heading that establishes
      the reporting period binding every class-section and
      class-subsection band count below.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [I-3]
    instructions: >-
      Extract the exact fall term or as-of date printed in the I-3 heading
      (for example "Fall 2025"). Preserve the exact printed wording; do not
      normalize it to a bare year, reuse the CDS edition academic_year, or
      borrow student_faculty_ratio_reporting_term from I-2. This is source
      context binding every class_sections_* and class_subsections_*
      metric below.

  - id: class_sections_2_9
    description: Number of undergraduate class sections with 2 to 9 students, per I-3.
    type: integer
    unit: sections
    population: undergraduate_class_sections
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [I-3]
    instructions: >-
      Extract the I-3 "Class Sections" row, "2-9" column and bind it to
      class_size_reporting_term; do not use the I-2 term or CDS edition. A class section
      is an organized credit-bearing course identified by discipline and
      number, meeting at stated times in a classroom or similar setting,
      and not a lab, discussion, or other subsection. It is undergraduate
      when at least one degree-seeking undergraduate is enrolled for
      credit. Exclude distance-learning and noncredit classes; dissertation
      or thesis research, music instruction, one-to-one readings, and other
      individual instruction; and students in independent study,
      cooperative programs, internships, foreign-language taped tutor
      sessions, practicums, and all one-on-one classes. Count cross-listed
      sections once. Yale's version explicitly includes classes moved
      online because of COVID-19 despite the distance-learning exclusion.
      This is an offering count, not a student count or percentage. A
      visibly blank band is not_reported, never zero; a printed zero remains
      zero.

