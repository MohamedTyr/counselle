      is a supplementary lab, recitation, discussion, or similar course
      subdivision scheduled separately from the lecture. It is
      undergraduate when degree-seeking undergraduates are enrolled for
      credit. Exclude noncredit subsections and individual instruction such
      as dissertation or thesis research, music instruction, and one-to-one
      readings. Count cross-listed subsections once and never merge them
      with the Class Sections row. Yale's version explicitly includes
      classes moved online because of COVID-19. This is an offering count,
