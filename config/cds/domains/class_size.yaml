  - id: class_subsections_2_9
    description: >-
      Number of undergraduate class subsections (labs, discussion
      sections, and similar) with 2 to 9 students, per I-3.
    type: integer
    unit: sections
    population: undergraduate_class_subsections
    denominator: none
    definition_variant: reported
    period_kind: fall_term
