title: Enrollment and undergraduate composition
metrics:
  - {id: enrollment_snapshot_term_or_date, description: "Full printed qualified B1/B2 enrollment snapshot context stating the institution's official fall reporting date or October 15 of the printed year; this context binds every B1 and B2 metric in this domain.", type: string, unit: text, population: institution, denominator: none, definition_variant: printed, period_kind: fall_term, source_hints: [B1, B2], instructions: "Extract the complete printed B1/B2 qualified disjunction, such as 'as of the institution's official fall reporting date or as of October 15, 2025'. Preserve the full phrase and printed year exactly; do not reduce it to October 15, a bare date, a bare year, or the CDS edition academic_year."}
  - {id: undergraduate_full_time_degree_seeking_first_time_first_year_men, description: "Count of degree-seeking, first-time, first-year undergraduate students, full-time attendance, 'Men' (Yale 2024-25) / 'Males' (Harvard 2025-26) column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Degree-seeking, first-time, first-year students' (Yale 2024-25) / 'Degree-seeking, first-time first-year students' (Harvard 2025-26), 'Men' (Yale 2024-25) / 'Males' (Harvard 2025-26) column. Do not confuse with the 'Other first-year' row, which covers first-year students who are not first-time in higher education. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_degree_seeking_first_time_first_year_women, description: "Count of degree-seeking, first-time, first-year undergraduate students, full-time attendance, 'Women' (Yale 2024-25) / 'Females' (Harvard 2025-26) column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Degree-seeking, first-time, first-year students' (Yale 2024-25) / 'Degree-seeking, first-time first-year students' (Harvard 2025-26), 'Women' (Yale 2024-25) / 'Females' (Harvard 2025-26) column. Do not confuse with the 'Other first-year' row, which covers first-year students who are not first-time in higher education. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_degree_seeking_first_time_first_year_another_gender, description: "Count of degree-seeking, first-time, first-year undergraduate students, full-time attendance, Another Gender column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Degree-seeking, first-time, first-year students' (Yale 2024-25) / 'Degree-seeking, first-time first-year students' (Harvard 2025-26), Another Gender column. Do not confuse with the 'Other first-year' row, which covers first-year students who are not first-time in higher education. This column is printed only in CDS template versions that include an Another Gender column (for example Yale 2024-25); it is absent from versions that do not print it (for example Harvard 2025-26) -- a missing column is not_in_template_version, never zero. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_degree_seeking_first_time_first_year_unknown, description: "Count of degree-seeking, first-time, first-year undergraduate students, full-time attendance, Unknown column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Degree-seeking, first-time, first-year students' (Yale 2024-25) / 'Degree-seeking, first-time first-year students' (Harvard 2025-26), Unknown column. Do not confuse with the 'Other first-year' row, which covers first-year students who are not first-time in higher education. Unknown means the student's gender was not reported to the institution; do not confuse an unreported value with a row absent from the template. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_other_first_year_degree_seeking_men, description: "Count of degree-seeking undergraduate students who are first-year at this institution but not first-time in higher education (for example students who transferred in as a first-year), full-time attendance, 'Men' (Yale 2024-25) / 'Males' (Harvard 2025-26) column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Other first-year, degree-seeking students' (Yale 2024-25) / 'Other first-year, degree-seeking' (Harvard 2025-26), 'Men' (Yale 2024-25) / 'Males' (Harvard 2025-26) column. Do not confuse with the 'Degree-seeking, first-time, first-year' row; this row explicitly excludes first-time-in-higher-education students. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_other_first_year_degree_seeking_women, description: "Count of degree-seeking undergraduate students who are first-year at this institution but not first-time in higher education (for example students who transferred in as a first-year), full-time attendance, 'Women' (Yale 2024-25) / 'Females' (Harvard 2025-26) column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Other first-year, degree-seeking students' (Yale 2024-25) / 'Other first-year, degree-seeking' (Harvard 2025-26), 'Women' (Yale 2024-25) / 'Females' (Harvard 2025-26) column. Do not confuse with the 'Degree-seeking, first-time, first-year' row; this row explicitly excludes first-time-in-higher-education students. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_other_first_year_degree_seeking_another_gender, description: "Count of degree-seeking undergraduate students who are first-year at this institution but not first-time in higher education (for example students who transferred in as a first-year), full-time attendance, Another Gender column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Other first-year, degree-seeking students' (Yale 2024-25) / 'Other first-year, degree-seeking' (Harvard 2025-26), Another Gender column. Do not confuse with the 'Degree-seeking, first-time, first-year' row; this row explicitly excludes first-time-in-higher-education students. This column is printed only in CDS template versions that include an Another Gender column (for example Yale 2024-25); it is absent from versions that do not print it (for example Harvard 2025-26) -- a missing column is not_in_template_version, never zero. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_other_first_year_degree_seeking_unknown, description: "Count of degree-seeking undergraduate students who are first-year at this institution but not first-time in higher education (for example students who transferred in as a first-year), full-time attendance, Unknown column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Other first-year, degree-seeking students' (Yale 2024-25) / 'Other first-year, degree-seeking' (Harvard 2025-26), Unknown column. Do not confuse with the 'Degree-seeking, first-time, first-year' row; this row explicitly excludes first-time-in-higher-education students. Unknown means the student's gender was not reported to the institution; do not confuse an unreported value with a row absent from the template. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_all_other_degree_seeking_men, description: "Count of degree-seeking undergraduate students beyond the two first-year rows (continuing, upperclass degree-seeking students), full-time attendance, 'Men' (Yale 2024-25) / 'Males' (Harvard 2025-26) column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'All other degree-seeking undergraduate students' (Yale 2024-25) / 'All other degree-seeking' (Harvard 2025-26), 'Men' (Yale 2024-25) / 'Males' (Harvard 2025-26) column. Do not include first-year students already counted in the two first-year rows above. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_all_other_degree_seeking_women, description: "Count of degree-seeking undergraduate students beyond the two first-year rows (continuing, upperclass degree-seeking students), full-time attendance, 'Women' (Yale 2024-25) / 'Females' (Harvard 2025-26) column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'All other degree-seeking undergraduate students' (Yale 2024-25) / 'All other degree-seeking' (Harvard 2025-26), 'Women' (Yale 2024-25) / 'Females' (Harvard 2025-26) column. Do not include first-year students already counted in the two first-year rows above. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_all_other_degree_seeking_another_gender, description: "Count of degree-seeking undergraduate students beyond the two first-year rows (continuing, upperclass degree-seeking students), full-time attendance, Another Gender column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'All other degree-seeking undergraduate students' (Yale 2024-25) / 'All other degree-seeking' (Harvard 2025-26), Another Gender column. Do not include first-year students already counted in the two first-year rows above. This column is printed only in CDS template versions that include an Another Gender column (for example Yale 2024-25); it is absent from versions that do not print it (for example Harvard 2025-26) -- a missing column is not_in_template_version, never zero. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_all_other_degree_seeking_unknown, description: "Count of degree-seeking undergraduate students beyond the two first-year rows (continuing, upperclass degree-seeking students), full-time attendance, Unknown column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'All other degree-seeking undergraduate students' (Yale 2024-25) / 'All other degree-seeking' (Harvard 2025-26), Unknown column. Do not include first-year students already counted in the two first-year rows above. Unknown means the student's gender was not reported to the institution; do not confuse an unreported value with a row absent from the template. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_total_degree_seeking_men, description: "Count of total degree-seeking undergraduate students, the printed sum row of the three degree-seeking rows above, full-time attendance, 'Men' (Yale 2024-25) / 'Males' (Harvard 2025-26) column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Total degree-seeking undergraduate students' (Yale 2024-25) / 'Total degree-seeking' (Harvard 2025-26), 'Men' (Yale 2024-25) / 'Males' (Harvard 2025-26) column. Extract the printed total independently; never compute it by adding the other rows yourself. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
  - {id: undergraduate_full_time_total_degree_seeking_women, description: "Count of total degree-seeking undergraduate students, the printed sum row of the three degree-seeking rows above, full-time attendance, 'Women' (Yale 2024-25) / 'Females' (Harvard 2025-26) column, from the B1 fall enrollment grid.", type: integer, unit: students, population: full_time_undergraduates, denominator: none, definition_variant: total, period_kind: fall_term, source_hints: [B1], instructions: "Extract CDS B1 Undergraduate Full-time grid, row 'Total degree-seeking undergraduate students' (Yale 2024-25) / 'Total degree-seeking' (Harvard 2025-26), 'Women' (Yale 2024-25) / 'Females' (Harvard 2025-26) column. Extract the printed total independently; never compute it by adding the other rows yourself. This metric is bound to enrollment_snapshot_term_or_date; do not use the CDS edition academic_year as its period context."}
