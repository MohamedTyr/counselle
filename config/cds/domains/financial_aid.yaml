id: financial_aid
context_bindings:
- id: aid_reporting_period
  label: financial-aid reporting period and status
  binders:
  - aid_reporting_academic_year
  - aid_reporting_status
  targets:
    metric_ids:
    - h2_a_degree_seeking_undergraduates_first_time_first_year
    - h2_b_applied_for_need_based_aid_first_time_first_year
    - h2_c_determined_have_need_first_time_first_year
    - h2_d_awarded_any_aid_first_time_first_year
    - h2_e_awarded_need_based_grant_aid_first_time_first_year
    - h2_f_awarded_need_based_self_help_aid_first_time_first_year
    - h2_g_awarded_non_need_based_grant_aid_first_time_first_year
    - h2_h_need_fully_met_count_first_time_first_year
    - h2_i_average_percent_need_met_first_time_first_year
    - h2_i_average_percent_need_met_all_full_time
    - h2_j_average_aid_package_first_time_first_year
    - h2_j_average_aid_package_all_full_time
    - h2_k_average_need_based_grant_award_first_time_first_year
    - h2_l_average_need_based_self_help_award_first_time_first_year
    - h2_m_average_need_based_loan_award_first_time_first_year
    - h2a_n_no_need_institutional_grant_recipients_first_time_first_year
    - h2a_o_average_no_need_institutional_grant_amount_first_time_first_year
    - h2a_p_institutional_athletic_grant_recipients_first_time_first_year
    - h2a_q_average_institutional_athletic_grant_amount_first_time_first_year
    - h6_recipient_count
    - h6_average_institutional_aid
    - h6_total_institutional_aid
title: Financial aid
metrics:

  # H setup — aid reporting year, status, and need-analysis methodology context
  - id: aid_reporting_academic_year
    description: >-
      Academic year covered by the Section H financial-aid figures, from the H
      heading.
    type: string
    unit: academic_year
    population: institution
    denominator: none
    definition_variant: reported
    period_kind: aid_year
    source_hints: [H]
    instructions: >-
      Copy the aid-reporting academic year exactly as printed in the H section
      heading. This aid year is a distinct concept from the CDS edition, the
      fall enrollment snapshot, the admission cycle, and the cost year; do not
      copy it from `identity.academic_year` or `cost.cost_academic_year`. Every
      H1, H2, H2A, and the H6 numeric outcome metrics are bound to this
      aid-year context. H4/H5 use the separate graduating-class and
      degree-award-window context, while H6 policy selections and H7-H15 use
      policy context; do not bind those policy/cohort fields to this aid year.

  - id: aid_reporting_status
    description: >-
      Whether the Section H figures are reported as estimated or final, from
      the H heading.
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: aid_year
    enums: [estimated, final]
    source_hints: [H]
    instructions: >-
      Return exactly one of estimated or final, matched to the single selected
      status control printed beside the aid-reporting year ("Estimated" or
      "Final"). This is formerly labeled H3 in some editions; there is no
      separate H3 metric. Do not infer a status when the control is blank or
      unresolved.

  - id: need_analysis_methodology
    description: >-
      Which need-analysis methodology the institution uses to determine
      financial need, from the H heading.
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: aid_year
    enums: [federal, institutional, both]
    source_hints: [H]
    instructions: >-
      Return exactly one of federal, institutional, or both, matched to the
      single selected methodology control ("Federal Methodology,"
      "Institutional Methodology," or "Both"). This methodology selection
      governs how every H2/H2A need-based determination below was made; do not
      confuse it with the need_analysis_methodology used for cost-of-attendance
      calculations outside Section H.

  # H2 — need-based/non-need-based aid reach and averages, lettered rows A-M
  - id: h2_a_degree_seeking_undergraduates_first_time_first_year
    description: >-
      Count of degree-seeking undergraduates, full-time first-time first-year
      students, from CDS H2 row A.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row A ('Number of degree-seeking undergraduate students'),
      Full-Time First-Time First-Year Students column. This is the base
      population for the entire H2 conditional chain in this column; rows B
      through M below are progressively narrower subsets of this count.
      Preserve any apparent inconsistency in this column's reported figures
      (for example an internally inconsistent Harvard first-year row) exactly
      as printed; do not repair or reconcile it yourself.

  - id: h2_b_applied_for_need_based_aid_first_time_first_year
    description: >-
      Count of students from row A who applied for need-based financial aid,
      full-time first-time first-year students, from CDS H2 row B.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row B ('Number of students who applied for need-based
      financial aid'), Full-Time First-Time First-Year Students column. This is
      a subset of row A
      (`h2_a_degree_seeking_undergraduates_first_time_first_year`); it is not
      every degree-seeking student in this column. Preserve any apparent
      inconsistency in this column's reported figures (for example an
      internally inconsistent Harvard first-year row) exactly as printed; do
      not repair or reconcile it yourself.

  - id: h2_c_determined_have_need_first_time_first_year
    description: >-
      Count of students from row B determined to have financial need, full-time
      first-time first-year students, from CDS H2 row C.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row C ('Number of students who were determined to have
      financial need'), Full-Time First-Time First-Year Students column. This
      is a subset of row B
      (`h2_b_applied_for_need_based_aid_first_time_first_year`), determined
      using the methodology named in `need_analysis_methodology`. Preserve any
      apparent inconsistency in this column's reported figures (for example an
      internally inconsistent Harvard first-year row) exactly as printed; do
      not repair or reconcile it yourself.

  - id: h2_d_awarded_any_aid_first_time_first_year
    description: >-
      Count of students from row C who were awarded any financial aid,
      full-time first-time first-year students, from CDS H2 row D.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row D ('Number of students who were awarded any financial
      aid'), Full-Time First-Time First-Year Students column. This is a subset
      of row C (`h2_c_determined_have_need_first_time_first_year`); 'any
      financial aid' includes both need-based and non-need-based awards, not
      need-based aid alone. Preserve any apparent inconsistency in this
      column's reported figures (for example an internally inconsistent Harvard
      first-year row) exactly as printed; do not repair or reconcile it
      yourself.

  - id: h2_e_awarded_need_based_grant_aid_first_time_first_year
    description: >-
      Count of students from row D awarded need-based scholarship or grant aid,
      full-time first-time first-year students, from CDS H2 row E.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row E ('Number of students who were awarded need-based
      scholarship/grant aid'), Full-Time First-Time First-Year Students column.
      This is a subset of row D (`h2_d_awarded_any_aid_first_time_first_year`)
      restricted to need-based scholarship/grant recipients; do not include the
      need-based self-help recipients counted separately in row F. Preserve any
      apparent inconsistency in this column's reported figures (for example an
      internally inconsistent Harvard first-year row) exactly as printed; do
      not repair or reconcile it yourself.

  - id: h2_f_awarded_need_based_self_help_aid_first_time_first_year
    description: >-
      Count of students from row D awarded need-based self-help aid, full-time
      first-time first-year students, from CDS H2 row F.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row F ('Number of students who were awarded need-based
      self-help aid'), Full-Time First-Time First-Year Students column. This is
      a subset of row D (`h2_d_awarded_any_aid_first_time_first_year`)
      restricted to need-based self-help (qualifying employment and/or loan)
      recipients; do not include the need-based grant recipients counted
      separately in row E. Preserve any apparent inconsistency in this column's
      reported figures (for example an internally inconsistent Harvard
      first-year row) exactly as printed; do not repair or reconcile it
      yourself.

  - id: h2_g_awarded_non_need_based_grant_aid_first_time_first_year
    description: >-
      Count of students from row D awarded non-need-based scholarship or grant
      aid, full-time first-time first-year students, from CDS H2 row G.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row G ('Number of students who were awarded non-need-based
      scholarship/grant aid'), Full-Time First-Time First-Year Students column.
      This is a subset of row D (`h2_d_awarded_any_aid_first_time_first_year`);
      non-need-based aid is awarded without regard to demonstrated financial
      need. Preserve any apparent inconsistency in this column's reported
      figures (for example an internally inconsistent Harvard first-year row)
      exactly as printed; do not repair or reconcile it yourself.

  - id: h2_h_need_fully_met_count_first_time_first_year
    description: >-
      Count of students from row D whose full demonstrated need was met,
      full-time first-time first-year students, from CDS H2 row H.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row H ('Number of students whose need was fully met'),
      Full-Time First-Time First-Year Students column. This determination
      excludes PLUS loans, unsubsidized loans, and private alternative loans
      from the need-met calculation. It is a count subset of row D
      (`h2_d_awarded_any_aid_first_time_first_year`) and is a distinct field
      from the average-percent-of-need-met value in row I; do not confuse the
      two. Preserve any apparent inconsistency in this column's reported
      figures (for example an internally inconsistent Harvard first-year row)
      exactly as printed; do not repair or reconcile it yourself.

  - id: h2_i_average_percent_need_met_first_time_first_year
    description: >-
      Average percent of financial need met among recipients of any need-based
      aid, full-time first-time first-year students, from CDS H2 row I.
    type: number
    unit: percent
    population: enrolled_first_time_first_year
    denominator: need_based_aid_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row I ('Average percent of need met'), Full-Time
      First-Time First-Year Students column, as an ordinary percentage-point number; preserve the exact printed percentage token and precision in raw_value. Exclude aid awarded in excess of need and resources awarded to replace EFC (PLUS loans, unsubsidized loans, and private alternative loans), exactly as printed. This is not the headcount reported in row H. Preserve any apparent inconsistency
      in this column's reported figures (for example an internally inconsistent
      Harvard first-year row) exactly as printed; do not repair or reconcile it
      yourself.

  - id: h2_i_average_percent_need_met_all_full_time
    description: >-
      Average percent of financial need met among recipients of any need-based
      aid, all full-time undergraduates, including first-time first-years, from
      CDS H2 row I.
    type: number
    unit: percent
    population: full_time_undergraduates
    denominator: need_based_aid_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row I ('Average percent of need met'), All Full-Time
      Undergraduates (Including First-Time First-Year) column, as an ordinary percentage-point number; preserve the exact printed percentage token and precision in raw_value. Exclude aid awarded in excess of need and resources awarded to replace EFC (PLUS loans, unsubsidized loans, and private alternative loans), exactly as printed. This is not the headcount reported in row H.

  - id: h2_j_average_aid_package_first_time_first_year
    description: >-
      Average financial-aid package among students awarded any financial aid,
      full-time first-time first-year students, from CDS H2 row J.
    type: number
    unit: usd
    population: enrolled_first_time_first_year
    denominator: any_aid_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row J ('Average financial aid package'), Full-Time
      First-Time First-Year Students column, among students in row D
      (`h2_d_awarded_any_aid_first_time_first_year`). Preserve the printed
      dollar amount including cents; this average spans all included aid types together and is not a need-based-only average. Exclude resources awarded to replace EFC: PLUS loans, unsubsidized loans, and private alternative loans. Preserve any apparent inconsistency
      in this column's reported figures (for example an internally inconsistent
      Harvard first-year row) exactly as printed; do not repair or reconcile it
      yourself.

  - id: h2_j_average_aid_package_all_full_time
    description: >-
      Average financial-aid package among students awarded any financial aid,
      all full-time undergraduates, including first-time first-years, from CDS
      H2 row J.
    type: number
    unit: usd
    population: full_time_undergraduates
    denominator: any_aid_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status. Extract CDS H2 row J ('Average financial aid
      package'), All Full-Time Undergraduates (Including First-Time
      First-Year) column, among students in row D. Preserve the printed
      dollar amount including cents; this average spans all included aid
      types together and is not a need-based-only average. Exclude resources
      awarded to replace EFC: PLUS loans, unsubsidized loans, and private
      alternative loans.

  - id: h2_k_average_need_based_grant_award_first_time_first_year
    description: >-
      Average need-based scholarship or grant award among recipients, full-time
      first-time first-year students, from CDS H2 row K.
    type: number
    unit: usd
    population: enrolled_first_time_first_year
    denominator: need_based_grant_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row K ('Average need-based scholarship or grant award'),
      Full-Time First-Time First-Year Students column, among students in row E
      (`h2_e_awarded_need_based_grant_aid_first_time_first_year`). Do not
      confuse this with the self-help average in row L or the loan-only average
      in row M. Preserve any apparent inconsistency in this column's reported
      figures (for example an internally inconsistent Harvard first-year row)
      exactly as printed; do not repair or reconcile it yourself.

  - id: h2_l_average_need_based_self_help_award_first_time_first_year
    description: >-
      Average need-based self-help award among recipients, full-time first-time
      first-year students, from CDS H2 row L.
    type: number
    unit: usd
    population: enrolled_first_time_first_year
    denominator: need_based_self_help_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row L ('Average need-based self-help award'), Full-Time
      First-Time First-Year Students column, among students in row F
      (`h2_f_awarded_need_based_self_help_aid_first_time_first_year`). This average includes qualifying employment and/or loans combined, excluding PLUS loans, unsubsidized loans, and private alternative loans; it is not the loan-only subset averaged separately in row M. Preserve any apparent
      inconsistency in this column's reported figures (for example an
      internally inconsistent Harvard first-year row) exactly as printed; do
      not repair or reconcile it yourself.

  - id: h2_m_average_need_based_loan_award_first_time_first_year
    description: >-
      Average need-based loan award among the self-help recipients who received
      a need-based loan, full-time first-time first-year students, from CDS H2
      row M.
    type: number
    unit: usd
    population: enrolled_first_time_first_year
    denominator: need_based_loan_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2 row M ('Average need-based loan'), Full-Time First-Time
      First-Year Students column, among the subset of row F
      (`h2_f_awarded_need_based_self_help_aid_first_time_first_year`) who
      specifically received a need-based loan; this is narrower than the combined self-help average already captured in row L. Exclude PLUS loans, unsubsidized loans, and private alternative loans. Preserve any
      apparent inconsistency in this column's reported figures (for example an
      internally inconsistent Harvard first-year row) exactly as printed; do
      not repair or reconcile it yourself.

  # H2A — institutional non-need grants (N/O) and institutional athletic grants (P/Q)
  - id: h2a_n_no_need_institutional_grant_recipients_first_time_first_year
    description: >-
      Count of students with no financial need who received institutional
      non-need-based grants, full-time first-time first-year students, from CDS
      H2A row N.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2A]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2A row N ('Number of students who had no financial need and
      received institutional non-need-based scholarship/grant aid, excluding
      athletic awards and tuition benefits'), Full-Time First-Time First-Year
      Students column. Only rows N and O carry this explicit no-financial-need
      qualifier; rows P and Q below do not require it.

  - id: h2a_o_average_no_need_institutional_grant_amount_first_time_first_year
    description: >-
      Average institutional non-need-based grant amount among the row N
      recipients, full-time first-time first-year students, from CDS H2A row O.
    type: number
    unit: usd
    population: enrolled_first_time_first_year
    denominator: no_need_institutional_grant_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2A]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2A row O ('Average award to the row N recipients'),
      Full-Time First-Time First-Year Students column, among students in row N
      (`h2a_n_no_need_institutional_grant_recipients_first_time_first_year`).
      Preserve a literal 'NaN' or 'NA' marker exactly as printed status/raw
      evidence; never convert either marker to zero.

  - id: h2a_p_institutional_athletic_grant_recipients_first_time_first_year
    description: >-
      Count of students from H2 row A who received institutional non-need-based
      athletic grants, full-time first-time first-year students, from CDS H2A
      row P.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: aid_year
    source_hints: [H2A]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2A row P ('Number of students in H2 row A who received
      institutional non-need-based athletic scholarship/grant aid'), Full-Time
      First-Time First-Year Students column. The base population is H2 row A
      (`h2_a_degree_seeking_undergraduates_first_time_first_year`), not the
      no-financial-need subset used in rows N/O.

  - id: h2a_q_average_institutional_athletic_grant_amount_first_time_first_year
    description: >-
      Average institutional athletic grant amount among the row P recipients,
      full-time first-time first-year students, from CDS H2A row Q.
    type: number
    unit: usd
    population: enrolled_first_time_first_year
    denominator: institutional_athletic_grant_recipients
    definition_variant: average
    period_kind: aid_year
    source_hints: [H2A]
    instructions: >-
      Bind this metric to aid_reporting_academic_year and
      aid_reporting_status.
      Extract CDS H2A row Q ('Average award to the row P recipients'),
      Full-Time First-Time First-Year Students column, among students in row P
      (`h2a_p_institutional_athletic_grant_recipients_first_time_first_year`).
      Preserve a literal 'NaN' or 'NA' marker exactly as printed status/raw
      evidence; never convert either marker to zero.

  - id: graduating_class_first_time_bachelors_count
    description: >-
      Count of first-time entering students who earned bachelor's degrees
      within the H4 window.
    type: integer
    unit: students
    population: first_time_bachelors_graduates
    denominator: none
    definition_variant: total
    period_kind: cohort_year
    source_hints: [H4]
    instructions: >-
      Extract the H4 count of first-time-entering students (excluding
      transfer-ins) who were awarded a bachelor's degree within the
      degree-award window printed on the form. This is the base cohort ('the
      graduating class') for every H5 borrower count, percent, and average
      below; never compute it from H5 figures.

  - id: h5_borrowers_any_program_percent_of_class
    description: >-
      Percent of the H4 graduating class who borrowed through any loan program
      (all sources combined).
    type: number
    unit: percent
    population: first_time_bachelors_graduates
    denominator: graduating_class_first_time_bachelors_count
    definition_variant: share
    period_kind: cohort_year
    source_hints: [H5]
    instructions: >-
      Extract the H5 percent-of-class cell for any loan program (all sources combined), extract the reported percentage as a number rounded to the nearest 1%; preserve the exact displayed percentage token
      and precision in raw_value. The denominator is the graduating class in `graduating_class_first_time_bachelors_count`, not the borrower count itself. This figure includes student loans co-signed by a
      parent and excludes parent loans and any borrowing by the student at other institutions. Some template versions (for example Yale) explicitly exclude CARES Act or other COVID-unique emergency aid
      from this figure; treat that exclusion as printed template guidance, not a separate metric. Rows overlap across the five sources, so never sum borrower counts across sources to produce a total.

  - id: h5_borrowers_any_program_average_principal
    description: >-
      Average cumulative principal borrowed per borrower through any loan
      program (all sources combined).
    type: number
    unit: usd
    population: first_time_bachelors_graduates
    denominator: loan_borrowers
    definition_variant: average
    period_kind: cohort_year
    source_hints: [H5]
    instructions: >-
      Extract the H5 average-cumulative-principal-per-borrower cell for any
      loan program (all sources combined), preserving the exact printed
      rounding/precision. The average is taken only among borrowers of this
      source, not among the full graduating class. This figure includes student
      loans co-signed by a parent and excludes parent loans and any borrowing
      by the student at other institutions. Some template versions (for example
      Yale) explicitly exclude CARES Act or other COVID-unique emergency aid
      from this figure; treat that exclusion as printed template guidance, not
      a separate metric. Rows overlap across the five sources, so never sum
      borrower counts across sources to produce a total.

  - id: h5_borrowers_private_percent_of_class
    description: >-
