  # H6 — institutional aid policy and outcomes for nonresident undergraduates
  - id: h6_need_based_grants_available
    description: >-
      Whether need-based institutional grants are available to degree-seeking
      nonresident undergraduates, from H6.
    type: boolean
    unit: boolean
    population: degree_seeking_nonresident_undergraduates
    denominator: none
    definition_variant: availability
    period_kind: policy
    source_hints: [H6]
    instructions: >-
      Return true only when the H6 'need-based institutional grants available'
      control is visibly selected, and false only when the complete visible H6
      checklist shows it unambiguously unmarked. 'Nonresident' here is the CDS
      immigration/citizenship category, not out-of-state residency or tuition
      residency. The population is degree-seeking undergraduates only. Do not
      confuse this current-policy selection with the prior-year recipient-count
      and dollar outcomes below.

  - id: h6_non_need_based_grants_available
    description: >-
      Whether non-need-based institutional grants are available to
      degree-seeking nonresident undergraduates, from H6.
    type: boolean
    unit: boolean
    population: degree_seeking_nonresident_undergraduates
    denominator: none
    definition_variant: availability
    period_kind: policy
    source_hints: [H6]
    instructions: >-
      Return true only when the H6 'non-need-based institutional grants
      available' control is visibly selected, and false only when the complete
      visible H6 checklist shows it unambiguously unmarked. This is independent
      of `h6_need_based_grants_available`; both may be true.

  - id: h6_grants_unavailable
    description: >-
      Whether the institution reports that institutional grants are unavailable
      to degree-seeking nonresident undergraduates, from H6.
    type: boolean
    unit: boolean
    population: degree_seeking_nonresident_undergraduates
    denominator: none
    definition_variant: availability
    period_kind: policy
    source_hints: [H6]
    instructions: >-
      Return true only when the H6 'institutional grants unavailable' control
      is visibly selected, and false only when the complete visible H6
      checklist shows it unambiguously unmarked. Keep this policy selection
      separate from the two availability booleans above; a blank/unresolved
      checklist does not default this to true.

  - id: h6_recipient_count
    description: >-
      Count of degree-seeking nonresident undergraduates who received
      institutional aid, from H6.
