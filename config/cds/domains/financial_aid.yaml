  # H4 — graduating-class context binding every H5 debt metric
  - id: graduating_class_year
    description: >-
      Graduating class year used as the base cohort for the H5 cumulative-debt
      figures, from the H4 heading.
    type: string
    unit: years
    population: first_time_bachelors_graduates
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [H4]
    instructions: >-
      Bind this metric to graduating_class_year,
      degree_award_window_start, and degree_award_window_end.
      Copy the H4 graduating-class year exactly as printed (for example the
      'class of' year). This cohort year is a distinct concept from
      `aid_reporting_academic_year`, the CDS edition, and the fall enrollment
      snapshot; every `h5_*` metric in this domain is bound to this same
      graduating-class context, not to the aid-reporting year.

  - id: degree_award_window_start
    description: >-
      Start of the degree-conferral window used to define the H4 graduating
      class, from the H4 heading.
    type: string
    unit: date
    population: first_time_bachelors_graduates
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [H4]
    instructions: >-
      Bind this metric to graduating_class_year,
      degree_award_window_start, and degree_award_window_end.
      Copy the H4 degree-award window start date exactly as printed, preserving
      a partial date without a year as a string. This binds
      `graduating_class_first_time_bachelors_count` and every `h5_*` metric to the
      exact conferral window used.

  - id: degree_award_window_end
    description: >-
      End of the degree-conferral window used to define the H4 graduating
      class, from the H4 heading.
    type: string
    unit: date
    population: first_time_bachelors_graduates
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [H4]
    instructions: >-
      Bind this metric to graduating_class_year,
      degree_award_window_start, and degree_award_window_end.
      Copy the H4 degree-award window end date exactly as printed, preserving a
      partial date without a year as a string.

  - id: graduating_class_first_time_bachelors_count
    description: >-
      Count of first-time entering students who earned bachelor's degrees
      within the H4 window.
    type: integer
    unit: students
    population: first_time_bachelors_graduates
    denominator: none
    definition_variant: total
    period_kind: cohort_year
    source_hints: [H4]
    instructions: >-
      Bind this metric to graduating_class_year,
      degree_award_window_start, and degree_award_window_end.
      Extract the H4 count of first-time-entering students (excluding
      transfer-ins) who were awarded a bachelor's degree within the
      `degree_award_window_start`/`degree_award_window_end` window. This
      is the base cohort ('the graduating class') for every H5 borrower count,
      percent, and average below; never compute it from H5 figures.

  # H5 — cumulative principal borrowed by the H4 graduating class, five loan sources
  - id: h5_borrowers_any_program_count
    description: >-
      Count of H4 graduating-class borrowers who borrowed through any loan
      program (all sources combined).
    type: integer
    unit: students
    population: first_time_bachelors_graduates
    denominator: none
    definition_variant: total
    period_kind: cohort_year
    source_hints: [H5]
    instructions: >-
      Bind this metric to graduating_class_year,
      degree_award_window_start, and degree_award_window_end.
      Extract the H5 borrower-count cell for any loan program (all sources
      combined), among the graduating class defined by
      `graduating_class_first_time_bachelors_count`. This figure includes student
      loans co-signed by a parent and excludes parent loans and any borrowing
      by the student at other institutions. Some template versions (for example
      Yale) explicitly exclude CARES Act or other COVID-unique emergency aid
      from this figure; treat that exclusion as printed template guidance, not
      a separate metric. Rows overlap across the five sources, so never sum
      borrower counts across sources to produce a total. This row combines all
      loan sources below; rows overlap because a borrower can appear in more
      than one source, so never sum the other four sources to reproduce it.

  - id: h5_borrowers_any_program_percent_of_class
    description: >-
      Percent of the H4 graduating class who borrowed through any loan program
      (all sources combined).
    type: number
    unit: percent
    population: first_time_bachelors_graduates
    denominator: graduating_class_first_time_bachelors_count
    definition_variant: share
    period_kind: cohort_year
    source_hints: [H5]
    instructions: >-
      Bind this metric to graduating_class_year,
      degree_award_window_start, and degree_award_window_end.
      Extract the H5 percent-of-class cell for any loan program (all sources
      combined), extract the reported percentage as a number rounded to the nearest 1%; preserve the exact displayed percentage token and precision in raw_value. The denominator is the graduating class in
      `graduating_class_first_time_bachelors_count`, not the borrower count itself.
      This figure includes student loans co-signed by a parent and excludes
      parent loans and any borrowing by the student at other institutions. Some
      template versions (for example Yale) explicitly exclude CARES Act or
      other COVID-unique emergency aid from this figure; treat that exclusion
      as printed template guidance, not a separate metric. Rows overlap across
      the five sources, so never sum borrower counts across sources to produce
      a total.

