  # H15 — recent affordability initiatives narrative
  - id: recent_affordability_initiative_details
    description: >-
      Verbatim narrative describing any major financial-aid policy, program,
      or initiative recently implemented to make the institution more
      affordable to incoming students, from H15.
    type: string
    unit: text
    population: incoming_students
    denominator: none
    definition_variant: reported
    period_kind: policy
    source_hints: [H15]
    instructions: >-
      Treat "recently implemented" as relative to this CDS edition; do not use
      a live website or the H1 aid-reporting year to redefine the period. Copy
      the H15 narrative response exactly as printed, verbatim, including
      every threshold, comparator, asset qualifier, covered-cost scope,
      institutional scope, effective period, and individualized-aid caveat. A
      literal 'NO' printed under this prompt (for example Yale's response)
      remains the reported narrative value; there is no separate boolean
      initiative-present field. Do not parse, structure, or summarize the
      thresholds described in the text; that is downstream work, not
      extraction.

  - id: affordability_initiative_covid_related
    description: >-
      Whether a recently implemented initiative to make the institution more
      affordable to incoming students is COVID-related, from H15
      (version-specific and relative to this CDS edition).
    type: boolean
    unit: boolean
    population: incoming_students
    denominator: none
    definition_variant: policy
    period_kind: policy
    source_hints: [H15]
    instructions: >-
      Interpret the initiative's recency relative to this CDS edition, not the
      H1 aid-reporting year or a live website. Extract the version-specific H15
      sub-question asking whether the described initiative is related to the
      COVID-19 pandemic, present only in template editions that print a
      distinct control for it. In an edition
      that does not print this control, this metric is not_in_template_version,
      never false.
