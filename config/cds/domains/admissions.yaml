id: admissions
title: First-year admission volumes, requirements, selection, and enrollment policy
metrics:

  # C1 — optional residency table (application-address based)
  - id: applicants_residency_in_state
    description: >-
      In-state applicants among degree-seeking first-time first-year
      applicants, from the optional C1 residency table.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who applied" at the "IN-STATE" column, based on
      physical address at application. This table is separate from the
      gender table; never merge them. A visible blank cell is not_reported;
      an absent table is not_in_template_version, never zero.

  - id: applicants_residency_out_of_state
    description: >-
      Out-of-state applicants among degree-seeking first-time first-year
      applicants, from the optional C1 residency table.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who applied" at the "OUT-OF-STATE" column, based on
      physical address at application. A visible blank cell is not_reported;
      an absent table is not_in_template_version, never zero.

  - id: applicants_residency_international
    description: >-
      International applicants among degree-seeking first-time first-year
      applicants, from the optional C1 residency table.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year (degree-seeking)
      who applied" at the exact "INTERNATIONAL" column, based on physical
      address at application. Do not reinterpret this residency column as
      nonresident status or redistribute it. A visible blank is not_reported;
      an absent table is not_in_template_version, never zero.

  - id: admitted_residency_in_state
    description: >-
      In-state applicants admitted among degree-seeking first-time
      first-year applicants, from the optional C1 residency table.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who were admitted" at the "IN-STATE" column. Do not
      derive blank geographic cells or totals.

  - id: admitted_residency_out_of_state
    description: >-
      Out-of-state applicants admitted among degree-seeking first-time
      first-year applicants, from the optional C1 residency table.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who were admitted" at the "OUT-OF-STATE" column. Do
      not derive blank geographic cells or totals.

  - id: admitted_residency_international
    description: >-
      International applicants admitted among degree-seeking first-time
      first-year applicants, from the optional C1 residency table.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year (degree-seeking)
      who were admitted" at the exact "INTERNATIONAL" column. Do not
      reinterpret this residency column as nonresident status, redistribute
      it, or derive blank cells or totals.

  - id: enrolled_residency_international
    description: >-
      International students enrolled among degree-seeking first-time
      first-year students, from the optional C1 residency table.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who enrolled" at the exact "INTERNATIONAL" column. Do
      not reinterpret this residency column as nonresident status,
      redistribute it, or derive blank cells or totals.

  # C1 — TOTAL column (the single overall applicants/admitted/enrolled counts)
  - id: applicants_total
    description: >-
      Total degree-seeking first-time first-year applicants, from the C1
      residency table's TOTAL column.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who applied" at the "TOTAL" column. This is the only
      overall applicants total in C1; the gender table has no additional
      overall response, so never sum its rows.

  - id: admitted_total
    description: >-
      Total degree-seeking first-time first-year applicants admitted, from
      the C1 residency table's TOTAL column.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who were admitted" at the "TOTAL" column. Do not
      derive it from geographic or gender cells.

  - id: enrolled_total
    description: >-
      Total degree-seeking first-time first-year students enrolled, from
      the C1 residency table's TOTAL column.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who enrolled" at the "TOTAL" column. Do not derive it
      from geographic or gender cells.

  # C2 — wait list
  - id: has_waitlist_policy
    description: "Whether the institution has a waiting list for first-time first-year applicants, per C2."
    type: boolean
    unit: boolean
    population: first_time_first_year_waitlist
    denominator: none
    definition_variant: policy
    period_kind: admission_cycle
    source_hints: [C2]
    instructions: >-
      Extract the C2 Yes/No control for whether the institution has a
      waiting list. Return true/false only from an unambiguous selected
      control; a blank or unresolvable control stays not_reported or
      unresolved, never false.

  - id: waitlist_offered_place_count
    description: "Students offered a place on the first-time first-year waiting list, per C2."
    type: integer
    unit: students
    population: first_time_first_year_waitlist
    denominator: none
    definition_variant: total
    period_kind: admission_cycle
    source_hints: [C2]
    instructions: >-
      Extract C2 row "Number of qualified applicants offered a place on
      waiting list" at the "TOTAL" column. "Offered a place" means placed
      on the wait list, not admitted; do not confuse with
      waitlist_admitted_count.

  - id: waitlist_accepted_place_count
    description: "Students accepting their offered place on the first-time first-year waiting list, per C2."
    type: integer
    unit: students
    population: first_time_first_year_waitlist
    denominator: none
    definition_variant: total
    period_kind: admission_cycle
    source_hints: [C2]
    instructions: >-
      Extract C2 row "Number accepting a place on the waiting list" at the
      "TOTAL" column. This is the printed count of students opting into the
      waiting list, not a rate or a derived value.

  - id: waitlist_admitted_count
    description: "Wait-listed students admitted from the first-time first-year waiting list, per C2."
    type: integer
    unit: students
    population: first_time_first_year_waitlist
    denominator: none
    definition_variant: total
    period_kind: admission_cycle
    source_hints: [C2]
    instructions: >-
      Extract C2 row "Number of wait-listed students admitted" at the
      "TOTAL" column. This is the printed count ultimately admitted from the
      waiting list, not a rate or a derived value.

  # C3 — high-school completion requirement
  - id: high_school_completion_requirement
    description: "High-school completion requirement selected for admission, per C3."
    type: enum
    unit: category
    population: prospective_undergraduate
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [diploma_required_ged_accepted, diploma_required_ged_not_accepted, diploma_or_equivalent_not_required]
    source_hints: [C3]
    instructions: >-
      Return exactly one of diploma_required_ged_accepted,
      diploma_required_ged_not_accepted, or
      diploma_or_equivalent_not_required, matched to the single selected C3
      checkbox: "Diploma required, GED accepted," "Diploma required, GED
      not accepted," or "Diploma or equivalent not required." Never guess
      the selection from school reputation or outside knowledge.

  # C4 — college-preparatory program requirement
  - id: college_prep_program_requirement
    description: "College-preparatory program requirement for admission, per C4."
    type: enum
    unit: category
    population: prospective_undergraduate
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required, recommended, neither]
    source_hints: [C4]
    instructions: >-
      Return exactly one of required, recommended, or neither, matched to
      the single selected C4 checkbox: "Required," "Recommended," or
      "Neither required nor recommended."

  # C5 — Carnegie units, required and recommended, per subject
  - id: total_academic_units_required
    description: "Carnegie units of total academic units required for admission for all or most applicants, per C5."
    type: number
    unit: carnegie_units
    population: prospective_undergraduate
    denominator: none
    definition_variant: required
    period_kind: policy
    source_hints: [C5]
    instructions: >-
      Extract C5 row "Total academic units" at column "Units Required"
      for all or most applicants. Preserve fractional units exactly as
      printed; a blank cell is not_reported, never zero.

  - id: total_academic_units_recommended
    description: "Carnegie units of total academic units recommended for admission for all or most applicants, per C5."
    type: number
    unit: carnegie_units
    population: prospective_undergraduate
