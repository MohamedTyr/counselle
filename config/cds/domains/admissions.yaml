    period_kind: policy
    source_hints: [C5]
    instructions: >-
      Copy the institution-entered subject name beside C5 row "Other
      (specify)" exactly as
      written. Leave not_reported when the label cell is visibly blank;
      do not infer a label from other_units_required or
      other_units_recommended.

  # C6 — open admission
  - id: open_admission_all_students
    description: "Whether the institution selects the described open admission policy for all students, per C6."
    type: boolean
    unit: boolean
    population: prospective_undergraduate
    denominator: none
    definition_variant: selected
    period_kind: policy
    source_hints: [C6]
    instructions: >-
      Extract the exact C6 checklist option "Open admission policy as
      described above for all students." Do not narrow "all students" to
      degree-seeking first-time first-year students. Emit true only when
      visibly checked; emit false only when the complete C6 checklist is
      visible and this box is unambiguously unmarked. There is no separate
      overall "has open admission" response; each C6 box is its own selection.

  - id: open_admission_selective_out_of_state
    description: "Whether the institution's open admission policy is selective for certain out-of-state students, per C6."
    type: boolean
    unit: boolean
    population: prospective_undergraduate
    denominator: none
    definition_variant: selected
    period_kind: policy
    source_hints: [C6]
    instructions: >-
      Extract the C6 checklist box for open admission that is selective
      for certain out-of-state students. Emit true only when visibly
      checked; emit false only when the complete C6 checklist is visible
      and this box is unambiguously unmarked.

  - id: open_admission_selective_programs
    description: "Whether the institution's open admission policy is selective for particular academic programs, per C6."
    type: boolean
    unit: boolean
    population: prospective_undergraduate
    denominator: none
    definition_variant: selected
    period_kind: policy
    source_hints: [C6]
    instructions: >-
      Extract the C6 checklist box for open admission that is selective
      for particular academic programs. Emit true only when visibly
      checked; emit false only when the complete C6 checklist is visible
      and this box is unambiguously unmarked.

  - id: open_admission_other
    description: "Whether an Other open-admission condition applies, per C6."
    type: boolean
    unit: boolean
    population: prospective_undergraduate
    denominator: none
    definition_variant: selected
    period_kind: policy
    source_hints: [C6]
    instructions: >-
      Extract the C6 "Other" checkbox only. Emit true only when visibly
      checked; emit false only when the complete C6 checklist is visible
      and this box is unambiguously unmarked. Never set this true solely
      because the C6 "Other" explanation field contains text.

  # C7 — selection factors
  - id: selection_factor_rigor_of_secondary_school_record
    description: "Importance of rigor of secondary-school record in admission decisions, per C7."
    type: enum
    unit: category
    population: prospective_undergraduate
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [very_important, important, considered, not_considered]
    source_hints: [C7]
    instructions: >-
      Map the exact visible labels "Very Important" to very_important,
      "Important" to important, "Considered" to considered, and "Not
      Considered" to not_considered. Return exactly one of very_important,
