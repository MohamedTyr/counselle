id: admissions
context_bindings:
- id: c1_entering_class
  label: entering class
  binders:
  - first_year_admission_entry_term
  - first_year_admission_entry_year
  targets:
    metric_ids:
    - applicants_men
    - applicants_women
    - applicants_another_gender
    - applicants_unknown
    - admitted_men
    - admitted_women
    - admitted_another_gender
    - admitted_unknown
    - enrolled_men
    - enrolled_women
    - enrolled_another_gender
    - enrolled_unknown
    - enrolled_full_time_men
    - enrolled_full_time_women
    - enrolled_full_time_another_gender
    - enrolled_full_time_unknown
    - enrolled_part_time_men
    - enrolled_part_time_women
    - enrolled_part_time_another_gender
    - enrolled_part_time_unknown
    - applicants_residency_in_state
    - applicants_residency_out_of_state
    - applicants_residency_international
    - applicants_residency_unknown
    - admitted_residency_in_state
    - admitted_residency_out_of_state
    - admitted_residency_international
    - admitted_residency_unknown
    - enrolled_residency_in_state
    - enrolled_residency_out_of_state
    - enrolled_residency_international
    - enrolled_residency_unknown
    - applicants_total
    - admitted_total
    - enrolled_total
- id: c8a_testing_cohort
  label: testing-policy entering class
  binders:
  - testing_policy_entry_term
  - testing_policy_entry_year
  targets:
    metric_ids:
    - uses_entrance_exam_scores_in_admission
    - sat_or_act_admission_policy
    - act_only_admission_policy
    - sat_only_admission_policy
- id: c21_early_decision_cohort
  label: early-decision entering class
  binders:
  - early_decision_entry_term
  - early_decision_entry_year
  targets:
    metric_ids:
    - early_decision_offered
    - early_decision_first_closing_date
    - early_decision_first_notification_date
    - early_decision_other_closing_date
    - early_decision_other_notification_date
    - early_decision_application_count
    - early_decision_admitted_count
    - early_decision_details_raw
title: First-year admission volumes, requirements, selection, and enrollment policy
metrics:
  # C1 — source context binding every C1 count
  - id: first_year_admission_entry_term
    description: "Entry term named in the C1 first-time first-year admission prompt (for example Fall)."
    type: string
    unit: text
    population: first_time_first_year
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Copy the term word printed in the C1 heading that identifies which
      entering class the applicant/admitted/enrolled counts describe. This
      is source context binding every C1 count; it is not an
      institution-entered response and not the CDS edition.

  - id: first_year_admission_entry_year
    description: "Entry year named in the C1 first-time first-year admission prompt."
    type: string
    unit: academic_year
    population: first_time_first_year
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Copy the year printed in the C1 heading that identifies which
      entering class the applicant/admitted/enrolled counts describe. This
      is source context binding every C1 count; it is not the CDS edition
      and not an item-specific reporting period from another section.

  # C1 — outcome x gender (degree-seeking, full- and part-time, named fall)
  - id: applicants_men
    description: "Men among degree-seeking first-time first-year applicants, per C1."
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year men who applied" (Yale)
      or "Total first-time, first-year males who applied" (Harvard) at the
      "TOTAL" column, bound to first_year_admission_entry_term and
      first_year_admission_entry_year.
      The C1 gender block prints no additional overall-total response;
      never sum the four gender rows to derive one. Keep separate from
      women, another-gender, and unknown-gender counts.

  - id: applicants_women
    description: "Women among degree-seeking first-time first-year applicants, per C1."
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year women who applied"
      (Yale) or "Total first-time, first-year females who applied"
      (Harvard) at the "TOTAL" column, bound to
      first_year_admission_entry_term and first_year_admission_entry_year.
      The C1 gender block prints no additional overall-total response;
      never sum the four gender rows to derive one. Keep separate from
      men, another-gender, and unknown-gender counts.

  - id: applicants_another_gender
    description: >-
      Students identifying as another gender among degree-seeking
      first-time first-year applicants, per C1. Distinct from unknown
      gender.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year of another gender who
      applied" at the "TOTAL" column. This row is present in Yale 2024-25
      and absent from Harvard 2025-26; an absent row is
      not_in_template_version, never zero. "Another Gender" is not
      "Unknown"; never merge them. This metric is bound to
      first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: applicants_unknown
    description: >-
      Applicants of unknown or unreported gender among degree-seeking
      first-time first-year applicants, per C1.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year of unknown gender who
      applied" (Yale) or "Total first-time, first-year students of unknown
      sex who applied" (Harvard) at the "TOTAL" column. "Unknown" is not
      "Another Gender"; keep them separate. A visible empty response cell
      is not_reported, never zero. This metric is bound to
      first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: admitted_men
    description: "Men among degree-seeking first-time first-year applicants admitted, per C1."
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year men who were admitted"
      (Yale) or "Total first-time, first-year males who were admitted"
      (Harvard) at the "TOTAL" column. Keep separate from women,
      another-gender, and unknown-gender counts. This metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: admitted_women
    description: "Women among degree-seeking first-time first-year applicants admitted, per C1."
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year women who were admitted"
      (Yale) or "Total first-time, first-year females who were admitted"
      (Harvard) at the "TOTAL" column. Keep separate from men,
      another-gender, and unknown-gender counts. This metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: admitted_another_gender
    description: >-
      Students identifying as another gender among degree-seeking
      first-time first-year applicants admitted, per C1.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year of another gender who
      were admitted" at the "TOTAL" column. This row is present in Yale
      2024-25 and absent from Harvard 2025-26; an absent row is
      not_in_template_version, never zero. "Another Gender" is not
      "Unknown"; never merge them. This metric is bound to
      first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: admitted_unknown
    description: >-
      Applicants of unknown or unreported gender among degree-seeking
      first-time first-year applicants admitted, per C1.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year of unknown gender who
      were admitted" (Yale) or "Total first-time, first-year students of
      unknown sex who were admitted" (Harvard) at the "TOTAL" column.
      "Unknown" is not "Another Gender"; keep them separate. This metric is
      bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: enrolled_men
    description: "Men among degree-seeking first-time first-year students enrolled full- or part-time, per C1."
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year men who enrolled" (Yale)
      or "Total first-time, first-year males who enrolled" (Harvard) at the
      "TOTAL" column. Keep separate from women, another-gender, and
      unknown-gender counts. This row combines full- and part-time
      enrollment and is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: enrolled_women
    description: "Women among degree-seeking first-time first-year students enrolled full- or part-time, per C1."
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year women who enrolled"
      (Yale) or "Total first-time, first-year females who enrolled"
      (Harvard) at the "TOTAL" column. Keep separate from men,
      another-gender, and unknown-gender counts. This row combines full-
      and part-time enrollment and is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: enrolled_another_gender
    description: >-
      Students identifying as another gender among degree-seeking
      first-time first-year students enrolled full- or part-time, per C1.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year of another gender who
      enrolled" at the "TOTAL" column. This row is present in Yale 2024-25
      and absent from Harvard 2025-26; an absent row is
      not_in_template_version, never zero. "Another Gender" is not
      "Unknown"; never merge them. This row combines full- and part-time
      enrollment and is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: enrolled_unknown
    description: >-
      Students of unknown or unreported gender among degree-seeking
      first-time first-year students enrolled full- or part-time, per C1.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total first-time, first-year of unknown gender who
      enrolled" (Yale) or "Total first-time, first-year students of unknown
      sex who enrolled" (Harvard) at the "TOTAL" column. "Unknown" is not
      "Another Gender"; keep them separate. This row combines full- and
      part-time enrollment and is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  # C1 — enrolled attendance status x gender
  - id: enrolled_full_time_men
    description: "Full-time men among degree-seeking first-time first-year students enrolled, per C1."
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 "First-Time, First-Year Student Enrollees by Status" row
      "Total full-time, first-time, first-year men who enrolled" (Yale) or
      "Total full-time, first-time, first-year males who enrolled" (Harvard)
      at the "TOTAL" column. Keep separate from enrolled_part_time_men. This
      metric is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: enrolled_full_time_women
    description: "Full-time women among degree-seeking first-time first-year students enrolled, per C1."
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 "First-Time, First-Year Student Enrollees by Status" row
      "Total full-time, first-time, first-year women who enrolled" (Yale) or
      "Total full-time, first-time, first-year females who enrolled"
      (Harvard) at the "TOTAL" column. Keep separate from
      enrolled_part_time_women. This metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: enrolled_full_time_another_gender
    description: >-
      Full-time students identifying as another gender among degree-seeking
      first-time first-year students enrolled, per C1.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract the first occurrence of C1 row "Total full-time, first-time,
      first-year of another gender who enrolled" at the "TOTAL" column.
      Yale has a second occurrence of that exact row label; it has no safe
      normalized meaning and is preserved separately as
      enrolled_status_another_gender_full_time_label_occurrence_2_raw.
      Never relabel occurrence 2 as part-time or use it for this metric.
      Harvard lacks the Another Gender row, so it is
      not_in_template_version, never zero. This metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: enrolled_full_time_unknown
    description: >-
      Full-time students of unknown or unreported gender among
      degree-seeking first-time first-year students enrolled, per C1.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract the first occurrence of C1 row "Total full-time, first-time,
      first-year of unknown gender who enrolled" (Yale), or row "Total
      full-time, first-time, first-year students of unknown sex who enrolled"
      (Harvard), at the "TOTAL" column. Yale has a second occurrence of its
      exact row label; it has no safe normalized meaning and is preserved as
      enrolled_status_unknown_full_time_label_occurrence_2_raw. Never
      relabel occurrence 2 as part-time or use it for this metric. This
      metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: enrolled_part_time_men
    description: "Part-time men among degree-seeking first-time first-year students enrolled, per C1."
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 "First-Time, First-Year Student Enrollees by Status" row
      "Total part-time, first-time, first-year men who enrolled" (Yale) or
      "Total part-time, first-time, first-year males who enrolled" (Harvard)
      at the "TOTAL" column. Keep separate from enrolled_full_time_men. This
      metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: enrolled_part_time_women
    description: "Part-time women among degree-seeking first-time first-year students enrolled, per C1."
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 "First-Time, First-Year Student Enrollees by Status" row
      "Total part-time, first-time, first-year women who enrolled" (Yale) or
      "Total part-time, first-time, first-year females who enrolled"
      (Harvard) at the "TOTAL" column. Keep separate from
      enrolled_full_time_women. This metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: enrolled_part_time_another_gender
    description: >-
      Part-time students identifying as another gender among degree-seeking
      first-time first-year students enrolled, per C1.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract only an authoritatively printed C1 row "Total part-time,
      first-time, first-year of another gender who enrolled" at the "TOTAL"
      column. Yale prints no such row: its second Another Gender observation
      repeats the full-time row label and is preserved only as
      enrolled_status_another_gender_full_time_label_occurrence_2_raw. A
      genuinely absent row is not_in_template_version, never zero. This
      metric is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: enrolled_part_time_unknown
    description: >-
      Part-time students of unknown or unreported gender among
      degree-seeking first-time first-year students enrolled, per C1.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 row "Total part-time, first-time, first-year students of
      unknown sex who enrolled" (Harvard), or the exact unknown-gender
      equivalent only when authoritatively printed, at the "TOTAL" column.
      Yale instead repeats its full-time unknown-gender row label; preserve
      occurrence 2 only as
      enrolled_status_unknown_full_time_label_occurrence_2_raw and never use
      it here. This metric is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  # C1 — Yale-version positional duplicate raw evidence
  - id: enrolled_status_another_gender_full_time_label_occurrence_2_raw
    description: >-
      Value at the TOTAL column for occurrence 2 of Yale C1 row "Total
      full-time, first-time, first-year of another gender who enrolled";
      positional raw evidence only.
    type: string
    unit: text
    population: first_time_first_year
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Preserve the value at Yale's "TOTAL" column for occurrence 2 of exact
      C1 row "Total full-time, first-time, first-year of another gender who
      enrolled," including the exact row label, occurrence index, and
      printed value. This positional
      occurrence has no safe normalized attendance-status meaning; never
      relabel it as part-time and never use it to overwrite
      enrolled_full_time_another_gender or
      enrolled_part_time_another_gender. Harvard's version, which does not
      exhibit this duplicate labeling, is not_in_template_version for this
      metric. This metric is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: enrolled_status_unknown_full_time_label_occurrence_2_raw
    description: >-
      Value at the TOTAL column for occurrence 2 of Yale C1 row "Total
      full-time, first-time, first-year of unknown gender who enrolled";
      positional raw evidence only.
    type: string
    unit: text
    population: first_time_first_year
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Preserve the value at Yale's "TOTAL" column for occurrence 2 of exact
      C1 row "Total full-time, first-time, first-year of unknown gender who
      enrolled," including the exact row label, occurrence index, and
      printed value. This positional
      occurrence has no safe normalized attendance-status meaning; never
      relabel it as part-time and never use it to overwrite
      enrolled_full_time_unknown or enrolled_part_time_unknown. Harvard's
      version, which does not exhibit this duplicate labeling, is
      not_in_template_version for this metric. This metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  # C1 — optional residency table (application-address based)
  - id: applicants_residency_in_state
    description: >-
      In-state applicants among degree-seeking first-time first-year
      applicants, from the optional C1 residency table.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who applied" at the "IN-STATE" column, based on
      physical address at application. This table is separate from the
      gender table; never merge them. A visible blank cell is not_reported;
      an absent table is not_in_template_version, never zero. This metric is
      bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: applicants_residency_out_of_state
    description: >-
      Out-of-state applicants among degree-seeking first-time first-year
      applicants, from the optional C1 residency table.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who applied" at the "OUT-OF-STATE" column, based on
      physical address at application. A visible blank cell is not_reported;
      an absent table is not_in_template_version, never zero. This metric is
      bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: applicants_residency_international
    description: >-
      International applicants among degree-seeking first-time first-year
      applicants, from the optional C1 residency table.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who applied" at the exact "INTERNATIONAL" column,
      based on physical address at application. Do not reinterpret this
      residency column as nonresident status or redistribute it. A visible
      blank is not_reported; an absent table is not_in_template_version,
      never zero. This metric is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: applicants_residency_unknown
    description: >-
      Applicants of unknown residency among degree-seeking first-time
      first-year applicants, from the optional C1 residency table.
    type: integer
    unit: applicants
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who applied" at the "UNKNOWN" column, based on
      physical address at application. Yale 2024-25 has no "UNKNOWN"
      column, so this metric is not_in_template_version for that version. A
      visible empty "UNKNOWN" cell is not_reported, never zero. This metric
      is bound to first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: admitted_residency_in_state
    description: >-
      In-state applicants admitted among degree-seeking first-time
      first-year applicants, from the optional C1 residency table.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who were admitted" at the "IN-STATE" column. Do not
      derive blank geographic cells or totals. This metric is bound to
      first_year_admission_entry_term and first_year_admission_entry_year.

  - id: admitted_residency_out_of_state
    description: >-
      Out-of-state applicants admitted among degree-seeking first-time
      first-year applicants, from the optional C1 residency table.
    type: integer
    unit: students
    population: first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C1]
    instructions: >-
      Extract C1 residency row "Total first-time, first-year
      (degree-seeking) who were admitted" at the "OUT-OF-STATE" column. Do
      not derive blank geographic cells or totals. This metric is bound to
      first_year_admission_entry_term and
      first_year_admission_entry_year.

  - id: admitted_residency_international
    description: >-
      International applicants admitted among degree-seeking first-time
      first-year applicants, from the optional C1 residency table.
    type: integer
    unit: students
    population: first_time_first_year
