id: faculty
context_bindings:
- id: i1_reporting_term
  label: faculty reporting term
  binders:
  - faculty_reporting_term
  targets:
    metric_ids:
    - total_instructional_faculty_full_time
    - total_instructional_faculty_part_time
    - total_instructional_faculty_reported_total
    - minority_faculty_full_time
    - minority_faculty_part_time
    - minority_faculty_reported_total
    - women_faculty_full_time
    - women_faculty_part_time
    - women_faculty_reported_total
    - men_faculty_full_time
    - men_faculty_part_time
    - men_faculty_reported_total
    - nonresident_faculty_full_time
    - nonresident_faculty_part_time
    - nonresident_faculty_reported_total
    - doctorate_or_terminal_degree_faculty_full_time
    - doctorate_or_terminal_degree_faculty_part_time
    - doctorate_or_terminal_degree_faculty_reported_total
    - nonterminal_masters_faculty_full_time
    - nonterminal_masters_faculty_part_time
    - nonterminal_masters_faculty_reported_total
    - bachelors_highest_degree_faculty_full_time
    - bachelors_highest_degree_faculty_part_time
    - bachelors_highest_degree_faculty_reported_total
    - unknown_or_other_highest_degree_faculty_full_time
    - unknown_or_other_highest_degree_faculty_part_time
    - unknown_or_other_highest_degree_faculty_reported_total
    - stand_alone_graduate_program_faculty_full_time
    - stand_alone_graduate_program_faculty_part_time
    - stand_alone_graduate_program_faculty_reported_total
title: Instructional faculty composition and qualifications
metrics:
  - id: faculty_reporting_term
    description: >-
      Fall term or as-of date printed in the I-1 section heading that
      establishes the reporting snapshot binding every I-1 faculty count in
      this domain.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [I-1]
    instructions: >-
      Extract the exact term or date printed in the I-1 heading (for example "Fall 2025"). Preserve the exact printed wording; do not normalize it to a bare
      year, and do not reuse the CDS edition `academic_year` or any other domain's reporting term/context metric.

  - id: total_instructional_faculty_full_time
    description: >-
      Full-time instructional faculty headcount, the printed I-1 total
      instructional faculty row, Full-Time column.
    type: integer
    unit: faculty
    population: instructional_faculty
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [I-1]
    instructions: >-
      Extract CDS I-1, row "Total instructional faculty", Full-Time column. This is a headcount, not an FTE or a percentage. Classify faculty into the
      full-time column exactly per the CDS I-1 printed inclusion/exclusion matrix (see CDS I-1 inclusion/exclusion matrix): it directs how to treat
      administrators who teach, medical faculty, replacement faculty covering a colleague's leave, faculty compensated through donated/contributed-service
      arrangements, and teaching assistants. Never apply an invented classification rule. This row is the printed grand total; it is not the sum of the
      demographic/degree rows defined elsewhere in this domain, and it does not add in the stand-alone graduate/professional-program row. Bind this value to
      `faculty_reporting_term`; never bind it to `academic_year` or another domain context. Apply the complete CDS I-1 matrix exactly: preclinical/clinical
      medicine faculty, unpaid faculty (including donated-service or military faculty), research-only faculty, and postdoctoral or predoctoral fellows are
      excluded from Full-Time and included in Part-Time only if they teach one or more nonclinical credit courses; administrative officers such as deans,
      librarians, registrars, and coaches, even when they have faculty status or devote time to instruction, are excluded from Full-Time and included in
      Part-Time only if they teach one or more nonclinical credit courses; other administrators or staff without faculty status who teach one or more
      nonclinical credit courses are excluded from Full-Time and included in Part-Time; undergraduate or graduate teaching assistants and teaching fellows
      are excluded from both; faculty on sabbatical or leave with pay are included in Full-Time and excluded from Part-Time; faculty on leave without pay
      are excluded from both; replacement faculty for faculty on sabbatical or leave with pay are excluded from Full-Time and included in Part-Time.

  - id: total_instructional_faculty_part_time
    description: >-
      Part-time instructional faculty headcount, the printed I-1 total
      instructional faculty row, Part-Time column.
    type: integer
    unit: faculty
    population: instructional_faculty
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [I-1]
    instructions: >-
      Extract CDS I-1, row "Total instructional faculty", Part-Time column. This is a headcount, not an FTE or a percentage. Classify faculty into the
      part-time column exactly per the CDS I-1 printed inclusion/exclusion matrix (see CDS I-1 inclusion/exclusion matrix): it directs how to treat
      administrators who teach, medical faculty, replacement faculty covering a colleague's leave, faculty compensated through donated/contributed-service
      arrangements, and teaching assistants. Never apply an invented classification rule. This row is the printed grand total; it is not the sum of the
      demographic/degree rows defined elsewhere in this domain, and it does not add in the stand-alone graduate/professional-program row. Bind this value to
      `faculty_reporting_term`; never bind it to `academic_year` or another domain context. Apply the complete CDS I-1 matrix exactly: preclinical/clinical
      medicine faculty, unpaid faculty (including donated-service or military faculty), research-only faculty, and postdoctoral or predoctoral fellows are
      excluded from Full-Time and included in Part-Time only if they teach one or more nonclinical credit courses; administrative officers such as deans,
      librarians, registrars, and coaches, even when they have faculty status or devote time to instruction, are excluded from Full-Time and included in
      Part-Time only if they teach one or more nonclinical credit courses; other administrators or staff without faculty status who teach one or more
      nonclinical credit courses are excluded from Full-Time and included in Part-Time; undergraduate or graduate teaching assistants and teaching fellows
      are excluded from both; faculty on sabbatical or leave with pay are included in Full-Time and excluded from Part-Time; faculty on leave without pay
      are excluded from both; replacement faculty for faculty on sabbatical or leave with pay are excluded from Full-Time and included in Part-Time.

  - id: total_instructional_faculty_reported_total
    description: >-
      Total instructional faculty headcount, the printed I-1 total
      instructional faculty row, reported Total column (when the form
      prints one).
    type: integer
    unit: faculty
    population: instructional_faculty
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [I-1]
    instructions: >-
      Extract CDS I-1, row "Total instructional faculty", the printed Total/combined column, as an independent source cell. Never compute this value by
      adding the full-time and part-time cells yourself, even when both are present and appear to agree. If that form version does not print a combined
      Total column for this row, return `not_in_template_version`; do not use `not_reported` and never derive a total. Bind this value to
      `faculty_reporting_term`; never bind it to `academic_year` or another domain context.

  - id: minority_faculty_full_time
    description: >-
      Full-time instructional faculty who are members of CDS-defined
      minority groups, the printed I-1 minority-faculty row, Full-Time
      column.
    type: integer
    unit: faculty
    population: instructional_faculty
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [I-1]
    instructions: >-
      Extract CDS I-1, row for members of minority groups, Full-Time column. Use the CDS form's own printed combined minority-group definition for who
      counts here; do not substitute a locally invented taxonomy such as "URM" or "BIPOC," and do not derive this from race categories reported elsewhere in
      the CDS. Classify faculty into the full-time column per the CDS I-1 printed inclusion/exclusion matrix (see CDS I-1 inclusion/exclusion matrix) for
      administrators who teach, medical faculty, replacement faculty, donated-service faculty, and teaching assistants. This is a headcount, not a
      percentage. Bind this value to `faculty_reporting_term`; never bind it to `academic_year` or another domain context. Apply the complete CDS I-1 matrix
      exactly: preclinical/clinical medicine faculty, unpaid faculty (including donated-service or military faculty), research-only faculty, and
      postdoctoral or predoctoral fellows are excluded from Full-Time and included in Part-Time only if they teach one or more nonclinical credit courses;
      administrative officers such as deans, librarians, registrars, and coaches, even when they have faculty status or devote time to instruction, are
      excluded from Full-Time and included in Part-Time only if they teach one or more nonclinical credit courses; other administrators or staff without
      faculty status who teach one or more nonclinical credit courses are excluded from Full-Time and included in Part-Time; undergraduate or graduate
      teaching assistants and teaching fellows are excluded from both; faculty on sabbatical or leave with pay are included in Full-Time and excluded from
      Part-Time; faculty on leave without pay are excluded from both; replacement faculty for faculty on sabbatical or leave with pay are excluded from
      Full-Time and included in Part-Time. For this combined source category, minority faculty means faculty who self-designate as Black, non-Hispanic;
      American Indian or Alaska Native; Asian; Native Hawaiian or other Pacific Islander; or Hispanic.

