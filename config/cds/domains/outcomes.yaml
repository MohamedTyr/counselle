title: Awards, completion cohorts, transfer-out outcomes, and retention
metrics:
  - id: awards_window_start
    description: Start date of the degree/award reporting window printed on B3.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: reporting_cycle
    source_hints: [B3]
    instructions: >-
      Copy the B3 award-window start date exactly as printed in the item
      header (for example the July 1 start of the reporting year). This is
      the degree award window, not the CDS edition
      (`identity.academic_year`) and not a fall-snapshot or admission-cycle
      term. Every B3 award count metric below is bound to this window.

  - id: awards_window_end
    description: End date of the degree/award reporting window printed on B3.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: reporting_cycle
    source_hints: [B3]
    instructions: >-
      Copy the B3 award-window end date exactly as printed in the item
      header (for example the June 30 end of the reporting year). Pair with
      `awards_window_start`; never assume a year not printed.

  - id: awards_certificate_diploma
    description: >-
      Certificate/diploma awards below the associate level conferred during
      the `awards_window_start`-`awards_window_end` reporting window.
    type: integer
    unit: awards
    population: institution
    denominator: none
    definition_variant: total
    period_kind: reporting_cycle
    source_hints: [B3]
    instructions: >-
      Extract the B3 award-count response only from the exact visible row
      alias named below. This counts awards conferred, not unique graduates (a
      student earning two credentials in the window is counted in each row)
      and B3 combines certificate and diploma awards in one row. Do not sum
      rows to produce a total not printed on the form, and do not confuse with
      the A5 degree-offered checklist, which reports offerings rather than
      annual award counts. Bind this value to `awards_window_start` and
      `awards_window_end`. The exact visible row label in both versions is
      "Certificate/diploma".

  - id: awards_associate
