  - id: bachelors_primary_cohort_year
    description: >-
      Entry year of the primary bachelor's completion cohort from the
      first/most recent visible B4-B11 cohort grid.
    type: integer
    unit: academic_year
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [B4-B11]
    instructions: >-
      Copy the cohort entry year printed in the header of the first/most
      recent visible B4-B11 cohort grid (for example the entering class the
      grid tracks). `primary` and `comparison` are static slot labels for
      the first and second visible grids, never a calendar year baked into a
      durable metric ID; the actual year value belongs only in this context
      metric. Every row below for this slot is bound to this cohort year.
      The B4-B11 grid is a wide table: each lettered row (A through H) repeats
      across up to four population columns (Pell Grant recipients, Subsidized
      Stafford Loan recipients without Pell, students with neither, and the
      Total column), and the same lettered rows recur again in the second,
      visually similar comparison-cohort grid elsewhere in this section.
      Treat every printed row/column cell in this grid as a separate metric
      to check; do not stop partway through the grid or skip a cell only
      because its row label looks like one already handled in the other
      grid. Only omit a specific cell if that cell's value is genuinely not
      printed.

  - id: primary_four_year_completion_cutoff
    description: >-
      Printed four-year completion cutoff date/description for the primary
      B4-B11 cohort.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [B4-B11]
    instructions: >-
      Copy the complete printed four-year cutoff context from the first/most
      recent visible B4-B11 cohort grid verbatim, including qualifying words
      such as "by" or "after" (for example "by August 2019"). Do not reduce it
      to a bare year; this is source context for the four-year completion rows
      below. Bind this context to `bachelors_primary_cohort_year`.

  - id: primary_fifth_year_interval_start
    description: >-
      Printed start of the fifth-year completion interval for the primary
      B4-B11 cohort.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [B4-B11]
    instructions: >-
      Copy the complete printed start of the "after four, within five years"
      interval from the first/most recent visible B4-B11 cohort grid verbatim.
      Keep distinct from the four-year cutoff and the interval end; this is
      incremental context, not the cumulative six-year window. Bind this
      context to `bachelors_primary_cohort_year`.

  - id: primary_fifth_year_interval_end
    description: >-
      Printed end of the fifth-year completion interval for the primary
      B4-B11 cohort.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [B4-B11]
    instructions: >-
      Copy the complete printed end of the "after four, within five years"
      interval from the first/most recent visible B4-B11 cohort grid verbatim.
      Do not merge with the sixth-year interval end. Bind this context to
      `bachelors_primary_cohort_year`.

  - id: primary_sixth_year_interval_start
    description: >-
      Printed start of the sixth-year completion interval for the primary
      B4-B11 cohort.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [B4-B11]
    instructions: >-
      Copy the complete printed start of the "after five, within six years"
      interval from the first/most recent visible B4-B11 cohort grid verbatim.
