  - id: primary_sixth_year_interval_end
    description: >-
      Printed end of the sixth-year completion interval for the primary
      B4-B11 cohort.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: cohort_year
    source_hints: [B4-B11]
    instructions: >-
      Copy the complete printed end of the "after five, within six years"
      interval from the first/most recent visible B4-B11 cohort grid verbatim;
      this is the six-year cutoff referenced by the aid-group-specific
      six-year graduation-rate metrics below. Bind this context to
      `bachelors_primary_cohort_year`.

  - id: bachelors_comparison_cohort_year
