  - id: class_rank_submitted_percent
    description: >-
      Percent of enrolled first-time, first-year students for whom high-school class
      rank was reported, from C10.
    type: string
    unit: percent
    population: enrolled_first_time_first_year
    denominator: enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [C10]
    instructions: >-
      Extract the C10 "percent of first-time, first-year students who submitted
      class rank" cell, preserving any qualifier such as "<1%". Denominator is all
      enrolled first-time first-years, not only those with rank reported.

  - id: class_rank_top_tenth_percent
    description: >-
      Percent of rank-reporting enrolled first-time, first-year students in the top
      tenth of their high-school class, from C10.
    type: string
    unit: percent
    population: enrolled_first_time_first_year_rank_reported
    denominator: rank_reported_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [C10]
    instructions: >-
      Extract the C10 "Top Tenth" row, preserving any qualifier such as "<1%". This
      band is contained within the top-quarter and top-half bands; never derive one
      band from another or subtract to fill a blank.

  - id: class_rank_top_quarter_percent
    description: >-
      Percent of rank-reporting enrolled first-time, first-year students in the top
      quarter of their high-school class, from C10.
    type: string
    unit: percent
    population: enrolled_first_time_first_year_rank_reported
    denominator: rank_reported_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [C10]
    instructions: >-
      Extract the C10 "Top Quarter" row, preserving any qualifier such as "<1%".
      This band contains the top-tenth band and is contained within the top-half
      band; never derive one band from another or subtract to fill a blank.

  - id: class_rank_top_half_percent
    description: >-
      Percent of rank-reporting enrolled first-time, first-year students in the top
