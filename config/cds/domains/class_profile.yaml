  - id: average_high_school_gpa
    description: >-
      Average high-school GPA among GPA-reporting enrolled first-time, first-year
      students, from C12.
    type: number
    unit: gpa
    population: enrolled_first_time_first_year_gpa_reported
    denominator: gpa_reported_students
    definition_variant: average
    period_kind: fall_term
    source_hints: [C12]
    instructions: >-
      Extract only the C12 printed average GPA value. Do not clamp an out-of-range
      value (for example Harvard's 4.22) and do not assume every edition uses an
      unweighted 4.0 scale.

  - id: high_school_gpa_submitted_percent
    description: >-
      Percent of enrolled first-time, first-year students for whom high-school GPA
