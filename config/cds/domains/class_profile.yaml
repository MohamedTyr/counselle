title: First-time first-year enrolled class profile
metrics:
  - id: class_profile_entry_term
    description: >-
      Entry term for the enrolled first-year class profiled in C9-C12, from the C9
      profile prompt heading.
    type: string
    unit: text
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [C9]
    instructions: >-
      Copy the entry term (for example "Fall") from the C9 profile prompt heading
      exactly as printed. This is source context that binds every other
      `class_profile` metric; do not substitute the CDS edition label
      (`identity.academic_year`) or the C8 testing-policy cohort term.

  - id: class_profile_entry_year
    description: >-
      Entry year for the enrolled first-year class profiled in C9-C12, from the C9
      profile prompt heading.
    type: string
    unit: text
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [C9]
    instructions: >-
      Copy the entry year from the C9 profile prompt heading exactly as printed.
      This is source context that binds every other `class_profile` metric; do not
      substitute the CDS edition label (`identity.academic_year`) or the C8
      testing-policy cohort year.

  - id: sat_submitters_percent
    description: >-
      Percent of enrolled degree-seeking first-time, first-year students in the C9
      reporting cohort who submitted SAT scores, excluding students admitted under
      policies that do not require a high-school diploma or equivalent and students
      who began in winter or spring.
    type: string
    unit: percent
    population: enrolled_first_time_first_year
    denominator: enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [C9]
    instructions: >-
      Extract the C9 SAT row's "percent submitting" cell exactly as printed,
      preserving any qualifier such as "<1%". Bind to `class_profile_entry_term` and
      `class_profile_entry_year`. SAT and ACT submitter populations overlap; never
      derive one from the other or sum them. Population excludes students admitted
      under policies that do not require a high-school diploma or equivalent and
      students who began in winter/spring.

  - id: sat_submitters_count
    description: >-
      Number of enrolled degree-seeking first-time, first-year students in the C9
      reporting cohort who submitted SAT scores, excluding students admitted under
      policies that do not require a high-school diploma or equivalent and students
      who began in winter or spring.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C9]
    instructions: >-
      Extract the C9 SAT row's "number submitting" cell. Bind to
      `class_profile_entry_term` and `class_profile_entry_year`. This count and
      `sat_submitters_percent` describe the same submitters; never recompute one
      from the other. Population excludes students admitted under policies that do
      not require a high-school diploma or equivalent and students who began in
      winter/spring.

  - id: act_submitters_percent
    description: >-
      Percent of enrolled degree-seeking first-time, first-year students in the C9
      reporting cohort who submitted ACT scores, excluding students admitted under
      policies that do not require a high-school diploma or equivalent and students
      who began in winter or spring.
    type: string
    unit: percent
    population: enrolled_first_time_first_year
    denominator: enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [C9]
    instructions: >-
      Extract the C9 ACT row's "percent submitting" cell exactly as printed,
      preserving any qualifier such as "<1%". Bind to `class_profile_entry_term` and
      `class_profile_entry_year`. SAT and ACT submitter populations overlap; never
      derive one from the other or sum them. Population excludes students admitted
      under policies that do not require a high-school diploma or equivalent and
      students who began in winter/spring.

  - id: act_submitters_count
    description: >-
      Number of enrolled degree-seeking first-time, first-year students in the C9
      reporting cohort who submitted ACT scores, excluding students admitted under
      policies that do not require a high-school diploma or equivalent and students
      who began in winter or spring.
    type: integer
    unit: students
    population: enrolled_first_time_first_year
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [C9]
    instructions: >-
      Extract the C9 ACT row's "number submitting" cell. Bind to
      `class_profile_entry_term` and `class_profile_entry_year`. This count and
      `act_submitters_percent` describe the same submitters; never recompute one
      from the other. Population excludes students admitted under policies that do
      not require a high-school diploma or equivalent and students who began in
      winter/spring.

  - id: sat_composite_p25
    description: >-
      25th percentile SAT Composite score among enrolled first-time,
      first-year submitters of SAT Composite scores, from C9.
    type: integer
    unit: score
    population: enrolled_first_time_first_year_sat_submitters
    denominator: sat_composite_submitters
    definition_variant: percentile_25
    period_kind: fall_term
    source_hints: [C9]
    instructions: >-
      Extract the C9 SAT Composite 25th-percentile score cell. Denominator is enrolled first-time, first-year
      submitters of SAT Composite scores, bound to `class_profile_entry_term` and
      `class_profile_entry_year`. A blank cell means this score breakdown is
      unavailable, not a zero score.

  - id: sat_composite_p50
