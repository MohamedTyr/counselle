title: Percent of conferred majors by broad CIP discipline and credential level
metrics:
  # Reporting-window and CIP-version context.
  # Every discipline and reported-total metric below binds to these
  # three context metrics for its exact period; see rule 8/rule 4 of
  # the CDS YAML authoring contract.
  - id: degree_reporting_window_start
    description: >-
      First day of the CDS Section J degree-conferral reporting window,
      printed on the J heading as source context for every discipline and
      total metric in this domain.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: degree_window
    source_hints: [J]
    instructions: >-
      Copy the printed start date of the Section J degree-conferral window
      exactly as a string (for example Harvard's 2024-07-01 or Yale's
      2023-07-01). This is prompt/header context, not an institution-entered
      response; do not substitute the CDS edition, an admission cycle, a cost
      year, or an aid reporting year for it. Every discipline and
      reported-total metric in this domain binds to this window.

  - id: degree_reporting_window_end
    description: >-
      Last day of the CDS Section J degree-conferral reporting window, printed
      on the J heading as source context for every discipline and total metric
      in this domain.
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: degree_window
    source_hints: [J]
    instructions: >-
      Copy the printed end date of the Section J degree-conferral window
      exactly as a string (for example Harvard's 2025-06-30 or Yale's
      2024-06-30). This is prompt/header context, not an institution-entered
      response; do not substitute the CDS edition, an admission cycle, a cost
      year, or an aid reporting year for it. Every discipline and
      reported-total metric in this domain binds to this window.

  - id: cip_version
    description: >-
      CIP taxonomy version explicitly printed on the CDS Section J heading,
      when the form version prints one.
    type: string
    unit: text
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: degree_window
    source_hints: [J]
    instructions: >-
      Copy the CIP taxonomy version only when Section J explicitly prints one,
      for example Harvard's "CIP 2020." Yale's form prints only generic
      column-heading text with no version identifier, so this metric is
      not_in_template_version for Yale; never default an unprinted version to
      CIP 2020 or to any other value inferred from another institution or
      edition. This is prompt/header context shared by every discipline and
      reported-total metric in this domain, never an institution-entered
      response.

  # CIP 01 -- Agriculture
  - id: agriculture_diploma_certificate_percent
    description: >-
      Percentage of conferred Diploma/Certificate majors reported in CDS
      Section J's "Agriculture" row (CIP 01), as a share of all conferred
      Diploma/Certificate majors in the same reporting window.
    type: string
    unit: percent
    population: conferred_majors
    denominator: diploma_certificate_conferred_majors
    definition_variant: share
    period_kind: degree_window
    source_hints: [J]
    instructions: >-
      Extract CDS Section J's row labeled exactly "Agriculture" (CIP 01) in
      the Diploma/Certificate column (printed as "Diploma/Certificates" in
      Harvard's table and "Diploma / Certificates" in Yale's table). This is a
      percentage of conferred majors within the Diploma/Certificate credential
      column only, never a count, a percent of students, program availability,
      or enrollment. Bind this value to the degree_reporting_window_start,
      degree_reporting_window_end, and cip_version context metrics for its
      exact reporting period.
      The CDS does not expose a response selecting whether the institution counted
      first majors only or first plus second majors, so the actual major-counting
      basis is unknown.
      A visibly blank cell is not_reported and must
      not become zero; a printed zero (for example "0%" or "0.00%") remains
      zero. Preserve any qualified percent exactly, including "<1%" tokens, by
      keeping this metric's value a string for every institution. Do not
      confuse with any single agricultural major; this is the full combined
      CIP 01 category.

  - id: agriculture_associate_percent
    description: >-
      Percentage of conferred Associate majors reported in CDS Section J's
      "Agriculture" row (CIP 01), as a share of all conferred Associate majors
      in the same reporting window.
    type: string
    unit: percent
    population: conferred_majors
    denominator: associate_conferred_majors
    definition_variant: share
    period_kind: degree_window
    source_hints: [J]
    instructions: >-
      Extract CDS Section J's row labeled exactly "Agriculture" (CIP 01) in
      the Associate column. This is a percentage of conferred majors within
      the Associate credential column only, never a count, a percent of
      students, program availability, or enrollment. Bind this value to the
      degree_reporting_window_start, degree_reporting_window_end, and
      cip_version context metrics for its exact reporting period.
      The CDS does not expose a response selecting whether the institution counted
      first majors only or first plus second majors, so the actual major-counting
      basis is unknown.
      A visibly
      blank cell is not_reported and must not become zero; a printed zero (for
      example "0%" or "0.00%") remains zero. Preserve any qualified percent
      exactly, including "<1%" tokens, by keeping this metric's value a string
      for every institution. Do not confuse with any single agricultural
      major; this is the full combined CIP 01 category.

  - id: agriculture_bachelors_percent
    description: >-
      Percentage of conferred Bachelor's majors reported in CDS Section J's
      "Agriculture" row (CIP 01), as a share of all conferred Bachelor's
      majors in the same reporting window.
    type: string
    unit: percent
    population: conferred_majors
    denominator: bachelors_conferred_majors
    definition_variant: share
    period_kind: degree_window
    source_hints: [J]
    instructions: >-
      Extract CDS Section J's row labeled exactly "Agriculture" (CIP 01) in
      the Bachelor's column. This is a percentage of conferred majors within
      the Bachelor's credential column only, never a count, a percent of
      students, program availability, or enrollment. Bind this value to the
      degree_reporting_window_start, degree_reporting_window_end, and
      cip_version context metrics for its exact reporting period.
      The CDS does not expose a response selecting whether the institution counted
      first majors only or first plus second majors, so the actual major-counting
      basis is unknown.
      A visibly
      blank cell is not_reported and must not become zero; a printed zero (for
      example "0%" or "0.00%") remains zero. Preserve any qualified percent
      exactly, including "<1%" tokens, by keeping this metric's value a string
      for every institution. Do not confuse with any single agricultural
      major; this is the full combined CIP 01 category.

