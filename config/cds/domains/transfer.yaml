id: transfer
title: Transfer admission and credit policy
metrics:
  # D1 — institution-level transfer policy
  - id: enrolls_transfer_students
    description: "Whether the institution enrolls transfer students from other colleges or universities, per D1."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: policy
    period_kind: policy
    source_hints: [D1]
    instructions: "Extract the D1 first Yes/No control for whether the institution enrolls transfer students. Return true/false only from an unambiguous selected control; this is a policy selection, separate from the D2 volume counts and from the D1 advanced-standing control below."

  - id: allows_advanced_standing_from_external_coursework
    description: "Whether the institution grants advanced standing based on coursework completed at other colleges or universities, per D1."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: policy
    period_kind: policy
    source_hints: [D1]
    instructions: "Extract the D1 second Yes/No control. Return true/false only from an unambiguous visibly selected control; a blank or unresolved control remains not_reported or unresolved, never false. This advanced standing is specifically from coursework taken at other colleges/universities; do not confuse it with AP/IB/CLEP or other non-collegiate credit, which are covered elsewhere."

  - id: applicants_total
    description: "Total degree-seeking transfer applicants for the D2 entry term/year."
    type: integer
    unit: applicants
    population: transfer
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 TOTAL row applicants count. Population is degree-seeking transfer applicants only; do not sum the gender rows yourself."

  - id: admitted_total
    description: "Total transfer applicants admitted for the D2 entry term/year."
    type: integer
    unit: students
    population: transfer
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 TOTAL row admitted count. This is a raw source count; do not compute an admit rate during extraction."

  - id: enrolled_total
    description: "Total transfer students enrolled for the D2 entry term/year."
    type: integer
    unit: students
    population: transfer
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 TOTAL row enrolled count. This is a raw source count; do not compute a yield rate during extraction."

  # D4 — minimum prior-credit threshold for first-year vs transfer classification
  - id: minimum_prior_credit_threshold_applies
    description: "Whether a minimum prior-coursework credit threshold applies, below which an applicant must apply as an entering first-year rather than a transfer, per D4."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: policy
    period_kind: policy
    source_hints: [D4]
    instructions: "Extract the D4 Yes/No control for whether the threshold applies. Return true/false only from an unambiguous visibly selected control; a blank or unresolved control remains not_reported or unresolved, never false. Do not infer a value or unit for the fields below when this control is No or blank."

  - id: minimum_prior_credit_value
    description: "Minimum prior-coursework value below which an applicant must apply as an entering first-year rather than as a transfer, per D4."
    type: number
    unit: source_unit_value
    population: institution
    denominator: none
    definition_variant: minimum
    period_kind: policy
    source_hints: [D4]
    instructions: "Extract the printed D4 numeric threshold value only when visibly reported (for example 4). Never infer a value when the cell is blank, even if minimum_prior_credit_threshold_applies is true."

  - id: minimum_prior_credit_unit
    description: "Unit text printed beside the D4 minimum prior-coursework threshold below which an applicant must apply as an entering first-year rather than as a transfer."
    type: string
    unit: text
    population: institution
    denominator: none
    definition_variant: reported
    period_kind: policy
    source_hints: [D4]
    instructions: "Copy the printed D4 unit text exactly (for example semester hours). Do not infer a unit when it is blank, even when minimum_prior_credit_value is reported."

  # D5 — requirement-status checklist
  - id: transfer_requirement_high_school_transcript
    description: "D5 requirement status for a high-school transcript from transfer applicants."
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required_all, recommended_all, recommended_some, required_some, not_required]
    source_hints: [D5]
    instructions: "Return the exact D5 selected requirement status for the High School Transcript row. Map the visible label exactly: Required of All -> required_all; Recommended of All -> recommended_all; Recommended of Some -> recommended_some; Required of Some -> required_some; Not Required -> not_required. not_required does not mean unavailable."

  - id: transfer_requirement_college_transcripts
    description: "D5 requirement status for college transcripts from transfer applicants."
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required_all, recommended_all, recommended_some, required_some, not_required]
    source_hints: [D5]
    instructions: "Return the exact D5 selected requirement status for the College Transcript(s) row. Map the visible label exactly: Required of All -> required_all; Recommended of All -> recommended_all; Recommended of Some -> recommended_some; Required of Some -> required_some; Not Required -> not_required. not_required does not mean unavailable."

  - id: transfer_requirement_essay_personal_statement
    description: "D5 requirement status for an essay or personal statement from transfer applicants."
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required_all, recommended_all, recommended_some, required_some, not_required]
    source_hints: [D5]
    instructions: "Return the exact D5 selected requirement status for the Essay or Personal Statement row. Map the visible label exactly: Required of All -> required_all; Recommended of All -> recommended_all; Recommended of Some -> recommended_some; Required of Some -> required_some; Not Required -> not_required. not_required does not mean unavailable."

  - id: transfer_requirement_interview
    description: "D5 requirement status for an interview from transfer applicants."
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required_all, recommended_all, recommended_some, required_some, not_required]
    source_hints: [D5]
    instructions: "Return the exact D5 selected requirement status for the Interview row. Map the visible label exactly: Required of All -> required_all; Recommended of All -> recommended_all; Recommended of Some -> recommended_some; Required of Some -> required_some; Not Required -> not_required. not_required does not mean unavailable."

  - id: transfer_requirement_standardized_test_scores
    description: "D5 requirement status for standardized test scores from transfer applicants."
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required_all, recommended_all, recommended_some, required_some, not_required]
    source_hints: [D5]
    instructions: "Return the exact D5 selected requirement status for the Standardized Test Scores row. Map the visible label exactly: Required of All -> required_all; Recommended of All -> recommended_all; Recommended of Some -> recommended_some; Required of Some -> required_some; Not Required -> not_required. not_required does not mean unavailable."

  - id: transfer_requirement_prior_institution_good_standing
    description: "D5 requirement status for a statement of good standing from the prior institution."
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required_all, recommended_all, recommended_some, required_some, not_required]
    source_hints: [D5]
    instructions: "Return the exact D5 selected requirement status for the Statement of Good Standing from Prior Institution(s) row. Map the visible label exactly: Required of All -> required_all; Recommended of All -> recommended_all; Recommended of Some -> recommended_some; Required of Some -> required_some; Not Required -> not_required. not_required does not mean unavailable."

  # D6–D8 — GPA minimums and other requirements
  - id: minimum_high_school_gpa
    description: "Minimum high-school GPA required of transfer applicants, when a minimum is stated, per D6."
    type: number
    unit: gpa
    population: institution
    denominator: none
    definition_variant: minimum
    period_kind: policy
    source_hints: [D6]
    instructions: "Extract the D6 minimum high-school GPA value only. Any printed 'on a 4.0 scale' wording is template prompt context, not an institution response, and must never be copied into this value; a blank cell does not prove no minimum exists."

  - id: minimum_college_gpa
    description: "Minimum college GPA required of transfer applicants, when a minimum is stated, per D7."
    type: number
    unit: gpa
    population: institution
    denominator: none
    definition_variant: minimum
    period_kind: policy
    source_hints: [D7]
    instructions: "Extract the D7 minimum college GPA value only, keeping it separate from minimum_high_school_gpa. Any printed 'on a 4.0 scale' wording is template prompt context, not an institution response, and must never be copied into this value; a blank cell does not prove no minimum exists."

  # D9 — term × date-type deadline matrix
  - id: transfer_priority_date_fall
    description: "D9 fall-term transfer application priority date."
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: deadline
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Copy the D9 Fall row Priority Date cell exactly as printed, preserving any partial date actually present in that column. Keep it distinct from Closing Date, Notification Date, and Reply Date: Yale's 3/1 is closing, Mid May is notification, and Late May is reply, not priority."

  - id: transfer_closing_date_fall
    description: "D9 fall-term transfer application closing date."
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: deadline
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Copy the D9 Fall row closing-date cell exactly as printed. Keep this distinct from the priority date; do not assume a year that is not printed."

  - id: transfer_notification_date_fall
    description: "D9 fall-term transfer admission notification date."
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: reported
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Copy the D9 Fall row notification-date cell exactly as printed. Keep it in the Notification Date column; do not shift a value from the adjacent Closing Date or Reply Date column."

  - id: transfer_reply_date_fall
    description: "D9 fall-term transfer admission reply date."
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: deadline
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Copy the D9 Fall row reply-date cell exactly as printed. Keep it in the Reply Date column; do not shift a value from the adjacent Notification Date column or interpret the Rolling Admission control as a reply date."

  - id: transfer_rolling_admission_fall
    description: "Whether fall-term transfer admission is on a rolling basis, per D9."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Extract only a direct explicit Yes/No or an authoritative visibly unchecked D9 Fall rolling-admission control. A blank/empty mark cell remains not_reported or unresolved; never derive this value from the separate D3 fall-term availability checklist."

  # D10–D11 — open admission applicability and additional requirements
  - id: open_admission_policy_applies
    description: "Whether an open admission policy applies to transfer applicants, per D10."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: policy
    period_kind: policy
    source_hints: [D10]
    instructions: "Extract the D10 Yes/No control. Return true/false only from an unambiguous visibly selected control; a blank or unresolved control remains not_reported or unresolved, never false. This is open-admission applicability, not rolling admission and not any of the D9 rolling-admission controls above."

  # D12 — lowest eligible course grade
  - id: lowest_eligible_course_grade
    description: "Lowest course grade that remains eligible for transfer credit, per D12."
    type: string
    unit: text
    population: institution
    denominator: none
    definition_variant: minimum
    period_kind: policy
    source_hints: [D12]
    instructions: "Copy the printed D12 grade token exactly (for example a letter grade or a numeric grade such as 2.00). This is not the D7 applicant minimum college GPA and carries no assumed grading scale."
