  # D6–D8 — GPA minimums and other requirements
  - id: minimum_high_school_gpa
    description: "Minimum high-school GPA required of transfer applicants, when a minimum is stated, per D6."
    type: number
    unit: gpa
    population: institution
    denominator: none
    definition_variant: minimum
    period_kind: policy
    source_hints: [D6]
    instructions: "Extract the D6 minimum high-school GPA value only. Any printed 'on a 4.0 scale' wording is template prompt context, not an institution response, and must never be copied into this value; a blank cell does not prove no minimum exists."

  - id: minimum_college_gpa
    description: "Minimum college GPA required of transfer applicants, when a minimum is stated, per D7."
    type: number
    unit: gpa
    population: institution
    denominator: none
    definition_variant: minimum
    period_kind: policy
    source_hints: [D7]
    instructions: "Extract the D7 minimum college GPA value only, keeping it separate from minimum_high_school_gpa. Any printed 'on a 4.0 scale' wording is template prompt context, not an institution response, and must never be copied into this value; a blank cell does not prove no minimum exists."

  - id: other_application_requirements
    description: "Other transfer application requirements narrative, per D8."
    type: string
    unit: text
    population: institution
    denominator: none
    definition_variant: reported
    period_kind: policy
    source_hints: [D8]
    instructions: "Copy the D8 other-requirements narrative verbatim. Keep it separate from additional_admission_requirements (D11); do not merge it with the D5 checklist rows or the D17 credit-policy narrative."

  # D9 — term × date-type deadline matrix
  - id: transfer_priority_date_fall
    description: "D9 fall-term transfer application priority date."
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: deadline
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Copy the D9 Fall row Priority Date cell exactly as printed, preserving any partial date actually present in that column. Keep it distinct from Closing Date, Notification Date, and Reply Date: Yale's 3/1 is closing, Mid May is notification, and Late May is reply, not priority."

  - id: transfer_closing_date_fall
    description: "D9 fall-term transfer application closing date."
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: deadline
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Copy the D9 Fall row closing-date cell exactly as printed. Keep this distinct from the priority date; do not assume a year that is not printed."

  - id: transfer_notification_date_fall
    description: "D9 fall-term transfer admission notification date."
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: reported
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Copy the D9 Fall row notification-date cell exactly as printed. Keep it in the Notification Date column; do not shift a value from the adjacent Closing Date or Reply Date column."

  - id: transfer_reply_date_fall
    description: "D9 fall-term transfer admission reply date."
    type: string
    unit: date
    population: institution
    denominator: none
    definition_variant: deadline
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Copy the D9 Fall row reply-date cell exactly as printed. Keep it in the Reply Date column; do not shift a value from the adjacent Notification Date column or interpret the Rolling Admission control as a reply date."

  - id: transfer_rolling_admission_fall
    description: "Whether fall-term transfer admission is on a rolling basis, per D9."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: admission_cycle
    source_hints: [D9]
    instructions: "Extract only a direct explicit Yes/No or an authoritative visibly unchecked D9 Fall rolling-admission control. A blank/empty mark cell remains not_reported or unresolved; never derive this value from the separate D3 fall-term availability checklist."

