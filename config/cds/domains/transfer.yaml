  # D4 — minimum prior-credit threshold for first-year vs transfer classification
  - id: minimum_prior_credit_threshold_applies
    description: "Whether a minimum prior-coursework credit threshold applies, below which an applicant must apply as an entering first-year rather than a transfer, per D4."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: policy
    period_kind: policy
    source_hints: [D4]
    instructions: "Extract the D4 Yes/No control for whether the threshold applies. Return true/false only from an unambiguous visibly selected control; a blank or unresolved control remains not_reported or unresolved, never false. Do not infer a value or unit for the fields below when this control is No or blank."

  - id: minimum_prior_credit_value
    description: "Minimum prior-coursework value below which an applicant must apply as an entering first-year rather than as a transfer, per D4."
    type: number
    unit: source_unit_value
    population: institution
    denominator: none
    definition_variant: minimum
    period_kind: policy
    source_hints: [D4]
    instructions: "Extract the printed D4 numeric threshold value only when visibly reported (for example 4). Never infer a value when the cell is blank, even if minimum_prior_credit_threshold_applies is true."

  - id: minimum_prior_credit_unit
    description: "Unit text printed beside the D4 minimum prior-coursework threshold below which an applicant must apply as an entering first-year rather than as a transfer."
    type: string
    unit: text
    population: institution
    denominator: none
    definition_variant: reported
    period_kind: policy
    source_hints: [D4]
    instructions: "Copy the printed D4 unit text exactly (for example semester hours). Do not infer a unit when it is blank, even when minimum_prior_credit_value is reported."

  # D5 — requirement-status checklist
  - id: transfer_requirement_high_school_transcript
    description: "D5 requirement status for a high-school transcript from transfer applicants."
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required_all, recommended_all, recommended_some, required_some, not_required]
    source_hints: [D5]
    instructions: "Return the exact D5 selected requirement status for the High School Transcript row. Map the visible label exactly: Required of All -> required_all; Recommended of All -> recommended_all; Recommended of Some -> recommended_some; Required of Some -> required_some; Not Required -> not_required. not_required does not mean unavailable."

  - id: transfer_requirement_college_transcripts
    description: "D5 requirement status for college transcripts from transfer applicants."
    type: enum
    unit: category
    population: institution
    denominator: none
    definition_variant: selected
    period_kind: policy
    enums: [required_all, recommended_all, recommended_some, required_some, not_required]
    source_hints: [D5]
    instructions: "Return the exact D5 selected requirement status for the College Transcript(s) row. Map the visible label exactly: Required of All -> required_all; Recommended of All -> recommended_all; Recommended of Some -> recommended_some; Required of Some -> required_some; Not Required -> not_required. not_required does not mean unavailable."

