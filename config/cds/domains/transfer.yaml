id: transfer
context_bindings:
- id: d2_entering_class
  label: transfer entering class
  binders:
  - transfer_volume_entry_term
  - transfer_volume_entry_year
  targets:
    metric_ids:
    - applicants_total
    - applicants_men
    - applicants_women
    - applicants_another_gender
    - applicants_unknown
    - admitted_total
    - admitted_men
    - admitted_women
    - admitted_another_gender
    - admitted_unknown
    - enrolled_total
    - enrolled_men
    - enrolled_women
    - enrolled_another_gender
    - enrolled_unknown
title: Transfer admission and credit policy
metrics:
  # D1 — institution-level transfer policy
  - id: enrolls_transfer_students
    description: "Whether the institution enrolls transfer students from other colleges or universities, per D1."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: policy
    period_kind: policy
    source_hints: [D1]
    instructions: "Extract the D1 first Yes/No control for whether the institution enrolls transfer students. Return true/false only from an unambiguous selected control; this is a policy selection, separate from the D2 volume counts and from the D1 advanced-standing control below."

  - id: allows_advanced_standing_from_external_coursework
    description: "Whether the institution grants advanced standing based on coursework completed at other colleges or universities, per D1."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: policy
    period_kind: policy
    source_hints: [D1]
    instructions: "Extract the D1 second Yes/No control. Return true/false only from an unambiguous visibly selected control; a blank or unresolved control remains not_reported or unresolved, never false. This advanced standing is specifically from coursework taken at other colleges/universities; do not confuse it with AP/IB/CLEP or other non-collegiate credit, which are covered elsewhere."

  # D2 — transfer volume by gender, with entry term/year context
  - id: transfer_volume_entry_term
    description: "Entry term printed in the D2 transfer-volume table heading."
    type: string
    unit: category
    population: transfer
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Copy the entry term named in the D2 heading (for example Fall). This is source context that binds every D2 applicants/admitted/enrolled count below; it is not an institution-entered response and not the CDS edition."

  - id: transfer_volume_entry_year
    description: "Entry year printed in the D2 transfer-volume table heading."
    type: string
    unit: academic_year
    population: transfer
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Copy the entry year named in the D2 heading. This is source context that binds every D2 applicants/admitted/enrolled count below; it is not the CDS edition academic year."

  - id: applicants_total
    description: "Total degree-seeking transfer applicants for the D2 entry term/year."
    type: integer
    unit: applicants
    population: transfer
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 TOTAL row applicants count. Bind this count to transfer_volume_entry_term and transfer_volume_entry_year. Population is degree-seeking transfer applicants only; do not sum the gender rows yourself."

  - id: applicants_men
    description: "Men transfer applicants for the D2 entry term/year."
    type: integer
    unit: applicants
    population: transfer
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 Men row applicants count (labeled Males in the Harvard template). Bind this count to transfer_volume_entry_term and transfer_volume_entry_year. Keep separate from the Another Gender and Unknown rows."

  - id: applicants_women
    description: "Women transfer applicants for the D2 entry term/year."
    type: integer
    unit: applicants
    population: transfer
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 Women row applicants count (labeled Females in the Harvard template). Bind this count to transfer_volume_entry_term and transfer_volume_entry_year. Keep separate from the Another Gender and Unknown rows."

  - id: applicants_another_gender
    description: "Transfer applicants reported under Another Gender for the D2 entry term/year."
    type: integer
    unit: applicants
    population: transfer
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 Another Gender row applicants count when this template version includes it. Bind this count to transfer_volume_entry_term and transfer_volume_entry_year. Another Gender is not Unknown; a row absent from a given form version is not_in_template_version, never zero."

  - id: applicants_unknown
    description: "Transfer applicants whose gender is reported unknown for the D2 entry term/year."
    type: integer
    unit: applicants
    population: transfer
    denominator: none
    definition_variant: reported
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 Unknown row applicants count. Bind this count to transfer_volume_entry_term and transfer_volume_entry_year. Unknown is not Another Gender; do not merge the two rows."

  - id: admitted_total
    description: "Total transfer applicants admitted for the D2 entry term/year."
    type: integer
    unit: students
    population: transfer
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 TOTAL row admitted count. Bind this count to transfer_volume_entry_term and transfer_volume_entry_year. This is a raw source count; do not compute an admit rate during extraction."

  - id: admitted_men
    description: "Men transfer applicants admitted for the D2 entry term/year."
    type: integer
