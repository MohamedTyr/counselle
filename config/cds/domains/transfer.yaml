  - id: enrolled_total
    description: "Total transfer students enrolled for the D2 entry term/year."
    type: integer
    unit: students
    population: transfer
    denominator: none
    definition_variant: total
    period_kind: fall_term
    source_hints: [D2]
    instructions: "Extract the D2 TOTAL row enrolled count. Bind this count to transfer_volume_entry_term and transfer_volume_entry_year. This is a raw source count; do not compute a yield rate during extraction."

  - id: enrolled_men
    description: "Men transfer students enrolled for the D2 entry term/year."
    type: integer
    unit: students
    population: transfer
    denominator: none
    definition_variant: reported
