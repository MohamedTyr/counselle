  # D3 — entry-term availability checklist
  - id: enrollment_term_fall
    description: "Whether the institution accepts transfer students entering in the fall term, per D3."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: policy
    source_hints: [D3]
    instructions: "Extract the D3 Fall checklist control. Return true only from an unambiguous visible mark. Return false only when the complete D3 term checklist is visible and the named Fall option is unambiguously unmarked; a blank or missing row is never false, and a row absent from the template version is not_in_template_version. This is entry-term availability only, not an application or reply deadline; deadlines are separate D9 fields."

  - id: enrollment_term_winter
    description: "Whether the institution accepts transfer students entering in the winter term, per D3."
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: policy
    source_hints: [D3]
    instructions: "Extract the D3 Winter checklist control. Return true only from an unambiguous visible mark. Return false only when the complete D3 term checklist is visible and the named Winter option is unambiguously unmarked; a blank or missing row is never false, and a row absent from the template version is not_in_template_version. This is entry-term availability only, not an application or reply deadline; deadlines are separate D9 fields."

  - id: enrollment_term_spring
