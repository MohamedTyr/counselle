id: student_life
context_bindings:
- id: f1_reporting_period
  label: student-life reporting period
  binders:
  - student_life_reporting_term
  - student_life_reporting_year
  targets:
    metric_ids:
    - out_of_state_percent_first_time_first_year
    - out_of_state_percent_undergraduates
    - fraternity_joiners_percent_first_time_first_year
    - fraternity_joiners_percent_undergraduates
    - sorority_joiners_percent_first_time_first_year
    - sorority_joiners_percent_undergraduates
    - college_owned_housing_percent_first_time_first_year
    - college_owned_housing_percent_undergraduates
    - off_campus_or_commute_percent_first_time_first_year
    - off_campus_or_commute_percent_undergraduates
    - age_25_or_older_percent_first_time_first_year
    - age_25_or_older_percent_undergraduates
    - average_age_full_time_first_time_first_year
    - average_age_full_time_undergraduates
    - average_age_all_full_and_part_time_first_time_first_year
    - average_age_all_full_and_part_time_undergraduates
- id: cds_edition
  label: CDS edition
  binders:
  - identity.academic_year
  targets:
    metric_ids:
    - campus_ministries_available
    - choral_groups_available
    - concert_band_available
    - dance_available
    - drama_theater_available
    - international_student_organization_available
    - jazz_band_available
    - literary_magazine_available
    - marching_band_available
    - model_un_available
    - music_ensembles_available
    - musical_theater_available
    - opera_available
    - pep_band_available
    - radio_station_available
    - student_government_available
    - student_newspaper_available
    - student_run_film_society_available
    - symphony_orchestra_available
    - television_station_available
    - yearbook_available
    - army_rotc_on_campus
    - army_rotc_at_cooperating_institution
    - army_rotc_cooperating_institution_names
    - naval_rotc_on_campus
    - naval_rotc_at_cooperating_institution
    - naval_rotc_cooperating_institution_names
    - naval_rotc_marine_option
    - air_force_rotc_on_campus
    - air_force_rotc_at_cooperating_institution
    - air_force_rotc_cooperating_institution_names
title: Student residence/age/origin, activities, ROTC locations, and housing types
metrics:
  - id: student_life_reporting_term
    description: >-
      Reporting term printed in the F1 heading that establishes the snapshot
      context for every F1 residence, origin, and age metric.
    type: string
    unit: category
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Copy the reporting term from the F1 heading exactly as printed (for
      example "Fall"). This is source context binding every other F1 metric in
      this domain; do not substitute the CDS edition, infer a term from another
      section, or combine the term with `student_life_reporting_year`. It does
      not bind F2-F4, which use `identity.academic_year`.

  - id: student_life_reporting_year
    description: >-
      Single fall calendar year printed in the F1 heading that establishes the
      snapshot context for every F1 residence, origin, and age metric.
    type: integer
    unit: years
    population: institution
    denominator: none
    definition_variant: printed
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Extract the single calendar year from the F1 heading as a JSON integer
      and preserve the exact printed year token in raw_value. This is source
      context binding every other F1 metric in this domain; do not substitute
      the CDS edition academic-year range, infer a year from another section,
      or combine the year with `student_life_reporting_term`. It does not bind
      F2-F4, which use `identity.academic_year`.

  # F1 — percent/age metrics for the two printed populations: first-time,
  # first-year degree-seeking students and degree-seeking undergraduates.
  - id: out_of_state_percent_first_time_first_year
    description: >-
      Percent of first-time, first-year degree-seeking students who are from
      out of state, excluding international/nonresident students from both the
      numerator and denominator, from F1.
    type: string
    unit: percent
    population: enrolled_first_time_first_year
    denominator: domestic_enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to `student_life_reporting_term` and
      `student_life_reporting_year` from the F1 heading.
      Extract the F1 "percent of students who are from out of state" row for
      the first-time, first-year degree-seeking students column (the first
      F1 column, not the degree-seeking undergraduates column). Out-of-state
      excludes international/nonresident students from both numerator and
      denominator; do not confuse with B2 nonresident counts or C1 residency.
      Preserve the exact printed percent string, including any "<" or ">"
      qualifier; a visibly blank cell is not_reported, never zero.

  - id: out_of_state_percent_undergraduates
    description: >-
      Percent of degree-seeking undergraduates who are from out of state,
      excluding international/nonresident students from both the numerator and
      denominator, from F1.
    type: string
    unit: percent
    population: degree_seeking_undergraduates
    denominator: domestic_enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to `student_life_reporting_term` and
      `student_life_reporting_year` from the F1 heading.
      Extract the F1 "percent of students who are from out of state" row for
      the degree-seeking undergraduates column (the second F1 column, not
      the first-time, first-year column). Out-of-state excludes
      international/nonresident students from both numerator and
      denominator. Preserve the exact printed percent string; a visibly
      blank cell is not_reported, never zero.

  - id: fraternity_joiners_percent_first_time_first_year
    description: >-
      Percent of men among first-time, first-year degree-seeking students
      who join a fraternity, from F1.
    type: string
    unit: percent
    population: enrolled_first_time_first_year
    denominator: men_enrolled
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to `student_life_reporting_term` and
      `student_life_reporting_year` from the F1 heading.
      Extract the F1 "percent who join a fraternity" row for the
      first-time, first-year degree-seeking students column. The
      denominator is men within this population, not all students of
      either sex. Do not confuse with the F2 checklist (which has no
      fraternity/sorority row) or the F4 `fraternity_sorority_housing`
      boolean. Preserve the exact printed percent string, including any
      qualifier; a visibly blank cell is not_reported, never zero.

  - id: fraternity_joiners_percent_undergraduates
    description: >-
      Percent of men among degree-seeking undergraduates who join a
      fraternity, from F1.
    type: string
    unit: percent
    population: degree_seeking_undergraduates
