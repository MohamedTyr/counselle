  # F2 — one boolean per printed activity-availability checklist row.
  - id: campus_ministries_available
    description: Whether campus ministries are offered, from the F2 checklist.
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: academic_year
    source_hints: [F2]
    instructions: >-
      Bind this metric to `identity.academic_year`, the CDS edition context.
      Return true only when the F2 "Campus ministries" checkbox is visibly
      checked, and false only when the complete visible F2 checklist shows
      this box unambiguously unmarked; a row absent from this form version
      is not_in_template_version, not false. This records only that the
      activity is offered, not participation, size, competitiveness, or
      funding.

