id: student_life
context_bindings:
- id: cds_edition
  label: CDS edition
  binders:
  - identity.academic_year
  targets:
    metric_ids:
    - army_rotc_on_campus
    - army_rotc_at_cooperating_institution
    - naval_rotc_on_campus
    - naval_rotc_at_cooperating_institution
    - air_force_rotc_on_campus
    - air_force_rotc_at_cooperating_institution
title: Student residence/age/origin, activities, ROTC locations, and housing types
metrics:

  - id: out_of_state_percent_undergraduates
    description: >-
      Percent of degree-seeking undergraduates who are from out of state,
      excluding international/nonresident students from both the numerator and
      denominator, from F1.
    type: string
    unit: percent
    population: degree_seeking_undergraduates
    denominator: domestic_enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to the reporting term and year printed in the F1
      heading. Extract the F1 "percent of students who are from out of
      state" row for the degree-seeking undergraduates column (the second F1
      column, not the first-time, first-year column). Out-of-state excludes
      international/nonresident students from both numerator and
      denominator. Preserve the exact printed percent string; a visibly
      blank cell is not_reported, never zero.

  - id: fraternity_joiners_percent_undergraduates
    description: >-
      Percent of men among degree-seeking undergraduates who join a
      fraternity, from F1.
    type: string
    unit: percent
    population: degree_seeking_undergraduates
    denominator: men_enrolled
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to the reporting term and year printed in the F1
      heading. Extract the F1 "percent who join a fraternity" row for the
      degree-seeking undergraduates column. The denominator is men within
      this population. Preserve the exact printed percent string; a
      visibly blank cell is not_reported, never zero.

  - id: sorority_joiners_percent_undergraduates
    description: >-
      Percent of women among degree-seeking undergraduates who join a
      sorority, from F1.
    type: string
    unit: percent
    population: degree_seeking_undergraduates
    denominator: women_enrolled
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to the reporting term and year printed in the F1
      heading. Extract the F1 "percent who join a sorority" row for the
      degree-seeking undergraduates column. The denominator is women
      within this population. Preserve the exact printed percent string; a
      visibly blank cell is not_reported, never zero.

  - id: college_owned_housing_percent_undergraduates
    description: >-
      Percent of degree-seeking undergraduates who live in college-owned,
      -operated, or -affiliated housing, from F1.
    type: string
    unit: percent
    population: degree_seeking_undergraduates
    denominator: enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to the reporting term and year printed in the F1
      heading. Extract the F1 "percent who live in college-owned,
      -operated, or -affiliated housing" row for the degree-seeking
      undergraduates column. Preserve the exact printed percent string;
      a visibly blank cell is not_reported, never zero.

  - id: off_campus_or_commute_percent_undergraduates
    description: >-
      Percent of degree-seeking undergraduates who live off campus or
      commute, from F1.
    type: string
    unit: percent
    population: degree_seeking_undergraduates
    denominator: enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to the reporting term and year printed in the F1
      heading. Extract the F1 "percent who live off campus or commute"
      row for the degree-seeking undergraduates column. Do not derive
      this value from the college-owned-housing row above. Preserve the
      exact printed percent string; a visibly blank cell is not_reported,
      never zero.

  - id: age_25_or_older_percent_undergraduates
    description: >-
      Percent of degree-seeking undergraduates age 25 or older, from F1.
    type: string
    unit: percent
    population: degree_seeking_undergraduates
    denominator: enrolled_students
    definition_variant: share
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to the reporting term and year printed in the F1
      heading. Extract the F1 "percent age 25 or older" row for the
      degree-seeking undergraduates column. Age 25 is inclusive. Preserve
      the exact printed percent string; a visibly blank cell is
      not_reported, never zero.

  - id: average_age_full_time_undergraduates
    description: >-
      Average age of full-time degree-seeking undergraduates, from F1.
    type: number
    unit: years
    population: degree_seeking_undergraduates
    denominator: none
    definition_variant: average
    period_kind: fall_term
    source_hints: [F1]
    instructions: >-
      Bind this metric to the reporting term and year printed in the
      F1 heading. Extract the F1 "average age of full-time students"
      row for the degree-seeking undergraduates column. This is
      distinct from the all-full-and-part-time-students row below.

  # F3 — Army, Naval, and Air Force ROTC, each with on-campus and
  # cooperating-institution availability plus cooperating-institution names;
  # Naval ROTC additionally has a Marine option.
  - id: army_rotc_on_campus
    description: Whether Army ROTC is offered on campus, from F3.
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: academic_year
    source_hints: [F3]
    instructions: >-
      Bind this metric to `identity.academic_year`, the CDS edition context.
      Return true only when the F3 Army ROTC "offered on campus" checkbox
      is visibly checked, and false only when this box is visibly present
      and unambiguously unmarked in the complete F3 matrix. Do not conflate
      with the "at a cooperating institution" row below, and never invent
      an overall combined ROTC boolean; report Army ROTC only.

  - id: army_rotc_at_cooperating_institution
    description: >-
      Whether Army ROTC is offered at a cooperating institution, from F3.
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: academic_year
    source_hints: [F3]
    instructions: >-
      Bind this metric to `identity.academic_year`, the CDS edition context.
      Return true only when the F3 Army ROTC "offered at a cooperating
      institution" checkbox is visibly checked, and false only when this
      box is visibly present and unambiguously unmarked in the complete F3
      matrix. Do not conflate with the on-campus row above.

  - id: naval_rotc_on_campus
    description: Whether Naval ROTC is offered on campus, from F3.
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: academic_year
    source_hints: [F3]
    instructions: >-
      Bind this metric to `identity.academic_year`, the CDS edition context.
      Return true only when the F3 Naval ROTC "offered on campus" checkbox
      is visibly checked, and false only when this box is visibly present
      and unambiguously unmarked in the complete F3 matrix. Do not conflate
      with the "at a cooperating institution" row below or the Marine
      option below; report Naval ROTC only.

  - id: naval_rotc_at_cooperating_institution
    description: >-
      Whether Naval ROTC is offered at a cooperating institution, from F3.
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: academic_year
    source_hints: [F3]
    instructions: >-
      Bind this metric to `identity.academic_year`, the CDS edition context.
      Return true only when the F3 Naval ROTC "offered at a cooperating
      institution" checkbox is visibly checked, and false only when this
      box is visibly present and unambiguously unmarked in the complete F3
      matrix. Do not conflate with the on-campus row above.

  - id: air_force_rotc_on_campus
    description: Whether Air Force ROTC is offered on campus, from F3.
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: academic_year
    source_hints: [F3]
    instructions: >-
      Bind this metric to `identity.academic_year`, the CDS edition context.
      Return true only when the F3 Air Force ROTC "offered on campus"
      checkbox is visibly checked, and false only when this box is visibly
      present and unambiguously unmarked in the complete F3 matrix. Do not
      conflate with the "at a cooperating institution" row below; report
      Air Force ROTC only.

  - id: air_force_rotc_at_cooperating_institution
    description: >-
      Whether Air Force ROTC is offered at a cooperating institution, from
      F3.
    type: boolean
    unit: boolean
    population: institution
    denominator: none
    definition_variant: availability
    period_kind: academic_year
    source_hints: [F3]
    instructions: >-
      Bind this metric to `identity.academic_year`, the CDS edition context.
      Return true only when the F3 Air Force ROTC "offered at a
      cooperating institution" checkbox is visibly checked, and false only
      when this box is visibly present and unambiguously unmarked in the
      complete F3 matrix. Do not conflate with the on-campus row above.
