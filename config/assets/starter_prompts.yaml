# Home-screen conversation starters (B4) — student-facing prompt suggestions,
# served by GET /v1/config as `conversation_starters`. College-admissions flavored,
# on-brand for Counselle (honest, exploratory, never odds-promising). 4-6 entries.
- "Compare Williams and Amherst on class size, aid, and outcomes"
- "What SAT and GPA range does UNC Chapel Hill admit?"
