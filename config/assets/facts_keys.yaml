# facts_keys.yaml — label -> fact_key routing for app/facts/mapper.py (plan §4.4).
#
# Rules are matched in file order; the first rule whose (tab, expandable_section,
# divider, node_type, match) all agree with a leaf wins. `expandable_section`/
# `divider` are wildcards when the key is omitted entirely (matches any value,
# including None) — they are never used to express "must be null" on purpose
# here (every rule that cares about a specific divider names it).
#
# `handler: drop` recognizes a label deliberately (a documented duplicate, a
# structural field with its own bespoke handling in mapper.py, or a field the
# plan excludes outright) without counting it as unmapped and without storing
# a fact. Everything else that matches no rule at all becomes `unmapped:
# <source_path>` (mapper.py's own fallback — not expressed here).
#
# A handful of one-owning-tab / dedupe decisions this file encodes were not
# called out in the plan's appendix and were settled by checking live pages
# instead (fullTimeFaculty/partTimeFaculty on admission's header duplicate
# academics' own body rows; the admission body's "Regular Admission
# Deadline" duplicates the header pair used to build deadlines.regular).
version: 1
rules:
  # ===========================================================================
  # overview — header only (body is a verbatim subset of the five topic tabs;
  # skipped entirely by mapper.py, never even walked).
  # ===========================================================================
  - {tab: overview, node_type: header, match: description, handler: drop}
  - {tab: overview, node_type: header, match: alternativeName, handler: drop}
  - {tab: overview, node_type: header, match: universityType, handler: scalar, kind: enum, fact_key: identity.control_reported, section: campus-life}
  - {tab: overview, node_type: header, match: populationType, handler: scalar, kind: enum, fact_key: identity.gender_model_reported, section: campus-life}
  # undergradPopulation/gradPopulation/male|femalePercentage are dropped, not
  # mapped: verified live to be exact duplicates of the
  # `students` tab's own richer "All Undergraduates" NestedTitleValue
  # (students.undergraduate_total/_men_count/_men_pct/...) and "All Graduate
  # Students" TitleValue (students.graduate_total) — one-owning-tab, students
  # tab wins because it also carries the gender breakdown overview lacks.
  - {tab: overview, node_type: header, match: undergradPopulation, handler: drop}
  - {tab: overview, node_type: header, match: gradPopulation, handler: drop}
  - {tab: overview, node_type: header, match: malePercentage, handler: drop}
  - {tab: overview, node_type: header, match: femalePercentage, handler: drop}
  - {tab: overview, node_type: header, match: address, handler: address_header, fact_key: identity.address, section: campus-life}
  - {tab: overview, node_type: header, match: admissionsPhone, handler: scalar, kind: text, fact_key: applying.admissions_phone, section: applying}
  - {tab: overview, node_type: header, match: admissionsFax, handler: scalar, kind: text, fact_key: applying.admissions_fax, section: applying}
  - {tab: overview, node_type: header, match: admissionsEmail, handler: scalar, kind: text, fact_key: applying.admissions_email, section: applying}
  # website is structural (never walked by parse.py) — mapper.py reads
  # `raw_profile["website"]` directly on this tab; no rule needed here.

  # ===========================================================================
  # admission
  # ===========================================================================
  - {tab: admission, node_type: header, match: address, handler: drop}   # one-owning-tab: overview's copy dropped instead — see below, admission wins
  - {tab: admission, node_type: header, match: phone, handler: drop}     # duplicate of overview's admissionsPhone (appendix E-ii §H)
  - {tab: admission, node_type: header, match: fullTimeFaculty, handler: drop}   # duplicate of academics' own body row (discovered live; academics wins)
  - {tab: admission, node_type: header, match: partTimeFaculty, handler: drop}
  - {tab: admission, node_type: header, match: admissionDeadline, handler: drop}       # consumed by mapper.py's own deadlines.regular header-pair logic
  - {tab: admission, node_type: header, match: admissionDeadlineDate, handler: drop}

  - {tab: admission, expandable_section: "Applying For Admission", divider: "Admissions Office", node_type: TitleValue, match: Address, handler: address_body, fact_key: applying.admissions_address, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Admissions Office", node_type: TitleValue, match: Phone, handler: scalar, kind: text, fact_key: applying.admissions_phone_direct, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Admissions Office", node_type: TitleValue, match: Fax, handler: scalar, kind: text, fact_key: applying.admissions_fax_direct, section: applying}

  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Dates & Fees", node_type: TitleValue, match: "Regular Admission Deadline", handler: drop}  # deadlines.regular comes from the header pair instead
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Dates & Fees", node_type: TitleValue, match: "Application Fee", handler: scalar, kind: money, fact_key: applying.application_fee, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Dates & Fees", node_type: TitleValue, match: "Application Fee Waiver", handler: scalar, kind: enum, fact_key: applying.application_fee_waiver, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Dates & Fees", node_type: TitleValue, match: "Regular Admission Notification", handler: text_fallback_date, fact_key: deadlines.regular_notification, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Dates & Fees", node_type: TitleValue, match: "Accept Offer of Admission", handler: text_fallback_date, fact_key: deadlines.reply_by, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Dates & Fees", node_type: TitleValue, match: "Waiting List Used", handler: scalar, kind: bool, fact_key: admissions.waitlist_used, section: getting-in}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Dates & Fees", node_type: TitleValue, match: "Defer Admission", handler: scalar, kind: text, fact_key: applying.deferred_enrollment, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Dates & Fees", node_type: TitleValue, match: "Transfer Admission", handler: scalar, kind: text, fact_key: applying.transfer_accepted, section: applying}

  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Form", node_type: TitleValue, match: "Common Application", handler: scalar, kind: enum, fact_key: applying.accepts_common_app, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Application Form", node_type: TitleLink, match: "Electronic Application", handler: title_link_url, fact_key: applying.electronic_application_url, section: applying}

  - {tab: admission, expandable_section: "Applying For Admission", divider: "Early Admission", node_type: TitleValue, match: "Early Decision Offered", handler: scalar, kind: bool, fact_key: admissions.early_decision_offered, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Early Admission", node_type: TitleValue, match: "Early Action Offered", handler: scalar, kind: bool, fact_key: admissions.early_action_offered, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Early Admission", node_type: TitleValue, match: "Early Decision Deadline", handler: text_fallback_date, fact_key: deadlines.early_decision, second_key: deadlines.early_decision_2, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Early Admission", node_type: TitleValue, match: "Early Action Deadline", handler: text_fallback_date, fact_key: deadlines.early_action, second_key: deadlines.early_action_2, section: applying}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Early Admission", node_type: TitleValue, match: "Early Action Notification", handler: text_fallback_date, fact_key: deadlines.early_action_notification, section: applying}

  - {tab: admission, expandable_section: "Applying For Admission", divider: "Other Application Requirements", node_type: TitleValue, match: Interview, handler: scalar, kind: enum, fact_key: admissions.interview_requirement, section: getting-in}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Other Application Requirements", node_type: TitleValue, match: "Financial Need", handler: scalar, kind: text, fact_key: admissions.need_blind, section: getting-in}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Other Application Requirements", node_type: TitleValue, match: "Essay or Personal Statement", handler: scalar, kind: enum, fact_key: admissions.essay_requirement, section: getting-in}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Other Application Requirements", node_type: TitleValue, match: "Letters of Recommendation", handler: scalar, kind: enum, fact_key: admissions.recommendations_requirement, section: getting-in}
  - {tab: admission, expandable_section: "Applying For Admission", divider: "Other Application Requirements", node_type: TitleValue, match: Other, handler: scalar, kind: text, fact_key: admissions.other_requirement, section: getting-in}

  - {tab: admission, expandable_section: "Freshman Admission Reqs", divider: "High School Preparation", node_type: TitleValue, match: "High School Graduation", handler: scalar, kind: enum, fact_key: admissions.hs_graduation_requirement, section: getting-in}
  - {tab: admission, expandable_section: "Freshman Admission Reqs", divider: "High School Preparation", node_type: TitleValue, match: "High School Program", handler: scalar, kind: enum, fact_key: admissions.hs_program_requirement, section: getting-in}
  - {tab: admission, expandable_section: "Freshman Admission Reqs", node_type: LabeledTable, handler: hs_requirements_table, section: getting-in, key_prefixes: [admissions.units_required_, admissions.units_recommended_, admissions.test_policy_, deadlines.test_due_]}   # dispatches on columns; divider varies across schools (unit report #8)

  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "Grade Point Average of Enrolled Freshmen (4.0 Scale)", node_type: BarGraph, handler: bar_graph_distribution, fact_key: class_profile.gpa, scale: gpa, unit: percent, section: getting-in}

  - {tab: admission, expandable_section: "Profile of Fall Admission", node_type: NestedTitleValue, match: "Overall Admission Rate", handler: admission_rate_group, section: getting-in, produces: [admissions.admit_rate, admissions.applicants_total]}
  - {tab: admission, expandable_section: "Profile of Fall Admission", node_type: NestedTitleValue, match: "Students Enrolled", handler: enrolled_group, section: getting-in, produces: [admissions.enrolled_total, admissions.yield_rate, admissions.admitted_total]}
  - {tab: admission, expandable_section: "Profile of Fall Admission", node_type: TitleValue, match: "Students Offered Wait List", handler: scalar, kind: count, fact_key: admissions.waitlist_offered, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", node_type: TitleValue, match: "Students Accepting Wait List Position", handler: scalar, kind: count, fact_key: admissions.waitlist_accepted, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", node_type: TitleValue, match: "Students Admitted From Wait List", handler: scalar, kind: count, fact_key: admissions.waitlist_admitted, section: getting-in}

  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "ACT Scores of Enrolled Freshmen", node_type: BarGraph, match: "^ACT Math:.*$", handler: bar_graph_distribution, fact_key: class_profile.act_math, scale: act_math, unit: percent, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "ACT Scores of Enrolled Freshmen", node_type: BarGraph, match: "^ACT Eng:.*$", handler: bar_graph_distribution, fact_key: class_profile.act_english, scale: act_english, unit: percent, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "ACT Scores of Enrolled Freshmen", node_type: BarGraph, handler: bar_graph_distribution, fact_key: class_profile.act_composite, scale: act_composite, unit: percent, section: getting-in}

  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "SAT Scores of Enrolled Freshmen", node_type: BarGraph, match: "^SAT Math:.*$", handler: bar_graph_distribution, fact_key: class_profile.sat_math, scale: sat_math, unit: percent, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "SAT Scores of Enrolled Freshmen", node_type: BarGraph, match: "^SAT EBRW:.*$", handler: bar_graph_distribution, fact_key: class_profile.sat_ebrw, scale: sat_ebrw, unit: percent, section: getting-in}

  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "Other Qualifications of Enrolled Freshmen", node_type: TitleValue, match: "High School Class Rank", handler: labelled_pairs, fact_key: class_profile.class_rank, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "Other Qualifications of Enrolled Freshmen", node_type: TitleValue, match: "National Merit Scholar", handler: scalar, kind: count, fact_key: class_profile.national_merit_count, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "Other Qualifications of Enrolled Freshmen", node_type: TitleValue, match: Valedictorian, handler: scalar, kind: count, fact_key: class_profile.valedictorian_count, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "Other Qualifications of Enrolled Freshmen", node_type: TitleValue, match: "Class President", handler: scalar, kind: count, fact_key: class_profile.class_president_count, section: getting-in}
  - {tab: admission, expandable_section: "Profile of Fall Admission", divider: "Other Qualifications of Enrolled Freshmen", node_type: TitleValue, match: "Student Government Officer", handler: scalar, kind: count, fact_key: class_profile.student_government_count, section: getting-in}

  - {tab: admission, expandable_section: "Selection of Students", node_type: LabeledTable, handler: ordinal_table, key_prefix: "admissions.selection_factor_", section: getting-in}

  # ===========================================================================
  # money-matters
  # ===========================================================================
  - {tab: money-matters, node_type: header, match: roomBoardCost, handler: scalar, kind: money, fact_key: costs.room_and_board, section: money}
  - {tab: money-matters, node_type: header, match: suppliesCost, handler: scalar, kind: money, fact_key: costs.books_and_supplies, section: money}
  - {tab: money-matters, node_type: header, match: otherExpensesCost, handler: scalar, kind: money, fact_key: costs.other_expenses, section: money}
  - {tab: money-matters, node_type: header, match: attendanceCost, handler: paired_header, fact_key: costs.attendance, section: money}
  - {tab: money-matters, node_type: header, match: tuitionFeesCost, handler: paired_header, fact_key: costs.tuition_fees, section: money}

  - {tab: money-matters, expandable_section: "Applying For Financial Aid", node_type: TitleLink, match: Website, handler: title_link_url, fact_key: money.financial_aid_url, section: money}
  - {tab: money-matters, expandable_section: "Applying For Financial Aid", node_type: TitleLink, match: "Net Price Calculator", handler: title_link_url, fact_key: money.net_price_calculator_url, section: money}
  - {tab: money-matters, expandable_section: "Applying For Financial Aid", node_type: TitleLink, match: Email, handler: title_link_text, fact_key: money.financial_aid_email, section: money}

  - {tab: money-matters, expandable_section: "Applying For Financial Aid", divider: "Application Process", node_type: TitleValue, match: "Application Deadline", handler: text_fallback_date, fact_key: deadlines.financial_aid, section: applying}
  - {tab: money-matters, expandable_section: "Applying For Financial Aid", divider: "Application Process", node_type: TitleValue, match: "Award Notification", handler: scalar, kind: text, fact_key: deadlines.aid_award_notification, section: money}
  - {tab: money-matters, expandable_section: "Applying For Financial Aid", divider: "Application Process", node_type: TitleValue, match: "High School Program", handler: drop}   # dedupe: same key as admission's own row (appendix ii §3)
  - {tab: money-matters, expandable_section: "Applying For Financial Aid", divider: "Application Process", node_type: TitleValue, match: "Methodology For Awarding Institutional Aid", handler: scalar, kind: enum, fact_key: aid.need_analysis_methodology, section: money}
  - {tab: money-matters, expandable_section: "Applying For Financial Aid", divider: "Application Process", node_type: LabeledTable, handler: forms_required_table, section: money, produces: [money.fafsa_code, money.css_profile_fee]}

  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: Employment, node_type: TitleValue, match: "Work-Study Programs", handler: scalar, kind: enum, fact_key: aid.work_study_programs, section: money}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: Employment, node_type: TitleValue, match: "Average Earnings from On-Campus Employment", handler: scalar, kind: money, fact_key: aid.on_campus_employment_avg, section: money}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: Loans, node_type: TitleValue, match: "Federal Loans", handler: list_value, fact_key: aid.federal_loan_programs, section: money}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: Loans, node_type: TitleValue, match: "Other Loans", handler: list_value, fact_key: aid.other_loan_programs, section: money}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: Loans, node_type: TitleValue, match: "State Loans", handler: list_value, fact_key: aid.state_loan_programs, section: money}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: "Scholarships and Grants", node_type: TitleValue, match: "Need-Based Available", handler: list_value, fact_key: aid.need_based_programs, section: money}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: "Scholarships and Grants", node_type: TitleValue, match: "Non-Need-Based Available", handler: list_value, fact_key: aid.non_need_programs, section: money}

  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: "Non-Need Awards", node_type: NestedTitleValue, match: "Academic Interest/Achievement Award Areas", handler: nested_list_count, area: academic, section: money, produces: [aid.non_need_academic_areas, aid.non_need_academic_count]}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: "Non-Need Awards", node_type: NestedTitleValue, match: "Creative Arts/Performance Award Areas", handler: nested_list_count, area: creative_arts, section: money, produces: [aid.non_need_creative_arts_areas, aid.non_need_creative_arts_count]}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: "Non-Need Awards", node_type: NestedTitleValue, match: "Special Achievements/Activities Award Areas", handler: nested_list_count, area: special_achievements, section: money, produces: [aid.non_need_special_achievements_areas, aid.non_need_special_achievements_count]}
  - {tab: money-matters, expandable_section: "Financial Aid Programs", divider: "Non-Need Awards", node_type: NestedTitleValue, match: "Special Characteristics Award Areas", handler: nested_list_count, area: special_characteristics, section: money, produces: [aid.non_need_special_characteristics_areas, aid.non_need_special_characteristics_count]}

  # "Profile of <...> Financial Aid" — divider Freshman / All Undergraduates
  # sets the population dimension explicitly (never a regex capture: it's the
  # node's own CategoryDivider, unit report #5).
  - {tab: money-matters, divider: "All Undergraduates", node_type: TitleValue, match: "Financial Aid Applicants", handler: scalar, kind: text, fact_key: aid.applicants_all_undergraduates, section: money}
  - {tab: money-matters, divider: "All Undergraduates", node_type: TitleValue, match: "Found to Have Financial Need", handler: scalar, kind: text, fact_key: aid.need_found_all_undergraduates, section: money}
  - {tab: money-matters, divider: "All Undergraduates", node_type: TitleValue, match: "Received Financial Aid", handler: scalar, kind: text, fact_key: aid.received_all_undergraduates, section: money}
  - {tab: money-matters, divider: "All Undergraduates", node_type: TitleValue, match: "Need Fully Met", handler: scalar, kind: text, fact_key: aid.need_fully_met_all_undergraduates, section: money}
  - {tab: money-matters, divider: "All Undergraduates", node_type: TitleValue, match: "Average Percent of Need Met", handler: scalar, kind: percent, fact_key: aid.avg_percent_need_met_all_undergraduates, section: money}
  - {tab: money-matters, divider: "All Undergraduates", node_type: TitleValue, match: "Merit-Based Gift", handler: merit_based_gift, population: all_undergraduates, section: money, produces: [aid.merit_to_need_recipients_all_undergraduates, aid.merit_to_need_recipients_pct_all_undergraduates, aid.merit_no_need_recipients_all_undergraduates, aid.merit_no_need_recipients_pct_all_undergraduates, aid.merit_no_need_avg_all_undergraduates]}
  - {tab: money-matters, divider: "All Undergraduates", node_type: TitleValue, match: "^\\d{4} Graduates Who Took Out Loans$", handler: scalar, kind: percent, fact_key: outcomes.graduates_with_loans_pct, section: outcomes}
  - {tab: money-matters, divider: "All Undergraduates", node_type: NestedTitleValue, match: "Average Award", handler: nested_award, population: all_undergraduates, section: money, produces: [aid.avg_award_all_undergraduates, aid.need_gift_recipients_all_undergraduates, aid.need_gift_recipients_pct_all_undergraduates, aid.need_gift_avg_all_undergraduates, aid.need_selfhelp_recipients_all_undergraduates, aid.need_selfhelp_recipients_pct_all_undergraduates, aid.need_selfhelp_avg_all_undergraduates]}
  - {tab: money-matters, divider: "All Undergraduates", node_type: NestedTitleValue, match: "^Average Indebtedness of \\d{4} Graduates$", handler: scalar, kind: money, fact_key: outcomes.average_indebtedness, section: outcomes}

  - {tab: money-matters, divider: Freshman, node_type: TitleValue, match: "Financial Aid Applicants", handler: scalar, kind: text, fact_key: aid.applicants_freshman, section: money}
  - {tab: money-matters, divider: Freshman, node_type: TitleValue, match: "Found to Have Financial Need", handler: scalar, kind: text, fact_key: aid.need_found_freshman, section: money}
  - {tab: money-matters, divider: Freshman, node_type: TitleValue, match: "Received Financial Aid", handler: scalar, kind: text, fact_key: aid.received_freshman, section: money}
  - {tab: money-matters, divider: Freshman, node_type: TitleValue, match: "Need Fully Met", handler: scalar, kind: text, fact_key: aid.need_fully_met_freshman, section: money}
  - {tab: money-matters, divider: Freshman, node_type: TitleValue, match: "Average Percent of Need Met", handler: scalar, kind: percent, fact_key: aid.avg_percent_need_met_freshman, section: money}
  - {tab: money-matters, divider: Freshman, node_type: TitleValue, match: "Merit-Based Gift", handler: merit_based_gift, population: freshman, section: money, produces: [aid.merit_to_need_recipients_freshman, aid.merit_to_need_recipients_pct_freshman, aid.merit_no_need_recipients_freshman, aid.merit_no_need_recipients_pct_freshman, aid.merit_no_need_avg_freshman]}
  - {tab: money-matters, divider: Freshman, node_type: NestedTitleValue, match: "Average Award", handler: nested_award, population: freshman, section: money, produces: [aid.avg_award_freshman, aid.need_gift_recipients_freshman, aid.need_gift_recipients_pct_freshman, aid.need_gift_avg_freshman, aid.need_selfhelp_recipients_freshman, aid.need_selfhelp_recipients_pct_freshman, aid.need_selfhelp_avg_freshman]}

  # ===========================================================================
  # academics
  # ===========================================================================
  - {tab: academics, node_type: header, match: campusMapUrl, handler: drop}   # one-owning-tab: campus-life wins

  - {tab: academics, divider: "General Information", node_type: TitleValue, match: "Academic Calendar System", handler: scalar, kind: enum, fact_key: academics.calendar, section: academics}
  - {tab: academics, divider: "General Information", node_type: TitleValue, match: "Summer Session", handler: scalar, kind: enum, fact_key: academics.summer_session, section: academics}

  - {tab: academics, expandable_section: "Academic Resources", node_type: TitleValue, match: "Library Available on Campus", handler: scalar, kind: bool, fact_key: academics.library_on_campus, section: academics}
  - {tab: academics, expandable_section: "Academic Resources", node_type: TitleValue, match: "Computer Ownership", handler: scalar, kind: enum, fact_key: academics.computer_ownership, section: academics}
  - {tab: academics, expandable_section: "Academic Resources", node_type: TitleValue, match: "Computers Available on Campus", handler: scalar, kind: enum, fact_key: academics.computers_available, section: academics}
  - {tab: academics, expandable_section: "Academic Resources", node_type: TitleValue, match: Holdings, handler: scalar, kind: count, fact_key: academics.library_holdings, section: academics}

  - {tab: academics, expandable_section: "Academic Support Services", node_type: TitleValue, match: Tutoring, handler: scalar, kind: enum, fact_key: academics.support_tutoring, section: academics}
  - {tab: academics, expandable_section: "Academic Support Services", node_type: TitleValue, match: "Services for Learning Disabled Students", handler: scalar, kind: text, fact_key: academics.support_learning_disabled, section: academics}
  - {tab: academics, expandable_section: "Academic Support Services", node_type: TitleValue, match: "Services for Physically Disabled Students", handler: scalar, kind: text, fact_key: academics.support_physically_disabled, section: academics}
  - {tab: academics, expandable_section: "Academic Support Services", node_type: TitleValue, match: "Remedial Instruction", handler: scalar, kind: enum, fact_key: academics.support_remedial_instruction, section: academics}

