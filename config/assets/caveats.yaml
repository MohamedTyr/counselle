profile_snapshot:
  text: "Identity profile snapshot from {snapshot_date}; verify time-sensitive facts."
  slots: [snapshot_date]
coverage_denominator:
  text: "Computed across {covered} covered schools out of {total} profiles as of {as_of}."
  slots: [covered, total, as_of]
not_reported:
  text: "The school did not report this item."
  slots: []
not_collected:
  text: "Counselle does not collect facts for this school; this is not a report of zero or of the school withholding it."
  slots: []
not_fetched:
  text: "{cause}, so its value is unknown — not absent."
  slots: [cause]
not_published:
  text: "Counselle holds no {section} page for this school, so there is nothing to report here — this is not a value the school withheld, and not a report of zero."
  slots: [section]
stale_facts:
  text: "Counselle last confirmed this value on {checked}; it may have changed since."
  slots: [checked]
observed_at_spread:
  text: "Compared values were confirmed at different times: {checked_dates}."
  slots: [checked_dates]
