<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Counselle — the thinking phase</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   Counselle — THE THINKING PHASE (standalone mockup).
   Rebuilt on the AI Elements (ai-sdk.dev) patterns the app uses:
     · Reasoning      → collapsed-default header, gradient Shimmer "Thinking…"
                        → "Thought for Ns", chevron. FLAT, no card.
     · ChainOfThought → step list with a per-step connector line and
                        complete/active/pending status colors.
     · ChainOfThoughtSearchResult → sources as small secondary Badges.
   Palette = shadcn semantic tokens (the ones those components use) +
   Counselle's two tier pairs (official=blue, community=amber). So it ports
   1:1 into <ChainOfThought/> later. Inter / Roboto Mono. Light + dark.
   ========================================================================= */

/* shadcn semantic tokens (verbatim from style.css :root / .dark) */
:root{
  --background:0 0% 100%; --foreground:0 0% 3.9%;
  --muted:0 0% 96.1%; --muted-foreground:0 0% 45.1%;
  --secondary:0 0% 96.1%; --secondary-foreground:0 0% 9%;
  --accent:0 0% 96.1%; --border:0 0% 89.8%;
  --primary:0 0% 9%; --ring:0 0% 63%;
  /* Counselle source-tier (light) */
  --official-text:#1d4ed8; --official-surface:#eff6ff; --official-border:#bfdbfe;
  --community-text:#b45309; --community-surface:#fffbeb; --community-border:#fde68a;
  --submit:#047857;
  --radius:.5rem;
  --ease:cubic-bezier(.22,1,.36,1);
}
html.dark{
  --background:0 0% 7%; --foreground:0 0% 98%;
  --muted:0 0% 14.9%; --muted-foreground:0 0% 63.9%;
  --secondary:0 0% 14.9%; --secondary-foreground:0 0% 98%;
  --accent:0 0% 14.9%; --border:0 0% 14.9%;
  --primary:0 0% 98%; --ring:0 0% 45%;
  --official-text:#93c5fd; --official-surface:rgba(59,130,246,.12); --official-border:rgba(59,130,246,.40);
  --community-text:#fcd34d; --community-surface:rgba(245,158,11,.12); --community-border:rgba(245,158,11,.40);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:hsl(var(--background)); color:hsl(var(--foreground));
  font-family:"Inter",system-ui,sans-serif; font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; transition:background .25s var(--ease), color .25s var(--ease);
}

/* header bar */
.topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:12px clamp(16px,5vw,40px); background:hsl(var(--background)); border-bottom:1px solid hsl(var(--border))}
.brand{display:flex; align-items:center; gap:10px}
.brand .mark{width:28px; height:28px; border-radius:8px; background:var(--submit); display:grid; place-items:center}
.brand .mark svg{width:16px; height:16px; color:#fff}
.brand .name{font-weight:600; font-size:18px; letter-spacing:-.01em}
.tools{display:flex; align-items:center; gap:8px}
.btn{display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-family:inherit; font-size:13px;
  font-weight:500; color:hsl(var(--muted-foreground)); background:transparent; border:1px solid hsl(var(--border));
  padding:7px 12px; border-radius:var(--radius); transition:background .16s var(--ease), color .16s var(--ease)}
.btn:hover{background:hsl(var(--accent)); color:hsl(var(--foreground))}
.btn.icon{padding:7px; border-color:transparent}
.btn.icon:hover{border-color:hsl(var(--border))}
.btn svg{width:15px; height:15px}

/* thread */
.thread{max-width:720px; margin:0 auto; padding:40px clamp(16px,5vw,40px) 80px}
.user-row{display:flex; justify-content:flex-end; margin-bottom:26px}
.user-bubble{max-width:82%; background:hsl(var(--secondary)); border:1px solid hsl(var(--border));
  border-radius:18px 18px 6px 18px; padding:11px 15px; font-size:15px; line-height:1.55}
.assistant{display:flex; gap:13px}
.assistant .avatar{flex:none; width:30px; height:30px; border-radius:8px; margin-top:1px; background:var(--submit); display:grid; place-items:center}
.assistant .avatar svg{width:16px; height:16px; color:#fff}
.assistant .body{flex:1; min-width:0}

/* =========================================================================
   REASONING / CHAIN-OF-THOUGHT — flat, card-less (the AI Elements look)
   ========================================================================= */
.cot{margin:2px 0 4px}

/* collapsed-default header: brain + current activity (shimmer) + duration + chevron */
.cot-head{display:flex; align-items:center; gap:8px; width:100%; padding:4px 2px; background:transparent;
  border:0; cursor:pointer; font-family:inherit; text-align:left; color:hsl(var(--muted-foreground));
  transition:color .16s var(--ease)}
.cot-head:hover{color:hsl(var(--foreground))}
.cot-head:focus-visible{outline:none; box-shadow:0 0 0 2px hsl(var(--ring)); border-radius:6px}
.cot-head .brain{width:15px; height:15px; flex:none}

/* Siri-style glowing "thinking" orb (adapted from 21st.dev, pure CSS, recolored
   to Counselle's cool palette). Rotates + glows while live; settles when done. */
@property --angle{ syntax:"<angle>"; inherits:false; initial-value:0deg; }
.orb{position:relative; width:16px; height:16px; flex:none; border-radius:50%; overflow:hidden;
  --c1:#1d4ed8; --c2:#0d9488; --c3:#22c55e; box-shadow:0 0 7px 0 rgba(13,148,136,.45)}
.orb::before{content:""; position:absolute; inset:0; border-radius:50%;
  background:
    conic-gradient(from calc(var(--angle)*1.2) at 30% 65%, var(--c3) 0deg, transparent 45deg 315deg, var(--c3) 360deg),
    conic-gradient(from calc(var(--angle)*0.8) at 70% 35%, var(--c2) 0deg, transparent 60deg 300deg, var(--c2) 360deg),
    conic-gradient(from calc(var(--angle)*-1.5) at 65% 75%, var(--c1) 0deg, transparent 90deg 270deg, var(--c1) 360deg),
    radial-gradient(ellipse 120% 80% at 40% 60%, var(--c2) 0%, transparent 50%);
  filter:blur(1.6px) contrast(1.7) saturate(1.35);
  animation:orbspin 5s linear infinite}
@keyframes orbspin{to{--angle:360deg}}
.orb::after{content:""; position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 45% 40%, rgba(255,255,255,.4), transparent 60%); mix-blend-mode:overlay}
.cot.done .orb{box-shadow:none}
.cot.done .orb::before{animation:none; opacity:.65}
@media (prefers-reduced-motion:reduce){.orb::before{animation:none}}
.now{flex:1; min-width:0; overflow:hidden}
.dur{font-size:13px; color:hsl(var(--muted-foreground)); white-space:nowrap; font-variant-numeric:tabular-nums}
.chev{width:15px; height:15px; flex:none; transition:transform .2s var(--ease)}
.cot.expanded .chev{transform:rotate(180deg)}

/* the gradient Shimmer (replicates AI Elements <Shimmer/>) */
.now .nt{display:block; font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:hsl(var(--muted-foreground))}
.now .nt q{font-style:normal; font-family:"Roboto Mono",monospace; font-size:12px; font-weight:500}
.now.live .nt{
  color:transparent; background-clip:text; -webkit-background-clip:text;
  background-image:
    linear-gradient(90deg, transparent 20%, hsl(var(--foreground)) 50%, transparent 80%),
    linear-gradient(hsl(var(--muted-foreground)),hsl(var(--muted-foreground)));
  background-size:200% 100%, 100% 100%; background-repeat:no-repeat;
  animation:shimmer 1.8s linear infinite;
}
@keyframes shimmer{0%{background-position:160% 0, 0 0} 100%{background-position:-60% 0, 0 0}}
.now .nt.swap{animation:nowIn .34s var(--ease)}
@keyframes nowIn{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:translateY(0)}}

/* expanded thread */
.rail{position:relative; margin-top:10px; padding-left:2px}
.rail[hidden]{display:none}
.node{position:relative; display:grid; grid-template-columns:22px 1fr; gap:11px; align-items:flex-start; padding-bottom:14px}
.node:last-child{padding-bottom:2px}
/* per-step connector line (ChainOfThought: line under the icon) */
.node:not(:last-child)::before{content:""; position:absolute; left:10px; top:24px; bottom:-2px; width:1px; background:hsl(var(--border))}

/* Step nodes are clean monochrome line-icons, tinted by tier (themed, so they
   adapt to light/dark on their own). No logo plates on nodes — the real logos
   live in the source chips, where favicons belong. The school is named in the
   label. db→official blue, reddit→community amber, web/viz→neutral. */
.node .ico{display:grid; place-items:center; width:22px; height:21px; color:hsl(var(--muted-foreground))}
.node .ico svg{width:16px; height:16px}

.body-col{min-width:0}
.nlabel{font-size:14px; line-height:1.5; color:hsl(var(--muted-foreground))}
.node.active .nlabel{color:hsl(var(--foreground)); font-weight:500}
.node.done .nlabel{color:hsl(var(--muted-foreground))}
.nlabel q{font-style:normal; font-family:"Roboto Mono",monospace; font-size:12.5px; color:hsl(var(--muted-foreground))}
.nstate{display:inline-flex; align-items:center; margin-left:6px; vertical-align:-2px}
.nstate svg{width:13px; height:13px}
.check{color:var(--official-text)}
.spin{width:12px; height:12px; border-radius:50%; border:1.6px solid hsl(var(--border)); border-top-color:hsl(var(--muted-foreground)); animation:spin .7s linear infinite; display:inline-block; vertical-align:-2px; margin-left:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* narration line (lighter, italic) */
.node.think{grid-template-columns:22px 1fr}
.node.think .tdot{justify-self:center; margin-top:6px; width:6px; height:6px; border-radius:50%; background:hsl(var(--border)); z-index:1}
.node.think .tline{font-style:italic; font-size:13.5px; line-height:1.5; color:hsl(var(--muted-foreground)); padding-top:1px}

/* source chips = secondary Badges with favicon */
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:2px 8px 2px 5px; border-radius:6px;
  background:hsl(var(--secondary)); border:1px solid hsl(var(--border)); font-size:12px; color:hsl(var(--secondary-foreground));
  white-space:nowrap; max-width:100%; opacity:0; transform:translateY(3px); animation:chipIn .4s var(--ease) forwards}
.chip .fav{width:15px; height:15px; border-radius:50%; flex:none; overflow:hidden; background:#fff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip .fav img{width:100%; height:100%; object-fit:cover; transform:scale(1.12); display:block}
.chip .dom{overflow:hidden; text-overflow:ellipsis; font-weight:500}
.chip.more{padding:2px 8px; color:hsl(var(--muted-foreground)); background:transparent; border-color:transparent}
@keyframes chipIn{to{opacity:1; transform:translateY(0)}}

.enter{opacity:0; transform:translateY(5px); animation:nodeIn .42s var(--ease) forwards}
@keyframes nodeIn{to{opacity:1; transform:translateY(0)}}

/* answer */
.answer{font-size:16px; line-height:1.65; color:hsl(var(--foreground)); margin-top:18px; opacity:0; transform:translateY(6px)}
.answer.show{animation:nodeIn .55s var(--ease) forwards}
.answer .caret{display:inline-block; width:2px; height:1.05em; vertical-align:-2px; background:var(--official-text); margin-left:2px; border-radius:1px; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  .enter,.chip,.answer{opacity:1!important; transform:none!important}
  .now.live .nt{color:hsl(var(--muted-foreground)); background:none; -webkit-text-fill-color:hsl(var(--muted-foreground))}
}
@media (max-width:560px){.nlabel,.node.think .tline{font-size:13.5px} .answer{font-size:15.5px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5"/></svg></span>
    <span class="name">Counselle</span>
  </div>
  <div class="tools">
    <button class="btn icon" id="theme" aria-label="Toggle theme"><svg id="themeicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="btn" id="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Replay</button>
  </div>
</header>

<main class="thread">
  <div class="user-row">
    <div class="user-bubble">Compare Stanford to MIT for computer science, and what SAT do I need? Mine’s a 1520.</div>
  </div>
  <div class="assistant">
    <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5"/></svg></div>
    <div class="body">
      <div class="cot" id="work">
        <button class="cot-head" id="workhead" aria-expanded="false">
          <span class="orb" aria-hidden="true"></span>
          <span class="now live" id="now"><span class="nt" id="nowtext">Thinking…</span></span>
          <span class="dur" id="timer"></span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="rail" id="rail" hidden></div>
      </div>
      <div class="answer" id="answer">
        <p>For CS, Stanford and MIT are about as close as two schools get, and your 1520 is competitive at both.<span class="caret"></span></p>
      </div>
    </div>
  </div>
</main>

<script>
/* Accurate Lucide geometry (the app's icon family), 1.75 stroke, round joins. */
const ic = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const I = {
  // database — the official DB pull
  db: ic('<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>'),
  // globe — the open web
  web: ic('<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'),
  // graduation-cap — a school's own site (.edu)
  edu: ic('<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5"/>'),
  // messages-square — community discussion (Reddit)
  reddit: ic('<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2Z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>'),
  // bar-chart — building a visualization
  viz: ic('<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>'),
  check: '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
};

const SEQ = [
  {dt:700,  type:'think', text:'Both are top-tier for CS, so this comes down to the details. Let me pull the hard admissions numbers for each first.'},
  {dt:600,  type:'start', id:'s1', tier:'official', icon:'db', label:'Pulling Stanford’s admissions data'},
  {dt:1100, type:'done',  id:'s1'},
  {dt:250,  type:'start', id:'s2', tier:'official', icon:'db', label:'Pulling MIT’s admissions data'},
  {dt:950,  type:'done',  id:'s2'},
  {dt:550,  type:'think', text:'Numbers alone won’t capture how they actually differ, so let me check current reporting and what students are saying.'},
  {dt:600,  type:'start', id:'s3', tier:'neutral', icon:'web', label:'Searching the web: <q>Stanford vs MIT computer science</q>'},
  {dt:1300, type:'done',  id:'s3', chips:[
      {logo:'assets/logos/stanford.png',    d:'cs.stanford.edu'},
      {logo:'assets/logos/mit.png',         d:'eecs.mit.edu'},
      {logo:'assets/logos/usnews.png',      d:'usnews.com'},
      {logo:'assets/logos/collegevine.png', d:'collegevine.com'},
      {more:'+3 more'}
  ]},
  {dt:300,  type:'start', id:'s4', tier:'community', icon:'reddit', label:'Checking r/ApplyingToCollege'},
  {dt:1050, type:'done',  id:'s4', chips:[
      {logo:'assets/logos/reddit.png', d:'“Stanford vs MIT for CS: which did you choose?”'},
      {logo:'assets/logos/reddit.png', d:'“MIT EECS culture is no joke”'},
      {more:'+5 more'}
  ]},
  {dt:600,  type:'think', text:'They’re remarkably close. Your 1520 is the deciding variable here, so let me place it against each school’s range.'},
  {dt:550,  type:'start', id:'s5', tier:'neutral', icon:'viz', label:'Building your comparison'},
  {dt:1150, type:'done',  id:'s5'},
  {dt:450,  type:'think', text:'I have everything I need. Putting it together…'},
  {dt:900,  type:'finish'}
];

const SPEED=1, MIN_DWELL=850;
const rail=document.getElementById('rail'), work=document.getElementById('work'),
      timerEl=document.getElementById('timer'), now=document.getElementById('now'),
      nowtext=document.getElementById('nowtext'), workhead=document.getElementById('workhead'),
      answer=document.getElementById('answer'), replay=document.getElementById('replay');
let timers=[], rafId=null, t0=0, finalDur='for 11s';
let expanded=false, done=false, currentActivity='Thinking…';
let activityQueue=[], pumping=false, lastShown='Thinking…';
const prefersReduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function paintNow(html, animate){
  nowtext.innerHTML=html;
  if(animate && !prefersReduced){ nowtext.classList.remove('swap'); void nowtext.offsetWidth; nowtext.classList.add('swap'); }
}
function renderHead(){
  work.classList.toggle('expanded', expanded);
  workhead.setAttribute('aria-expanded', String(expanded));
  rail.hidden = !expanded;
  if(done){ paintNow('Thought '+finalDur, false); now.classList.remove('live'); timerEl.textContent=''; }
  else if(expanded){ paintNow('Working', false); now.classList.remove('live'); }
  else { now.classList.add('live'); paintNow(currentActivity, false); pump(); }
}
function setNow(html){
  currentActivity=html;
  if(expanded || done) return;
  if(activityQueue.length ? activityQueue[activityQueue.length-1]===html : lastShown===html) return;
  activityQueue.push(html); pump();
}
function pump(){
  if(pumping || expanded || done || !activityQueue.length) return;
  pumping=true;
  const next=activityQueue.shift(); lastShown=next;
  now.classList.add('live'); paintNow(next, true);
  setTimeout(()=>{ pumping=false; pump(); }, MIN_DWELL*SPEED);
}

function addThink(text){
  setNow('Thinking…');
  const n=document.createElement('div'); n.className='node think enter';
  n.innerHTML='<span class="tdot"></span><div class="tline">'+text+'</div>';
  rail.appendChild(n);
}
function addStart(ev){
  setNow(ev.label);
  const n=document.createElement('div'); n.className='node step active enter'; n.id='node-'+ev.id;
  const ico = '<span class="ico t-'+ev.tier+'">'+I[ev.icon]+'</span>';
  n.innerHTML=ico+'<div class="body-col"><span class="nlabel">'+ev.label+'</span><span class="spin" data-spin></span></div>';
  rail.appendChild(n);
}
function addDone(ev){
  const n=document.getElementById('node-'+ev.id); if(!n)return;
  n.classList.remove('active'); n.classList.add('done');
  const sp=n.querySelector('[data-spin]'); if(sp){ sp.outerHTML='<span class="nstate">'+I.check+'</span>'; }
  if(ev.chips){
    const wrap=document.createElement('div'); wrap.className='chips';
    ev.chips.forEach((c,i)=>{
      const el=document.createElement('span');
      if(c.more){ el.className='chip more'; el.textContent=c.more; }
      else { el.className='chip'; el.innerHTML='<span class="fav"><img src="'+c.logo+'" alt=""></span><span class="dom">'+c.d+'</span>'; }
      el.style.animationDelay=(prefersReduced?0:0.10*(i+1))+'s';
      wrap.appendChild(el);
    });
    n.querySelector('.body-col').appendChild(wrap);
  }
}
function finish(){
  done=true; activityQueue=[]; pumping=false; if(rafId)cancelAnimationFrame(rafId); renderHead();
  setTimeout(()=>answer.classList.add('show'), prefersReduced?0:250);
}
function tickTimer(){
  const fn=()=>{ if(done) return; const s=((performance.now()-t0)/1000); timerEl.textContent=s.toFixed(1)+'s'; finalDur='for '+Math.round(s)+'s';
    rafId=requestAnimationFrame(fn); };
  rafId=requestAnimationFrame(fn);
}
function clearAll(){
  timers.forEach(clearTimeout); timers=[]; if(rafId)cancelAnimationFrame(rafId);
  rail.innerHTML=''; answer.classList.remove('show');
  done=false; currentActivity='Thinking…'; activityQueue=[]; pumping=false; lastShown='Thinking…';
  timerEl.textContent=''; renderHead();
}
function play(){
  clearAll();
  if(prefersReduced){
    SEQ.forEach(ev=>{ if(ev.type==='think')addThink(ev.text); else if(ev.type==='start')addStart(ev); else if(ev.type==='done')addDone(ev); });
    done=true; finalDur='for 11s'; renderHead(); answer.classList.add('show'); return;
  }
  t0=performance.now(); tickTimer(); let acc=0;
  SEQ.forEach(ev=>{ acc+=ev.dt*SPEED;
    timers.push(setTimeout(()=>{
      if(ev.type==='think')addThink(ev.text); else if(ev.type==='start')addStart(ev);
      else if(ev.type==='done')addDone(ev); else if(ev.type==='finish')finish();
    }, acc));
  });
}
