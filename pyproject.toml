[project]
name = "counselle"
version = "0.1.0"
description = "AI agent for thinking and answering about US universities — read-only consumer of the Counselle data pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "fastapi-users[oauth]>=15.0.5",
    "google-genai>=2.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-postgres>=3.1.0",
    "mcp>=1.27.2",
    "psycopg[binary]>=3.3.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.107.0",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.26.6",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "regex>=2024.11.6",
    "sse-starlette>=3.4.4",
    "sqlglot>=27.29.0",
    "structlog>=26.1.0",
    "tavily-python>=0.7.25",
    "uvicorn>=0.49.0",
    "yoyo-migrations[postgres]>=9.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.155.2",
    "mypy>=2.1.0",
    # psycopg2-binary ships the compiled module that yoyo-migrations needs at
    # runtime (`uv run yoyo apply ...`). The `yoyo-migrations[postgres]` extra only
    # pulls the SOURCE `psycopg2` distribution, which is not importable without a
    # local build toolchain — so the binary wheel must be declared explicitly.
    "psycopg2-binary>=2.9.12",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.16",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: top-level packages at the repo root (no src/), per ARCHITECTURE §5.
[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "domain",
    "app",
    "adapters",
    "api",
    "counselle_db",
    "evals",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Security() in argument
# defaults — that's the framework contract, not a B008 mutable-default bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
ignore_missing_imports = true
exclude = ["^artifacts/"]

[[tool.mypy.overrides]]
module = "domain.*"
strict = true

# PyMuPDF ships without complete type stubs, so every call into it reads as
# "untyped" under domain.*'s strict=true above. This is the one place domain/
# touches a C-extension SDK (in-memory PDF page math only, see
# tests/domain/test_purity.py's documented carve-out) — scope the relaxation
# to just this file rather than weakening domain/ strictness generally.
[[tool.mypy.overrides]]
module = "domain.cds.pages"
disable_error_code = ["no-untyped-call"]

# Pydantic deliberately coerces wire-shaped dict/list fixtures at runtime, and
# PydanticAI's Tool.function annotation still includes the takes_ctx=True call
# form even for Tool(..., takes_ctx=False). Keep those library-boundary fixture
# checks from obscuring application type errors in the canonical `mypy .` gate.
[[tool.mypy.overrides]]
module = [
    "tests.app.test_evidence_markers",
    "tests.app.test_school_workspace_live",
    "tests.app.test_school_workspace_models",
    "tests.app.test_state",
    "tests.app.test_viz_signature",
    "tests.app.test_workspace_tools_essays",
    "tests.app.test_workspace_tools_essays_content",
    "tests.app.test_workspace_tools_essays_mutations",
    "tests.app.test_workspace_tools_memory",
    "tests.app.test_workspace_tools_profile",
    "tests.domain.test_specs",
]
disable_error_code = ["arg-type", "call-arg", "index", "misc", "no-untyped-def"]

# Same PyMuPDF stub gap as domain.cds.pages (see that override above): this
# test file builds real in-memory PDFs to exercise narrow_document.
[[tool.mypy.overrides]]
module = "tests.domain.cds.test_pages"
disable_error_code = ["no-untyped-call", "no-any-return"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_db: integration tests against the live pipeline database (requires COUNSELLE_DB_RO_DSN and the DB container)",
    "live_search: integration tests against the live Tavily search API (requires TAVILY_API_KEY or COUNSELLE_TAVILY_API_KEY)",
    "live_llm: end-to-end conversations against real Gemini + DB + Tavily (slow, costs money; run serially)",
]

[tool.bandit]
# Scan the backend source only (the honesty/auth/DB paths). Tests, plans, the
# frontend, and vendored/tooling dirs are out of scope.
exclude_dirs = ["tests", "frontend", ".worktrees", ".agents", ".claude", "evals"]

[tool.coverage.run]
branch = true
source = ["config", "domain", "app", "adapters", "api", "counselle_db", "evals"]
omit = ["tests/*", "*/__pycache__/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
