    My love for robotics began in ninth grade, in three weeks of frustration.
    My line-following robot crashed, veered off course, and refused to
    cooperate. The afternoon it finally traced the whole track without
    touching the wall, I understood what I wanted to keep doing: taking an
    idea that does not work yet and tuning it until it does. Now I captain my
    school's FRC team, and the feeling is the same at a larger scale — a
    dozen people arguing over a drivetrain until the robot moves the way we
