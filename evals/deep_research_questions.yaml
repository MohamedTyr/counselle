# Deep research eval set.
#
# This runner exercises the multi-turn flow, not the one-turn MVP1 eval runner:
# request -> optional scope clarify -> backend research-plan clarify -> Run
# resume -> final cited report.
#
# All cases are live-gated by env so routine eval/test commands do not spend
# Tavily/LLM budget accidentally. Run with:
#
#   COUNSELLE_RUN_DEEP_RESEARCH_EVALS=true \
#   COUNSELLE_DEEP_RESEARCH_ENABLED=true \
#   uv run python -m evals.deep_research_runner
#
# Scenario-specific cases can add their own required env below.
#
# COUNSELLE_DEEP_RESEARCH_VERIFICATION_TIMEOUT_SCENARIO and
# COUNSELLE_DEEP_RESEARCH_GPTR_UNAVAILABLE_SCENARIO are skip-gates ONLY — no
# code reads them to simulate anything. To actually exercise those two cases
# live, pair the gate with a REAL, small override of the setting that governs
# the real condition, e.g.:
#   COUNSELLE_DEEP_RESEARCH_VERIFICATION_TIMEOUT_SCENARIO=true \
#   COUNSELLE_DEEP_RESEARCH_SOFT_TIMEOUT_S=1 \
#     uv run python -m evals.deep_research_runner --only verification-timeout-caveat
#   COUNSELLE_DEEP_RESEARCH_GPTR_UNAVAILABLE_SCENARIO=true \
#   COUNSELLE_DEEP_RESEARCH_GPTR_TIMEOUT_S=1 \
#     uv run python -m evals.deep_research_runner --only gptr-unavailable-fallback
# (verified live, 2026-07-01 — a bare-flags run without the real override
# either skips or silently runs the non-degraded path and fails on the wrong
# checks).
#
# `sources_present` checks assert against a DB-tier citation that the LOCAL dev
# contract DB (scripts/load_dev_contract_db.py, on docs/deep-research-prototype)
# can actually populate: it loads public Scorecard/IPEDS bulk downloads, but the
# Common Data Set (`cds`) has no public bulk source and is only ever populated
# by the real data pipeline's per-school scraper. Assert `scorecard` here, not
# `cds`, so this suite is runnable against the dev bootstrap DB rather than
# depending on data this repo has no way to produce locally.

- id: mit-stanford-cs-aid-testing
  question: "Deep research report comparing MIT and Stanford for undergraduate computer science admissions, financial aid, and current test policy."
  source_config:
    web: true
    edu: true
    reddit: true
  skip_unless_env:
    COUNSELLE_RUN_DEEP_RESEARCH_EVALS: "true"
    COUNSELLE_DEEP_RESEARCH_ENABLED: "true"
  expects:
    scope_clarify: false
    plan_clarify: true
    min_citations: 4
    sections:
      - Bottom line
      - Evidence coverage
      - DB-backed facts
      - Current official findings
      - Unknowns/conflicts
      - Next checks
    sources_present: [scorecard, edu]
    step_kinds_present: [db_tool, edu_search, web_search, reddit_search]
    step_ids_present:
      - research_db_check
      - research_official_search
      - research_web_search

- id: broad-schoolless-scope-gate
  # No school names and no scope-signal terms (major/aid/applicant/region/policy/
  # selectivity — see app/research/plan.py:_SCOPE_SIGNAL_TERMS) on purpose: the
  # gate only fires below _MIN_SCOPE_SIGNALS, so a prompt carrying 2+ of those
  # terms (e.g. an explicit major AND aid need) is legitimately scoped enough
  # to skip straight to planning — that's the real, working threshold, not a bug.
  question: "Do deep research on the best colleges for me."
  scope_answer: "Compare MIT, Stanford, and Carnegie Mellon for undergraduate computer science admissions, financial aid, and current test policy."
  source_config:
    web: true
    edu: true
    reddit: false
  skip_unless_env:
    COUNSELLE_RUN_DEEP_RESEARCH_EVALS: "true"
    COUNSELLE_DEEP_RESEARCH_ENABLED: "true"
  expects:
    scope_clarify: true
    plan_clarify: true
    min_citations: 3
    sources_present: [scorecard, edu]
    sources_absent: [reddit]
    step_kinds_present: [db_tool, edu_search, web_search]

- id: reddit-disabled-isolation
  question: "Run a sourced report on MIT student culture and admissions tradeoffs, but do not use Reddit."
  source_config:
    web: true
    edu: true
    reddit: false
  skip_unless_env:
    COUNSELLE_RUN_DEEP_RESEARCH_EVALS: "true"
    COUNSELLE_DEEP_RESEARCH_ENABLED: "true"
  expects:
    scope_clarify: false
    plan_clarify: true
    min_citations: 3
    sources_present: [scorecard, edu]
    sources_absent: [reddit]
    step_kinds_present: [db_tool, edu_search, web_search]
    step_kinds_absent: [reddit_search]
    caps_keys_absent: [reddit_unavailable]

- id: web-disabled-db-official-only
  question: "Deep research MIT and Stanford current undergraduate admissions and test policies using only Counselle data and official school sources."
  source_config:
    web: false
    edu: true
    reddit: false
  skip_unless_env:
    COUNSELLE_RUN_DEEP_RESEARCH_EVALS: "true"
    COUNSELLE_DEEP_RESEARCH_ENABLED: "true"
  expects:
    scope_clarify: false
    plan_clarify: true
    min_citations: 3
    sources_present: [scorecard, edu]
    sources_absent: [web, reddit]
    step_kinds_present: [db_tool, edu_search]
    step_kinds_absent: [reddit_search]

- id: verification-timeout-caveat
  # A genuine soft-timeout hit (verified live: run with a real, tiny
  # COUNSELLE_DEEP_RESEARCH_SOFT_TIMEOUT_S override, not just the scenario
  # flag below) makes research_synthesize_node use its deterministic
  # `_build_partial_report` fallback UNCONDITIONALLY (app/research/synthesize.py
  # :372) — the normal 7-section contract (Bottom line/Evidence coverage/...)
  # cannot fire once soft_timeout_hit is true; that's a coherent, intentional
  # bailout, not a bug. Assert the partial-report's own guaranteed headers.
  question: "Deep research MIT and Stanford CS admissions, aid, and test policy with a deliberately tight verification budget."
  source_config:
    web: true
    edu: true
    reddit: false
  skip_unless_env:
    COUNSELLE_RUN_DEEP_RESEARCH_EVALS: "true"
    COUNSELLE_DEEP_RESEARCH_ENABLED: "true"
    COUNSELLE_DEEP_RESEARCH_VERIFICATION_TIMEOUT_SCENARIO: "true"
  expects:
    scope_clarify: false
    plan_clarify: true
    sections:
      - Partial report
      - Still incomplete
    text_contains:
      - verification
    caps_keys_present: [verification_unavailable]

- id: gptr-enabled-supplement
  question: "Deep research Stanford undergraduate computer science admissions and current test policy with supplemental GPT-Researcher enabled."
  source_config:
    web: true
    edu: true
    reddit: false
  skip_unless_env:
    COUNSELLE_RUN_DEEP_RESEARCH_EVALS: "true"
    COUNSELLE_DEEP_RESEARCH_ENABLED: "true"
    COUNSELLE_DEEP_RESEARCH_USE_GPTR: "true"
  expects:
    scope_clarify: false
    plan_clarify: true
    min_citations: 3
    sources_present: [scorecard, edu]
    step_ids_present:
      - research_gptr_research

- id: gptr-unavailable-fallback
  question: "Deep research MIT current admissions and test policy while GPT-Researcher is intentionally unavailable."
  source_config:
    web: true
    edu: true
    reddit: false
  skip_unless_env:
    COUNSELLE_RUN_DEEP_RESEARCH_EVALS: "true"
    COUNSELLE_DEEP_RESEARCH_ENABLED: "true"
    COUNSELLE_DEEP_RESEARCH_GPTR_UNAVAILABLE_SCENARIO: "true"
  expects:
    scope_clarify: false
    plan_clarify: true
    min_citations: 2
    sources_present: [scorecard, edu]
    step_kinds_present: [db_tool, edu_search, web_search]
    caps_keys_present: [gptr_unavailable]
