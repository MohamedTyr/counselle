# The MVP1 eval set + Phase 5 narration gates + Phase 5 workspace-task gate
# + agent-essay-tools honesty gate + agent-activity-tools honesty gate
# + user-profile-and-memory Phase 6 gates — 57 questions.
#
# Authored 2026-06-11. Every `expects.values` entry for fact questions was read
# from the LIVE database at authoring time through the service layer
# (counselle_db.service.get_values → envelope display strings) — never from
# memory. Re-author values after any pipeline data reload.
#
# Shape: {id, question, type, expects} (+ optional `web: true` to enable
# Tavily web/.edu search for that question; reddit is always off in evals;
# + optional `workspace: true` to seed a real counselle.users row and pass
# its id into run_turn so the agent workspace task tools mount — ADR 0029 /
# agent-task-tools plan Risk #2. The seeded user (and anything it owns, via
# ON DELETE CASCADE) is deleted after the question runs.
# + optional `seed_memories` (list[str]) and/or `seed_documents` (list of
# {title, doc_type?, filename?, mime?, text_status?, extracted_text?,
# summary?}) — only meaningful alongside `workspace: true`; pre-populate the
# seeded user's memories/documents through the real create_memories/
# create_document services before the turn runs, so the agent's student
# context is pre-loaded exactly like a real prior session. See
# `evals/runner.py::_seed_memories` / `_seed_documents`.)
#
# Types and counts:
#   fact (22)            — single-school lookups, plus 2 profile/document-grounded
#                          checks; scored on tool + field + display value
#   field-selection (10) — the trap is picking the wrong field (R9/R11/§13 traps);
#                          scored on field keys seen in tool-call args/returns
#   clarify-judgment (8) — 4 MUST clarify + 4 must NOT; scored on the clarify event
#   honesty (10)         — judge-scored prose criteria (cheap-model judge, evals/judge.md)
#   comparison-viz (3)   — scored on viz event type + schools
#   narration-quality (2) — deterministic checks over narration/step ordering
#   workspace-task (2)   — agent workspace tools; scored on tool call + created items
#
# expects keys by type:
#   fact:            unitid, school, fields (any-of), values (any-of display strings),
#                    tools (optional override of the value-bearing tool set)
#   field-selection: unitid, school, field_in (any-of, args or returns),
#                    field_not (none-of, tool-call args only)
#   clarify-judgment: must_clarify (bool)
#   honesty:         criteria (list of judge yes/no criteria)
#   comparison-viz:  viz_type, unitids (must all appear in the viz's schools)
#   narration-quality:
#                    requires_tool_work (default true), values / forbidden_values /
#                    narration_forbidden_values / narration_forbidden_phrases,
#                    reaction_required, failure_reaction_required, failure_required
#   workspace-task:  tools (default {create_tasks}), create_tool (default
#                    "create_tasks", the batch-create tool whose args/return are
#                    read), batch_arg_key (default "tasks"), title_field (default
#                    "title"), min_tasks (default 1), title_keywords (any-of,
#                    matched case-insensitively against created item titles);
#                    optionally max_description_chars (exact len() check on a
#                    created draft's description) and reorder_tool +
#                    reorder_keyword + created_items_key (default "activities")
#                    to confirm the keyword-matching created item was reordered
#                    to rank 1 (correlated via the create tool's return payload)

