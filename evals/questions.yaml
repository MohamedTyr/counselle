# ---------------------------------------------------------------------------
# narration-quality (2)
# ---------------------------------------------------------------------------

- id: nar-duke-acceptance-no-value-leak
  type: narration-quality
  question: "What is Duke University's acceptance rate?"
  expects:
    school: Duke University
    unitid: 198419
    values: ["5.7%", "6%"]
    narration_forbidden_values: ["5.7%", "6%"]
    narration_forbidden_phrases: ["acceptance rate is", "Duke's acceptance rate"]

- id: nar-stanford-cds-retry-reaction
  type: narration-quality
  question: "What weight does Stanford give to essays and GPA in admissions — the CDS C7 factor ratings?"
  expects:
    school: Stanford University
    unitid: 243744
    values: ["Very Important", "Not Considered"]
    narration_forbidden_values: ["Very Important", "Not Considered"]
    narration_forbidden_phrases: ["essays are", "GPA is"]
    reaction_required: true

# ---------------------------------------------------------------------------
# workspace-task (1)
# ---------------------------------------------------------------------------

- id: workspace-checklist-generic
  type: workspace-task
  workspace: true
  question: "Break my college application work into a checklist of tasks: I need to request transcripts, ask for a letter of recommendation, and draft my personal essay."
  expects:
    tools: [create_tasks]
    min_tasks: 3
    title_keywords: ["transcript", "recommendation", "essay"]
