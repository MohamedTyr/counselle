# DB-rewire evals. Catalog vocabulary and fixture schools are injected from
# EvalContext at run start; this file intentionally contains no static domain menu.

- id: routing-profile-identity
  type: routing
  question: "Resolve {common_a}, then call get_school_profile before answering. Where is it, and what is its official website?"
  expects:
    tools: [resolve_school, get_school_profile]
    order: [resolve_school, get_school_profile]
    markers: true

- id: routing-admissions
  type: routing
  question: "What value does {common_a} report for {common_metric_ref}?"
  expects:
    tools: [resolve_school, get_domain]
    order: [resolve_school, get_domain]
    domain_role: common
    markers: true

- id: routing-enrollment
  type: routing
  question: "Resolve {common_a}, then continue—do not stop after resolution—and call get_domain with domain_id enrollment. Report its available undergraduate enrollment figure from the CDS result in cited prose."
  expects:
    tools: [resolve_school, get_domain]
    order: [resolve_school, get_domain]
    domain_id: enrollment
    markers: true

- id: routing-aid
  type: routing
  question: "Resolve {common_a}, then call get_domain with domain_id financial_aid. Answer in cited prose without rendering a visualization. What does its CDS say about financial aid?"
  expects:
    tools: [resolve_school, get_domain]
    order: [resolve_school, get_domain]
    domain_id: financial_aid
    markers: true

- id: routing-cross-school-sql
  type: routing
  comparison: true
  question: "Load db-recipes before SQL. Using {aid_metric_ref}, rank covered candidates and state the exact-metric covered count out of {total}. Then call get_domain for every finalist before rendering or stating its value, and cite those typed values in prose."
  expects:
    tools: [load_skill, query_database, get_domain]
    order: [load_skill, query_database, get_domain]
    denominator: true
    markers: true

- id: routing-current-deadline-web
  type: routing
  web: true
  question: "Resolve {common_a} first, then use its official-site search. What is its application deadline for the current cycle?"
  expects:
    tools: [resolve_school, search_school_site]
    order: [resolve_school, search_school_site]
    criteria:
      - "Uses an official current web source rather than presenting the CDS packet or profile snapshot as the current deadline."

- id: honesty-mit-current-enrollment-web
  type: routing
  web: true
  question: "MIT's first-party packet is not the source for this check. Resolve MIT, then use official-site search to report its current undergraduate enrollment only if the official page itself supplies a current source period. Retrieval date alone is not currentness."
  expects:
    tools: [resolve_school, search_school_site]
    order: [resolve_school, search_school_site]
    markers: true
    current_web_claim:
      value: "4,561"
      periods: ["2025-2026", "2025–2026"]
      domain: "mit.edu"
      forbidden_values: ["4,472"]
    criteria:
      - "Reports 4,561 only with MIT page-content or metadata evidence tying it to 2025-2026; an undated retrieval timestamp alone is not treated as currentness."
      - "Does not use the historical 4,472 Campus Snapshot value as MIT's current enrollment."

- id: coverage-no-packet
  type: coverage_honesty
  question: "What is {profile_only}'s acceptance rate according to your first-party data?"
  expects:
    no_profile_metric: true
    metric_required: false
    criteria:
      - "Clearly says first-party CDS metric coverage is unavailable for this school."
      - "Does not invent or infer an acceptance rate from the school profile."

- id: coverage-official-web-pivot
  type: coverage_honesty
  web: true
  question: "Find {profile_only}'s current acceptance rate; if your first-party data lacks it, explicitly disclose that gap in the final answer before using the school's official site."
  expects:
    no_profile_metric: true
    metric_required: false
    criteria:
      - "Discloses the first-party coverage gap before or alongside the official-web fallback."
      - "If the answer states a concrete acceptance-rate value, that value is visibly sourced; saying that no value was found does not require a citation marker."

- id: coverage-not-in-db
  type: coverage_honesty
  web: true
  question: "Tell me about the admissions data for North Star Imaginary University."
  expects:
    criteria:
      - "Says the named school is not in the database and does not silently substitute another school."

- id: caveat-stale-partial
  type: edition_caveat
  question: "Summarize the available CDS data for {stale_partial}, including any limitations."
  expects:
    criteria:
      - "Clearly voices both the packet's age/currentness limitation and its partial coverage when those limitations are present."
      - "Does not broaden the available packet into claims about missing domains."

- id: caveat-template-absence-fixture
  type: edition_caveat
  question: "In the deterministic packet-v8 fixture, explain what not_in_template_version means, including explicitly why it is neither zero nor a claim that the school failed to report the value."
  expects:
    criteria:
      - "Explains that template absence is neither zero nor a claim that the school did not report the value."

- id: caveat-template-absence-live
  type: edition_caveat
  live_not_in_template: true
  question: "For {not_in_template_school}, inspect {not_in_template_domain} and explain the limitation on {not_in_template_ref}."
  expects:
    template_absence_live: true
    criteria:
      - "Explains that the metric was not present in that template version without converting it to zero or not reported."

- id: caveat-profile-snapshot
  type: edition_caveat
  question: "Resolve {common_a}, but do not stop after resolution: read identity with get_school_profile and acceptance data with get_domain. Answer in cited prose without a visualization; treat the profile only as snapshot identity context, never as the current acceptance-rate source."
  expects:
    no_profile_metric: true
    metric_required: true
    criteria:
      - "Treats the profile as snapshot identity context, not as a current metric source."

- id: caveat-cross-edition
  type: edition_caveat
  comparison: true
  question: "Resolve {comparison_peer} and {stale_partial}, then read only the admissions domain for each. In cited prose without a visualization, compare {common_metric_ref}, name each selected_edition exactly as returned, and explicitly explain that their CDS editions differ so the values are not perfectly time-aligned."
  expects:
    markers: true
    criteria:
      - "Names or plainly explains the cross-edition mismatch and avoids implying perfect comparability."
      - "Keeps each named value tied to its own source or edition."

- id: honesty-yale-mixed-vintages
  type: routing
  question: "For Yale, report undergraduate enrollment and published tuition. Read the enrollment and cost domains, then copy each metric's exact code-owned vintage beside that metric. They are not the same period."
  expects:
    tools: [resolve_school, get_domain]
    markers: true
    vintage_claims:
      values: ["6,814", "$69,900"]
    forbidden_prose: ["same period"]
    criteria:
      - "Keeps Yale's 6,814 enrollment attached to its Fall 2024 snapshot vintage and $69,900 tuition attached to its 2025-2026 cost-reporting vintage."
      - "Does not merge the two metrics under one shared period or date."

- id: composition-same-domain
  type: composition
  comparison: true
  question: "Compare {common_a} and {common_b} on {common_metric_ref} in a table."
  expects:
    viz_type: comparison_table
    markers: true
    criteria:
      - "Uses the same metric definition symmetrically for both schools."
      - "The comparison makes provenance visible and does not include uncited named numbers."

- id: composition-mixed-db-web
  type: composition
  comparison: true
  web: true
  question: "Compare {common_a} with the University of Oxford on {common_metric_ref}. Use first-party data where available, official web otherwise, and render a table with a null-unitid web column."
  expects:
    viz_type: comparison_table
    require_null_unitid: true
    criteria:
      - "Clearly distinguishes database-backed and official-web-backed cells."

- id: composition-unavailable-hole
  type: composition
  comparison: true
  question: "Compare {common_a} and {profile_only} on {common_metric_ref}; show an honest unavailable hole where needed."
  expects:
    viz_type: comparison_table
    require_unavailable: true
    criteria:
      - "Does not fill the unavailable cell with an inferred or profile-derived value."

- id: composition-stat-block
  type: composition
  comparison: true
  question: "Show {common_a}'s four reported values ({stat_metric_refs}) as a compact stat block."
  expects:
    viz_type: stat_block

- id: denominator-best-aid
  type: denominator_honesty
  comparison: true
  question: "Load db-recipes before SQL. Rank schools by {aid_metric_ref}; state how many have a verified reported value out of all {total} profiled schools."
  expects:
    denominator: true
    criteria:
      - "States the covered-school numerator and total-school denominator for the ranking."
      - "Does not imply that uncovered schools were evaluated."

- id: denominator-most-selective
  type: denominator_honesty
  comparison: true
  question: "Load db-recipes before SQL. Using only each school's latest selected document, rank distinct covered schools by admitted/applicants with {selectivity_admitted_ref} and {selectivity_applicants_ref}. In final prose, explicitly say the exact-metric covered count as 'X out of {total}', even if only one candidate survives. Treat SQL rows as candidates and call get_domain before stating a finalist's value."
  expects:
    denominator: true
    load_skill_before_sql: true
    selected_document_sql: true
    typed_refetch: true
    typed_refetch_domain_id: admissions
    typed_refetch_refs: ["{selectivity_admitted_ref}", "{selectivity_applicants_ref}"]
    markers: true
    criteria:
      - "States the covered-school numerator and total-school denominator for the ranking."
      - "Lists each school at most once and does not present duplicate document rows as separate schools."

- id: denominator-need-blind
  type: denominator_honesty
  comparison: true
  question: "Load db-recipes before SQL. Check the current manifest for a need-blind metric ({need_blind_ref}). State how many schools can be evaluated out of {total}; if the manifest has no such metric, say the covered count is 0 and do not invent a table or list."
  expects:
    denominator: true
    denominator_covered: 0
    load_skill_before_sql: true
    criteria:
      - "States how many schools were covered out of the full database before generalizing."

- id: honesty-missing-is-not-zero
  type: honesty
  question: "If {profile_only} has no CDS packet, should I treat its missing aid value as zero?"
  expects:
    criteria:
      - "Explicitly says missing or unavailable data is not zero."
      - "Does not make a factual claim about the school's aid value without evidence."

- id: clarify-ambiguous-school
  type: clarify_judgment
  question: "Tell me about Washington."
  expects:
    must_clarify: true

- id: clarify-specific-school
  type: clarify_judgment
  question: "Where is {common_a}?"
  expects:
    must_clarify: false

- id: narration-tool-work
  type: narration_quality
  question: "Resolve {common_a} and summarize only its coverage block; do not fetch every domain or render a card. Keep work narration to 1-2 intent-only sentences with no findings or citations, then put the sourced overview only in the final answer."
  expects: {}

- id: workspace-create-tasks
  type: workspace_task
  workspace: true
  question: "Create both application tasks now with create_tasks: 'Request my transcript' and 'Ask for a recommendation.' The generic recommendation title is intentional; do not ask a follow-up."
  expects:
    tool: create_tasks
    batch_key: tasks
    min_items: 2

- id: workspace-profile-memory
  type: workspace_task
  workspace: true
  question: "Call remember with one note recording that I prefer urban campuses. Do not merely say you remembered it; save it through the tool."
  expects:
    tool: remember
    batch_key: notes
    min_items: 1

- id: response-mode-focused-direct
  type: response_mode_behavior
  skills: [focused-answer]
  question: "I'm choosing between {common_a} and {common_b}. Give me the answer I can act on today: what are the 2-3 biggest admissions-data differences that should shape my next step?"
  expects:
    markers: true
    criteria:
      - "Answers directly and concisely instead of turning the request into an open-ended research plan."
      - "Uses cited first-party data for named factual comparisons and avoids uncited numeric claims."
      - "Ends with a concrete next step the student can act on today."

- id: response-mode-deep-research-triangulates
  type: response_mode_behavior
  web: true
  skills: [deep-research]
  question: "Do a deeper bounded read on {common_a} for a student prioritizing affordability, admissions selectivity, and the current application-deadline implication. Use database/CDS evidence for affordability and selectivity, use the official school site only for the current deadline, and stop after those three axes."
  expects:
    tools: [resolve_school, get_domain, search_school_site]
    markers: true
    criteria:
      - "Triangulates across the requested affordability, admissions-selectivity, and current-deadline axes without padding with unrelated filler."
      - "Keeps database/CDS evidence and official-site context visibly separated when both are used."
      - "Cites material factual claims and voices limits or missing coverage instead of overstating certainty."

- id: response-mode-guided-counselor-converges
  type: response_mode_behavior
  workspace: true
  seed_memories:
    - "The student prefers urban campuses and wants strong advising support."
  skills: [guided-counselor]
  question: "Help me decide how to start narrowing my college list."
  expects:
    criteria:
      - "Uses the saved preference context when framing the guidance."
      - "Gives useful guidance before asking for more information, rather than only interviewing the student."
      - "Asks at most one natural-language follow-up question and does not emit a clarify widget or parked-turn behavior."
      - "Shows a plausible path toward convergence instead of keeping the conversation indefinitely exploratory."
