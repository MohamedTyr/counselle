# ---------------------------------------------------------------------------
# fact — user-profile-and-memory Phase 6 gates (2)
# ---------------------------------------------------------------------------

# Profile-update: a stated application fact (Part E playbook — "my SAT came
# back — 1520") must land in update_profile with the *exact* numbers, and the
# agent must confirm what changed. Reuses the fact scorer verbatim: tools
# override to update_profile (not a DB tool), fields are the typed
# SatScore keys the tool call must carry, values are the same numbers,
# expected verbatim in the confirmation prose. Argument-VALUE assertion
# (not just "the right field key was touched") is a scope limit of the
# current fact scorer's field_used check — it does substring search over the
# tool-call args blob, so `fields: ["1520", "740"]` doubles as an
# args-contain-these-numbers check here; no scorer changes were needed.
- id: profile-update-sat-scores
  type: fact
  workspace: true
  question: "Just got my SAT back — 1520, 740 on reading."
  expects:
    tools: [update_profile]
    fields: ["1520", "740"]
    values: ["1520", "740"]

# Document-grounded: a transcript is seeded directly (not via the extraction
# pipeline — that's covered elsewhere) with specific grade detail that is
# NOT in its summary line, so the student-context block alone cannot answer
# the question — the agent must call read_document to ground its answer.
# fields checks the tool actually returned the specific grade detail (proof
# the call happened and the return carried real content, not the summary);
# values checks the same detail survived into the final prose, so the
# answer is sourced from the document rather than invented.
- id: profile-document-grounded-grades
  type: fact
  workspace: true
  seed_documents:
    - title: "Lincolnview HS Transcript"
      doc_type: transcript
      filename: transcript.txt
      mime: text/plain
      text_status: extracted
      summary: "Official high school transcript on file."
      extracted_text: |
        Lincolnview High School — Official Transcript
        Student: Jordan Rivera
        Cumulative GPA (Unweighted): 3.85
        Senior Year Courses:
        AP Chemistry — A-
        AP Calculus BC — B+
        AP Literature — A
  question: "What do you know about my grades?"
  expects:
    tools: [read_document]
    fields: ["3.85", "AP Chemistry"]
    values: ["3.85"]

