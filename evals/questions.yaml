- id: fs-osu-undergrad-not-fte
  type: field-selection
  question: "How many undergrads attend Ohio State's main campus?"
  expects:  # R11 — headcount, never FTE
    school: Ohio State University-Main Campus
    unitid: 204796
    field_in: [enrollment.undergrad_total]
    field_not: [enrollment.fte]

- id: fs-asu-undergrad-not-fte
  type: field-selection
  question: "How many undergraduate students go to Arizona State's in-person Campus Immersion campus?"
  expects:  # R11 + campus disambiguation
    school: Arizona State University Campus Immersion
    unitid: 104151
    field_in: [enrollment.undergrad_total]
    field_not: [enrollment.fte]

- id: fs-michigan-total-not-fte
  type: field-selection
  question: "How big is the University of Michigan-Ann Arbor overall — total students including grad students?"
  expects:  # R11 — total headcount for whole-institution size, never FTE
    school: University of Michigan-Ann Arbor
    unitid: 170976
