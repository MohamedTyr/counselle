<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Counselle Dev Harness</title>
  <link rel="stylesheet" href="/harness/style.css" />
</head>
<body>

<header id="header">
  <h1>Counselle</h1>
  <span id="session-label">no session</span>
  <button id="new-chat-btn">New chat</button>
  <div id="source-toggle">
    <button id="source-btn">Sources ▾</button>
    <div id="source-panel">
      <div class="src-row disabled">
        <input type="checkbox" id="src-db" checked disabled />
        <label for="src-db">DB (always on)</label>
      </div>
      <div class="src-row">
        <input type="checkbox" id="src-web" />
        <label for="src-web">Web</label>
      </div>
      <div class="src-row">
        <input type="checkbox" id="src-edu" />
        <label for="src-edu">.edu</label>
      </div>
      <div class="src-row">
        <input type="checkbox" id="src-reddit" />
        <label for="src-reddit">Reddit</label>
      </div>
      <div id="subreddit-section">
        <div class="subreddit-label">Subreddits (uncheck to exclude):</div>
        <div id="subreddit-list"></div>
      </div>
    </div>
  </div>
</header>

<main id="messages"></main>

<div id="input-area">
  <textarea id="msg-input" rows="1" placeholder="Ask about any college…"></textarea>
  <button id="send-btn">Send</button>
</div>

<!-- Citation popover (singleton) -->
<div id="cite-popover" role="tooltip" aria-live="polite"></div>

<script type="module" src="/harness/viz.js"></script>
<script type="module" src="/harness/clarify.js"></script>
<script type="module" src="/harness/app.js"></script>
</body>
</html>
