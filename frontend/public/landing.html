<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counselle</title>
    <style>
      /*
       * Standalone static page — outside the React app's token build, so
       * these are literal values (mirrors of frontend/src/styles/
       * primitives.css + semantic.css at time of writing: canvas
       * neutral-25, surface-raised neutral-0, ink neutral-900, ink-muted
       * neutral-600, edge neutral-200, brand plum-600). Keep this list the
       * single place any of these values live in this file.
       */
      :root {
        color-scheme: light;
        --canvas: #fcfcfc;
        --surface-raised: #ffffff;
        --surface-sunken: #f0f0f0;
        --ink: #0e0e0e;
        --ink-muted: #525252;
        --edge: #dbdbdb;
        --brand: #6f3a78;
        --brand-hover: #55285c;
        --on-brand: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 30% 10%, rgba(135, 80, 144, 0.05), transparent 30rem),
          var(--canvas);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }
      section {
        display: grid;
        width: min(64rem, 100%);
        gap: 1.5rem;
      }
      .card {
        border: 1px solid var(--edge);
        border-radius: 1.125rem;
        background: var(--surface-raised);
        padding: clamp(1.5rem, 4vw, 3rem);
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        letter-spacing: -0.06em;
        line-height: 0.95;
      }
      p {
        margin: 1rem 0 0;
        max-width: 42rem;
        color: var(--ink-muted);
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        margin-top: 1.5rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.625rem;
        background: var(--brand);
        color: var(--on-brand);
        padding: 0 1.1rem;
        font-weight: 650;
        text-decoration: none;
      }
      a:hover {
        background: var(--brand-hover);
      }
      .screenshot {
        border: 1px solid var(--edge);
        border-radius: 0.875rem;
        background: var(--surface-sunken);
        padding: 1rem;
      }
      .screenshot img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 0.625rem;
      }
      @media (max-width: 720px) {
        main {
          padding: 1rem;
        }
      }
    </style>
    <script>
      fetch("/v1/me", { credentials: "same-origin" })
        .then((response) => {
          if (response.ok) window.location.replace("/app/ai");
        })
        .catch(() => {});
    </script>
  </head>
  <body>
    <main>
      <section>
        <div class="card">
          <h1>Counselle</h1>
          <p>
            An AI counselor that knows the student, answers with evidence, and turns
            advice into an application plan.
          </p>
          <a href="/login">Sign in</a>
        </div>
        <div class="screenshot">
          <img
            alt="Counselle workspace showing a task created from an admissions plan"
            decoding="async"
            height="700"
            src="/landing-workspace-preview.webp"
            width="1038"
          />
        </div>
      </section>
    </main>
  </body>
</html>
